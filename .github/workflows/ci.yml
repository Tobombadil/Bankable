name: ci

# Blocking gates on every push/PR against main (docs/04 O-3). No model identifiers appear anywhere
# in this file, its job names, or its log output by construction (CLAUDE.md, docs/04 E-15).
#
# Design notes recorded here rather than only in docs/60-deployment.md §9, so a reviewer sees the
# reasoning next to the code it explains:
#
#   - `web/` runs as its OWN job (`test-web`), never combined with `pipeline`/`services` in one
#     pytest invocation. Combining them exhibits real cross-suite state pollution (a services/ingest
#     test fails only when web/'s tests are collected in the same process) — the same reason
#     services/README.md and web/README.md's own verbatim test runs already exclude each other.
#     Isolating them is the fix, not a workaround for "web is mid-edit".
#   - `tests/test_web_default_view.py` is excluded from `test-core` (it imports `web.data_loading`,
#     which has a documented pre-existing bug outside this task's write scope — services/README.md
#     "Loader fixes (2026-09-13)" section names it) and belongs with `test-web` in spirit, not
#     `test-core`; it is left for whoever owns `web/` to un-skip.
#   - The OpenAPI "generated == committed, byte-for-byte" check (docs/04 E-8, docs/23 §12): the
#     hand-written api/openapi.yaml is the contract and `services.api.app` implements a subset of
#     it (measured 2026-09-18: 120 of its 135 path operations; the 15 missing are listed by the
#     step itself). A byte-for-byte diff therefore fails for coverage, not drift, until the last
#     operation lands. The step now measures the real gap on every run (operations the spec has
#     that the app lacks, and the reverse — the reverse must be empty) and stays
#     `continue-on-error: true`; flip it off the day its output is "0 missing".
#   - Images are pushed by .github/workflows/release.yml (push to main and v* tags), not here;
#     the `images` job below only proves the build and runs the trivy scan on every PR.
#   - `import-linter`'s config lives at `infra/importlinter.ini`, not a root `.importlinter` file or
#     a `pyproject.toml` section — this task's write scope does not include either (see that file's
#     header comment).
#   - `gitleaks`' config lives at `infra/gitleaks.toml` for the same reason, allowlisting three
#     known, checked non-secrets (see that file's header comment).
#   - `axe`/Lighthouse CI (D-30, D-31) run against `web/`, which this task must not modify; they are
#     defined per the standard but were not executed against a live environment in this task's
#     validation (docs/60-deployment.md §9) — there is no ephemeral host to point them at yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . --extend-per-file-ignores "infra/scheduler/test_cadence.py:S101"
      - run: ruff format --check .

  typecheck:
    name: mypy --strict (pipeline, services, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy
      - run: mypy --strict --follow-imports=silent infra/
        # infra/entrypoint.py imports services.api.app and web.app, which the plain `mypy` run above
        # already checks under pyproject.toml's settings (warn_unused_ignores off); without
        # --follow-imports=silent the strict flags here would re-check those trees with different
        # rules and fail on their `# type: ignore` hygiene rather than on infra (2026-09-19).

  import-boundaries:
    name: import-linter (docs/04 E-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt import-linter
      - run: lint-imports --config infra/importlinter.ini --no-cache

  test-core:
    name: pytest (pipeline, services, tests — excludes web, see header note)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest with branch coverage, 80% floor (docs/04 E-7)
        run: |
          coverage run --branch -m pytest tests pipeline services infra \
            --ignore=tests/test_web_default_view.py
          coverage report --include="pipeline/*,services/*" --fail-under=80
        # `infra` covers infra/scheduler plus infra/test_compose.py, test_scripts.py,
        # test_entrypoint.py, test_logging_config.py and test_observability.py (2026-09-18).
        # Measured on the 2026-09-18 tree: 88% total, so the 80% floor is a real, passing gate.
      - name: visibility predicate at 100% branch coverage (report-only, see comment)
        continue-on-error: true
        run: |
          coverage report --include="services/api/visibility.py" -m --fail-under=100
          coverage report --include="services/ingest/loader.py" -m
        # docs/04 E-7 asks for 100% branch coverage on the visibility predicate. Measured on the
        # 2026-09-18 tree: services/api/visibility.py 96% (27 statements, 1 missed — line 164, the
        # opportunity arm of `event_visibility_filter`'s correlated EXISTS, which the suite reaches
        # only through the proposal arm); the file was also being edited by the visibility lane
        # during that measurement. So this is `--fail-under=100` with `continue-on-error: true`:
        # it prints the exact missing lines on every run and blocks nothing until a test covers
        # them, at which point remove `continue-on-error`. services/ingest/loader.py (87%) also
        # carries non-gate field-mapping logic (services/README.md open decision 11) and stays
        # under the 80% floor above; the licence-gate paths in it are proven by two named tests
        # (test_gate_refused_for_reuse_value_outside_the_known_vocabulary,
        # test_gate_refused_when_stored_licence_is_gated_even_if_the_manifest_now_says_open).

  test-web:
    name: pytest (web) — isolated job, see header note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest web -v
        # web/'s own suite builds its SQLite fixture via web.data_loading.load_dev_database
        # (web/test_e2e.py, web/test_build_data.py) — no separate `web.build_data` step needed.

  connector-fixtures:
    name: connector fixtures (parse() only — never live network, docs/20 §3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest pipeline/connectors -v
        # `fetch()` — the only network-calling method — is never invoked by this suite; only
        # `parse()`/`normalize()` run, against recorded fixtures (docs/20 §3.1, pipeline/README.md).
        # This job has no network egress permission in a hardened runner if one is configured
        # later; today it is enforced by the test suite's own design, not a runner-level firewall.

  api-contract:
    name: OpenAPI validity, story coverage, contract test (docs/04 E-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt openapi-spec-validator
      - run: python -m openapi_spec_validator api/openapi.yaml
      - run: python api/check_story_coverage.py --quiet
      - run: pytest tests/test_api_contract.py -v
      - name: generated spec == committed spec (docs/04 E-8) — report-only until 0 operations are missing
        continue-on-error: true # see header note: measured 120/135 operations implemented on 2026-09-18
        run: |
          python - <<'PY'
          import sys, yaml
          from services.api.app import app
          methods = {"get", "post", "put", "patch", "delete"}
          def ops(paths):
              return {(m.upper(), p) for p, item in paths.items() for m in item if m in methods}
          generated = ops(app.openapi()["paths"])
          committed = ops(yaml.safe_load(open("api/openapi.yaml"))["paths"])
          extra = sorted(generated - committed)
          missing = sorted(committed - generated)
          print(f"committed operations: {len(committed)}; implemented: {len(generated)}; "
                f"missing from the app: {len(missing)}; not in the spec: {len(extra)}")
          for m, p in missing:
              print(f"  missing  {m} {p}")
          for m, p in extra:
              print(f"  UNSPECIFIED  {m} {p}")
          # Anything the app serves that the contract does not document is drift and must fail
          # even while the coverage gap is tolerated.
          sys.exit(1 if (missing or extra) else 0)
          PY

  migrations:
    name: alembic upgrade/downgrade/upgrade (docs/04 E-11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: infraque_ci
          POSTGRES_USER: infraque
          POSTGRES_PASSWORD: infraque-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infraque -d infraque_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1,<4"
      - env:
          DATABASE_URL: postgresql+psycopg://infraque:infraque-ci-only@localhost:5432/infraque_ci
        run: |
          alembic -c services/db/migrations/alembic.ini upgrade head
          alembic -c services/db/migrations/alembic.ini downgrade -1
          alembic -c services/db/migrations/alembic.ini upgrade head
        # First real execution of this migration against real Postgres (services/README.md's own
        # "Postgres vs Sqlite" caveat: "It has not been executed against a live database"). If this
        # job is red on the first run after this workflow lands, that is the migration being
        # proven, not this workflow being wrong.

  security:
    name: gitleaks + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: gitleaks (infra/gitleaks.toml — see its header comment)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks detect --source . --no-git --config infra/gitleaks.toml -v
      - run: pip install -r requirements.txt pip-audit
      # Three advisories cannot be fixed yet: gridstatus 0.36.0 (the ISO queue parsers, docs/20
      # §3.1) pins cryptography<47, lxml~=5.3 and setuptools<79, so the patched releases do not
      # resolve. Ignored by id with the upstream pin as the reason, tracked in docs/00-PLAN.md;
      # remove each line the day gridstatus relaxes the pin. starlette's advisories are fixed by
      # the fastapi/starlette floor in requirements.txt (2026-09-15).
      - run: |
          pip-audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-87 \
            --ignore-vuln PYSEC-2026-3447

  docs-link-check:
    name: docs link check (docs/04 O-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: internal cross-reference check (docs/*.md, README.md files)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          skip = {".venv", "node_modules", ".git"}
          def files():
              for pattern in ("docs/**/*.md", "**/README.md"):
                  for f in root.glob(pattern):
                      if skip.isdisjoint(f.parts):
                          yield f
          md_files = sorted(set(files()))
          link_re = re.compile(r"\]\(([^)]+)\)")
          bad = []
          for f in md_files:
              text = f.read_text(errors="ignore")
              for m in link_re.finditer(text):
                  target = m.group(1).split("#")[0]
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (f.parent / target).resolve()
                  if not resolved.exists():
                      bad.append(f"{f}: broken relative link -> {target}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"checked {len(md_files)} markdown files, no broken relative links")
          PY

  images:
    name: build images (api, web, worker, browser-worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          push: false
          tags: infraque-api:ci
          load: true  # trivy below scans the local daemon; buildx keeps images in its cache unless loaded (second CI run, 2026-09-15)
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: web
          push: false
          tags: infraque-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: worker
          push: false
          tags: infraque-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build browser-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.browser-worker
          push: false
          tags: infraque-browser-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy scan (api image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; tags carry a v prefix and 0.24.0 never existed (first CI run, 2026-09-15)
        with:
          image-ref: infraque-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Debian marks several HIGH findings in the slim base as "affected"/"fix deferred"/"will
          # not fix" with no package to upgrade to; a gate that fails on those can never pass, so
          # only findings with a published fix fail the build. `.trivyignore` at the repo root lists
          # the fixable finding blocked by an upstream pin, with the reason (first scan, 2026-09-15).
          ignore-unfixed: "true"
          trivyignores: .trivyignore

  a11y-and-performance:
    name: axe + Lighthouse CI (docs/04 D-30, D-31)
    runs-on: ubuntu-latest
    # Not executed against a live environment by this task (docs/60-deployment.md §9) — there is
    # no ephemeral preview host to point it at yet (that doc's §11 item 6). Defined so the gate
    # exists and is visibly not green-by-default; flip continue-on-error off once `preview-deploy`
    # below is unstubbed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: serve api + web in the background (web/dev_up.py)
        run: |
          nohup python -m web.dev_up --preview > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
      - name: axe-core scan (map, list, detail — D-30)
        run: |
          npm install --no-save @axe-core/cli
          # The runner image ships a chromedriver matched to its Chrome under $CHROMEWEBDRIVER;
          # axe's bundled driver was one major version ahead of the runner's Chrome on the first
          # CI run (2026-09-15: driver 153, browser 152) and refused to start a session.
          npx axe http://127.0.0.1:8000/ http://127.0.0.1:8000/proposals http://127.0.0.1:8000/about \
            --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" \
            --exit
      - name: Lighthouse CI (D-31 budgets)
        run: |
          npm install --no-save @lhci/cli
          npx lhci autorun \
            --collect.url=http://127.0.0.1:8000/ \
            --collect.url=http://127.0.0.1:8000/proposals \
            --assert.assertions.categories:performance=off \
            --upload.target=filesystem --upload.outputDir=/tmp/lhci

  preview-deploy:
    name: preview deploy (stub — needs an environment secret)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    # A stub must never turn a PR red: with no PREVIEW_DEPLOY_TOKEN in the `preview` environment
    # the step below exits 0 after saying so, and continue-on-error keeps any other failure in
    # this job (a missing environment, a future provisioning error) out of the merge gate until
    # the job does real work (docs/60-deployment.md §11 item 6).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: preview host provisioning — STUBBED
        run: |
          if [[ -z "${PREVIEW_DEPLOY_TOKEN}" ]]; then
            echo "PREVIEW_DEPLOY_TOKEN is not set in the 'preview' environment; nothing to deploy to. Skipping."
            exit 0
          fi
          echo "Stubbed: no ephemeral-host decision has been made yet"
          echo "(docs/60-deployment.md §11 item 6 — shared host vs one VM per PR)."
          echo "This job exists so the 'preview' GitHub environment and its secret gate are"
          echo "real and reviewable now; wire the steps below once that decision is made:"
          echo "  1. provision or reuse a preview host"
          echo "  2. docker compose -f infra/compose/docker-compose.yml up -d --build"
          echo "     (seeded fixture database, no outbound to sources/social/CRM, docs/04 O-1)"
          echo "  3. comment the preview URL on the PR"
        env:
          # Real value lives in the 'preview' GitHub Actions environment, never in this file
          # (docs/04 E-19). Referencing it here is what makes this job "stubbed behind an
          # environment secret" rather than unconditionally open.
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
