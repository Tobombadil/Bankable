name: flood-layer

# Builds the floodplain files the powered-land site finder reads (docs/00-PLAN.md owner decision
# 2026-10-22; docs/25 section 5; source us.fema.nfhl): FEMA NFHL Special Flood Hazard Area polygons
# clipped to 2 miles around 69 kV-and-up lines, the other mapped zones, and the effective FIRM panel
# footprint, per state, as GeoParquet on R2. National NFHL is tens of GB, so nothing national is
# downloaded: each state job fetches only its two layers by HTTP range and deletes them after clipping.
#
# Quarterly cron (FEMA republishes state files monthly as studies and LOMRs go effective; a quarter is
# fresh enough for siting) plus workflow_dispatch, with an optional state list for a partial rebuild:
# the manifest then carries every other state forward from latest.json under its own version key, so
# a partial rebuild never removes a state. A full build that would drop a state of the last build fails
# unless `allow_dropped_states` names it. Runs in the `production` Environment with the R2 values
# basemap.yml reads; without them the plan job says so with a warning and every later job is skipped
# (the job stays green, as basemap.yml does).
#
# infra/scripts/build_flood_layer.sh writes every file under a new version key first and copies the
# manifest to latest.json last, in a job that runs only when every state succeeded: a failed run
# changes nothing the finder reads. Re-running the failed state jobs re-runs publish.
#
# The module's tests need shapely (and pyogrio for one), which requirements.txt does not carry yet
# (docs/25 section 5.8 item 1), so ci.yml's core suite skips them. The `test` job runs them with both
# installed: on every pull request that touches the flood files or a file they read, and before every
# build. It needs no secrets and no network, and no secret reaches it (the R2 values are set on the
# build jobs only); on a pull request it is the only job that runs.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes to rebuild; the others carry forward (empty: a full build)"
        type: string
        default: ""
      allow_dropped_states:
        description: "Full build only: states of the last build it may leave out (space separated)"
        type: string
        default: ""
  schedule:
    - cron: "41 4 3 1,4,7,10 *" # 04:41 UTC on the 3rd of Jan/Apr/Jul/Oct; off the hour (docs/60 section 9)
  pull_request:
    branches: [main]
    paths:
      - pipeline/context/fema_nfhl.py
      - pipeline/context/test_fema_nfhl.py
      - pipeline/context/fixtures/fema_nfhl/**
      - pipeline/connectors/http.py
      # Read by the module or its tests: the source row and registry, the data root, the default lines
      # input, the state shapes, and the pinned dependencies.
      - pipeline/connectors/registry.py
      - pipeline/connectors/store.py
      - pipeline/context/lbnl_transmission.py
      - data/sources.yaml
      - data/vendored/regions/us_states.geojson
      - requirements.txt
      - infra/scripts/build_flood_layer.sh
      - .github/workflows/flood-layer.yml

permissions:
  contents: read

concurrency:
  # One build at a time (two would race on latest.json); a pull request's test run has its own group,
  # so it never waits behind a build that takes hours.
  group: flood-layer-${{ github.event_name == 'pull_request' && github.ref || 'build' }}
  cancel-in-progress: false

# No secret here: this env reaches the pull-request `test` job too. The R2 account and bucket are set on
# each build job (plan, state, publish), which run only outside pull requests.
env:
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  # The contact URL in the User-Agent FEMA sees (pipeline/connectors/http.py).
  BANKABLE_DOMAIN: ${{ vars.DOMAIN || 'inframation.io' }}

jobs:
  test:
    name: tests (recorded fixtures, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install (the versions build_flood_layer.sh installs)
        run: pip install -r requirements.txt "shapely==2.1.2" "pyogrio==0.11.1"
      - name: the geometry stack imports (so no test below can skip for want of it)
        run: python -c "import shapely, pyogrio; print('shapely', shapely.__version__, 'pyogrio', pyogrio.__version__)"
      - name: pytest pipeline/context/test_fema_nfhl.py
        run: python -m pytest pipeline/context/test_fema_nfhl.py -q -rs -p no:cacheprovider

  plan:
    name: areas of interest
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # The object storage bucket deploy-beta creates (infra/ci/beta.sh BUCKET_PREFIX + "-production"),
      # not the public tiles bucket: these files feed the finder's build, they are not served to browsers.
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'beta-object-storage-production' }}
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
      states: ${{ steps.plan.outputs.states }}
    steps:
      - name: R2 credentials present?
        id: creds
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_ACCESS_KEY_ID}" || -z "${R2_SECRET_ACCESS_KEY}" ]]; then
            echo "::warning::the R2 account id or token is not set in the 'production' environment; flood layer not built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --max-keys 1 --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >/dev/null 2>&1; then
            echo "::warning::the bucket ${R2_BUCKET} does not exist yet (deploy-beta creates it); flood layer not built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: version
        id: version
        run: echo "version=$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        if: steps.creds.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: build the areas of interest (infra/scripts/build_flood_layer.sh plan)
        id: plan
        if: steps.creds.outputs.ready == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLOOD_VERSION: ${{ steps.version.outputs.version }}
          STATES: ${{ inputs.states }}
        # Assigned first: inside `echo "...$(cmd)"` a failing plan would leave echo's status (0) as the
        # step's, and the failure would surface later as a matrix error. Checked as a JSON list too.
        run: |
          states="$(infra/scripts/build_flood_layer.sh plan)"
          python -c 'import json, sys; v = json.loads(sys.argv[1]); sys.exit(0 if isinstance(v, list) else f"plan printed {v!r}, not a JSON list")' "$states"
          echo "states=${states}" >> "$GITHUB_OUTPUT"

  state:
    name: ${{ matrix.state }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.states != '[]'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # The object storage bucket deploy-beta creates (infra/ci/beta.sh BUCKET_PREFIX + "-production"),
      # not the public tiles bucket: these files feed the finder's build, they are not served to browsers.
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'beta-object-storage-production' }}
    strategy:
      fail-fast: false
      max-parallel: 3 # FEMA's servers: three range readers at a time, each at most one request per 2 s
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - name: free disk for the largest states (Texas writes 1.3 GB, Florida and Louisiana more)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: fetch, clip and upload (infra/scripts/build_flood_layer.sh state)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLOOD_VERSION: ${{ needs.plan.outputs.version }}
        run: infra/scripts/build_flood_layer.sh state "${{ matrix.state }}"

  publish:
    name: manifest and latest.json
    needs: [plan, state]
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.states != '[]'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # The object storage bucket deploy-beta creates (infra/ci/beta.sh BUCKET_PREFIX + "-production"),
      # not the public tiles bucket: these files feed the finder's build, they are not served to browsers.
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'beta-object-storage-production' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: publish (infra/scripts/build_flood_layer.sh publish)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLOOD_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_STATES: ${{ join(fromJSON(needs.plan.outputs.states), ' ') }}
          # Set: a partial build (the others carry forward). Empty on the quarterly schedule.
          STATES: ${{ inputs.states }}
          ALLOW_DROPPED_STATES: ${{ inputs.allow_dropped_states }}
        run: infra/scripts/build_flood_layer.sh publish
