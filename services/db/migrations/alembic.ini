[alembic]
script_location = %(here)s
prepend_sys_path = . services
version_path_separator = os

# sqlalchemy.url is intentionally absent: services/db/migrations/env.py reads DATABASE_URL from
# the environment (CLAUDE.md — secrets/config from environment only). Point it at a Postgres 16
# instance with the postgis extension available; there is no SQLite fallback for this migration
# (see services/README.md "Postgres vs SQLite").

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
