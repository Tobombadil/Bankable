          description: The registry's stated length, else the geodesic length of the stored line; null for a point asset.
        geometry:
          description: >-
            Detail responses only (absent on list rows). The line, simplified to ~75 m, for a line asset; the
            representative point otherwise; null when the asset has no geometry or its licence forbids raw
            publication (then a `redactions[]` row names `geometry`).
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPoint'
            - $ref: '#/components/schemas/GeoJsonLineString'
            - $ref: '#/components/schemas/GeoJsonMultiLineString'
