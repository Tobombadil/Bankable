      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminProposal'
    AdminOpportunityDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminOpportunity'
    MergeRequest:
      type: object
      required: [absorb_public_id, preview]
      properties:
        absorb_public_id:
          $ref: '#/components/schemas/ProposalPublicId'
        preview:
          type: boolean
          description: '`true` computes the result without writing.'
        preview_token:
          type: [string, 'null']
          description: Required when `preview = false`; from the preview response.
        field_choices:
          type: object
          description: Per-field pick where the two records disagree, `surviving` or `absorbed`.
          additionalProperties:
            type: string
            enum: [surviving, absorbed]
        reason:
          type: string
          description: Required when `preview = false`.
    MergeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [preview, surviving, absorbed, moved]
              properties:
                preview:
                  type: boolean
                preview_token:
                  type: [string, 'null']
                  description: Present on previews; valid 15 minutes.
                surviving:
                  $ref: '#/components/schemas/AdminProposal'
                absorbed:
                  $ref: '#/components/schemas/AdminProposal'
                conflicts:
                  type: array
                  description: Fields where the two records disagree, with both values and their provenance.
                  items:
                    type: object
                    required: [field, surviving_value, absorbed_value]
                    properties:
                      field:
                        type: string
                      surviving_value: {}
                      absorbed_value: {}
                      chosen:
                        type: string
                        enum: [surviving, absorbed]
                moved:
                  type: object
                  properties:
                    proposal_source_ids:
                      type: array
                      items:
                        type: string
                    match_ids:
                      type: array
                      items:
                        $ref: '#/components/schemas/MatchPublicId'
                    document_ids:
                      type: array
                      items:
                        $ref: '#/components/schemas/DocumentPublicId'
                event_id:
                  oneOf:
                    - $ref: '#/components/schemas/EventPublicId'
                    - type: 'null'
                  description: The `merged` event, on a real merge.
    UnmergeRequest:
      type: object
      required: [merge_event_id, reason]
      properties:
        merge_event_id:
          $ref: '#/components/schemas/EventPublicId'
        reason:
          type: string
    UnmergeResponse:
      allOf:
