    servers: *admin_servers
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: adminGetSource
      tags: [Admin — sources]
      summary: Source detail with runtime state
      x-tier: admin
      x-status: live
      x-sprint: 2
      x-prd-stories: [US-904]
      security: *sec_admin
      responses:
        '200':
          description: The source.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSourceDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
