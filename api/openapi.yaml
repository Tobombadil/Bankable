          minimum: 0
          description: '`map.layer_toggled` only.'
        count_off:
          type: integer
          minimum: 0
          description: '`map.layer_toggled` only.'
    UiEventsSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
