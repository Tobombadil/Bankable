          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/OpportunityStatus'
        identifiers:
          $ref: '#/components/schemas/OpportunityIdentifiers'
        clear_overrides:
          type: array
          items:
            type: string
        reason:
          type: string
    AdminOrganizationUpdate:
