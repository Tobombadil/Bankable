          $ref: '#/components/schemas/SubscriptionStatus'
    KeyRevoked:
      name: revoked
      in: query
      description: '`false` (default) lists active keys only.'
      schema:
        type: boolean
        default: false
    ActorUserId:
      name: actor_user_id
      in: query
      schema:
        $ref: '#/components/schemas/UserPublicId'
    DayFrom:
      name: 'day[from]'
      in: query
      schema:
        type: string
        format: date
    DayTo:
      name: 'day[to]'
      in: query
