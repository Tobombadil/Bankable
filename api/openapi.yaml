        content_type:
          type: string
        fetched_url:
          type: string
          format: uri
        http_status:
          type: integer
        retrieved_at:
          type: string
          format: date-time
        licence_id:
          $ref: '#/components/schemas/LicenceIdValue'
        parser_version:
