      type: object
      required: [name]
      properties:
        name:
          type: string
          enum: [map.layer_toggled, map.region_jumped, map.basemap_failed, auth.registered, alert.created]
        props:
          type: object
          description: At most 8 keys; allowed keys and types depend on `name` (docs/21 §3.21). No identifier-shaped value (email, IP, UUID, or a 20+ character token) is ever accepted.
          maxProperties: 8
    UiEventsSummaryRow:
      type: object
      required: [week, name, count]
