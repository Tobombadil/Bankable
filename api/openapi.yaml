# ───────────────────────────── §9.1 Outbound webhooks — API tier, scope write:webhooks ─────────────────────────────
webhooks:
  event.published:
    post:
      operationId: webhookEventPublished
      summary: An event matching the endpoint's query was published to the key's tier
      description: |
        Delivered as `POST` JSON to the endpoint URL with headers `X-Platform-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "t.body">`, 5-minute tolerance), `X-Platform-Delivery-Id` and
        `X-Platform-Event-Seq`. A `2xx` within 10 s is success. Retries: 5 attempts over ~6 hours with exponential
        backoff and jitter; then the delivery is `failed`; after 24 consecutive failures the endpoint is `paused`
        and the account emailed. Ordering is by `seq` per endpoint but not guaranteed across retries; dedupe on
        `data.event.id`. The payload is tier-filtered and licence-gated exactly like a `GET` on the same key.
      x-tier: api
      x-prd-stories: [US-703, US-502]
      parameters:
        - $ref: '#/components/parameters/WebhookSignatureHeader'
        - $ref: '#/components/parameters/WebhookDeliveryIdHeader'
        - $ref: '#/components/parameters/WebhookEventSeqHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEventPublished'
            examples:
              status_change:
                $ref: '#/components/examples/WebhookEventPublished'
      responses:
        '2XX':
          description: Acknowledged. Any other status, or no response within 10 s, is retried.
  match.added:
    post:
      operationId: webhookMatchAdded
      summary: A match was added on a subject matching the endpoint's query
      x-tier: api
      x-prd-stories: [US-703, US-401]
      parameters:
        - $ref: '#/components/parameters/WebhookSignatureHeader'
        - $ref: '#/components/parameters/WebhookDeliveryIdHeader'
        - $ref: '#/components/parameters/WebhookEventSeqHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMatchChanged'
      responses:
        '2XX':
          description: Acknowledged.
  match.removed:
    post:
      operationId: webhookMatchRemoved
      summary: A match was removed
      x-tier: api
      x-prd-stories: [US-703, US-401]
      parameters:
        - $ref: '#/components/parameters/WebhookSignatureHeader'
        - $ref: '#/components/parameters/WebhookDeliveryIdHeader'
        - $ref: '#/components/parameters/WebhookEventSeqHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMatchChanged'
      responses:
        '2XX':
          description: Acknowledged.
  record.unpublished:
    post:
      operationId: webhookRecordUnpublished
      summary: A record previously delivered to this endpoint was unpublished or taken down
      description: Consumers must stop displaying the record (US-905 AC2). The payload carries the public id and the reason class only, never the takedown text.
      x-tier: api
      x-prd-stories: [US-703, US-905]
      parameters:
        - $ref: '#/components/parameters/WebhookSignatureHeader'
        - $ref: '#/components/parameters/WebhookDeliveryIdHeader'
        - $ref: '#/components/parameters/WebhookEventSeqHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRecordUnpublished'
      responses:
        '2XX':
          description: Acknowledged.
  webhook.test:
    post:
      operationId: webhookTest
      summary: Test delivery requested via `POST /v1/webhooks/{webhook_id}/test`
      x-tier: api
      x-prd-stories: [US-703]
      parameters:
        - $ref: '#/components/parameters/WebhookSignatureHeader'
        - $ref: '#/components/parameters/WebhookDeliveryIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTest'
      responses:
        '2XX':
          description: Acknowledged.

components:
  # ───────────────────────────── §5 Authentication and key scopes ─────────────────────────────
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: bk_live_<32 random bytes, base62> or bk_test_<…>
      description: |
        `Authorization: Bearer bk_live_…`. `bk_test_` keys read the same data with a separate quota. Shown once,
        stored as SHA-256 (US-701 AC2); revocation effective ≤ 60 s. The role list on each operation's security
        requirement names the **scopes** the key needs (docs/23 §5):

        | Scope | Grants |
        |---|---|
        | `read:public` | Delayed tier only — the default for a free key |
        | `read:live` | Zero-lag reads across proposals, opportunities, events, matches, organizations |
        | `read:bulk` | `/v1/bulk/*` NDJSON streams and CSV export endpoints |
        | `write:webhooks` | Manage webhook endpoints and replay deliveries |
        | `admin:*` | Admin API; never issued to a customer key; operator sessions only |

        A key never exceeds its plan's tier: `scopes ∩ plan_tier` is evaluated at request time from the entitlement
        mirror (TTL ≤ 15 min). A missing or invalid key on a public path falls back to the public tier rather than
        failing; on a Pro/API/admin-only path it is `401 unauthenticated`.
    Session:
      type: apiKey
      in: cookie
      name: session
      description: |
        Signed HTTP-only `Secure` `SameSite=Lax` cookie backed by a revocable server-side `session` row
        (docs/20 §7; docs/04 S-2). Issued by passwordless magic link or Google sign-in. The role list on a security
        requirement names the entitlement (`pro`, `api`) or `user.role` (`member`, `owner`) required; an empty
        list means any signed-in user. Concurrent sessions above `account.seats` answer `403 seat_limit`.
    AdminSession:
      type: apiKey
      in: cookie
      name: admin_session
      description: |
        Session on the `admin.` host for users with `user.role` ∈ {`operator`, `owner`}; second factor enforced by
        the identity provider; optional IP allowlist. The role list names the role required (`operator`, `owner`,
        or `legal` for licence-gate changes — see api/README.md open decisions on the `legal` role). Every write
        is audit-logged as an `event` with `actor_type = user`.

  # ───────────────────────────── Headers (docs/23 §1, §6; docs/04 API-6, API-7, API-9) ─────────────────────────────
  headers:
    X-Request-Id:
      description: Request identifier; also in every problem body and quoted in support requests.
      schema:
        type: string
        pattern: '^req_[0-9a-z]{6,32}$'
        examples: [req_9f2c1a]
    RateLimit-Limit:
      description: Request quota for the current window (IETF RateLimit header fields draft).
      schema:
        type: integer
        minimum: 0
        examples: [600]
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
        examples: [597]
    RateLimit-Reset:
      description: Seconds until the window resets (delta-seconds).
      schema:
        type: integer
        minimum: 0
        examples: [1432]
    RateLimit-Policy:
      description: 'Names the window and class, e.g. `600;w=3600;policy="pro-read"`; `bulk` and `search` classes are separate windows (docs/23 §6).'
      schema:
        type: string
        examples: ['600;w=3600;policy="pro-read"']
    Retry-After:
      description: Seconds to wait (rate limit) or the RFC 9110 date of midnight UTC (daily quota).
      schema:
        type: string
        examples: ['120', 'Sun, 13 Sep 2026 00:00:00 GMT']
    ETag:
      description: Entity tag on public GETs; honour `If-None-Match` for `304`. Absent on Pro/API responses.
      schema:
        type: string
    Cache-Control:
      description: '`public, max-age=300` on public GETs; `private, no-store` on Pro/API/admin responses.'
      schema:
        type: string
        examples: ['public, max-age=300', 'private, no-store']
    Deprecation:
      description: Present only when the operation or version is deprecated (RFC 9745 / draft); the value is the deprecation date. Pairs with `Sunset`.
      schema:
        type: string
        format: date-time
    Sunset:
      description: 'RFC 8594: the date after which the operation or version stops responding. Announced ≥ 6 months ahead (docs/04 API-7). Absent unless deprecated.'
      schema:
        type: string
        examples: ['Sat, 13 Mar 2027 00:00:00 GMT']
    Location:
      description: Surviving public id's URL on `301` (merged record).
      schema:
        type: string
        format: uri

  # ───────────────────────────── Parameters ─────────────────────────────
  parameters:
    # Pagination and expansion (docs/23 §7)
    Limit:
      name: limit
      in: query
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BulkLimit:
      name: limit
      in: query
      description: Page size on bulk streams. Default 1,000, max 1,000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    Cursor:
      name: cursor
      in: query
      description: Opaque base64 of `(sort key, tiebreaker id)` from a previous `page.next_cursor` / `prev_cursor`; valid 24 h. Malformed or expired → `400 invalid_cursor`.
      schema:
        type: string
        maxLength: 512
    Include:
      name: include
      in: query
      description: Opt-in expansions, each costing a documented extra query. `count` adds `meta.total`; `sources`, `matches`, `events` inline the related collections (first page only).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [count, sources, matches, events]
    IncludeRaw:
      name: include
      in: query
      description: '`raw` requests the verbatim source row; answered only where the licence has `allows_raw_publication = true`, otherwise `403 licence_gated`.'
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [raw]
    Q:
      name: q
      in: query
      description: Full-text + trigram + exact identifier match (queue id, FERC docket, EIA plant/generator id). An exact identifier hit is the first result (US-103 AC1). Counted in the `search` rate window.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    SlugFilter:
      name: slug
      in: query
      description: Exact match on the record's SEO slug (`docs/30-design-ia.md`'s `/proposals/{slug}` / `/opportunities/{slug}` URLs). One value, not comma-separated — slugs are unique per kind. A working substitute for a dedicated slug-keyed detail route (`web/README.md` "Missing from the API" item 1); it does not implement `slug_history` 301 redirects for merged/renamed records, which stay out of scope this sprint (docs/21 §6.3).
      schema:
        type: string
        minLength: 1
        maxLength: 80
    # Sorting — allowlisted per resource
    SortProposals:
      name: sort
      in: query
      description: 'Comma-separated, `-` for descending. Allowlist: `last_changed`, `first_seen`, `capacity_mw`, `name_canonical`. Default `-last_changed`.'
      schema:
        type: string
        pattern: '^-?(last_changed|first_seen|capacity_mw|name_canonical)(,-?(last_changed|first_seen|capacity_mw|name_canonical))*$'
        default: '-last_changed'
    SortOpportunities:
      name: sort
      in: query
      description: 'Allowlist: `due_at`, `open_at`, `last_changed`, `budget_amount`. Default `due_at`.'
      schema:
        type: string
        pattern: '^-?(due_at|open_at|last_changed|budget_amount)(,-?(due_at|open_at|last_changed|budget_amount))*$'
        default: due_at
    SortEvents:
      name: sort
      in: query
      description: 'Allowlist: `seq`, `observed_at`. Default `-seq`.'
      schema:
        type: string
        pattern: '^-?(seq|observed_at)(,-?(seq|observed_at))*$'
        default: '-seq'
    SortMatches:
      name: sort
      in: query
      description: 'Allowlist: `score`, `first_matched_at`. Default `-score`.'
      schema:
        type: string
        pattern: '^-?(score|first_matched_at)(,-?(score|first_matched_at))*$'
        default: '-score'
    # Proposal filters (US-102 AC1)
    ProposalKind:
      name: kind
      in: query
      description: Proposal kind; comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProposalKind'
    Technology:
      name: technology
      in: query
      description: Normalised technology tokens (see `/v1/meta/vocabularies`); comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          examples: [bess_li_ion, solar_pv]
    LifecycleState:
      name: lifecycle_state
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/LifecycleState'
    Jurisdiction:
      name: jurisdiction
      in: query
      description: ISO 3166-2 (`US-TX`, `GB-ENG`) or ISO 3166-1 for country-level rows; comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Z]{2}(-[A-Z0-9]{1,3})?$'
    Iso:
      name: iso
      in: query
      description: Market operator token (`CAISO`, `ERCOT`, `NYISO`, `ISONE`, `SPP`, `MISO`, `PJM`); comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    StateCode:
      name: state
      in: query
      description: '`location.state_code` (ISO 3166-2 subdivision); comma-separated for OR.'
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Z]{2}-[A-Z0-9]{1,3}$'
    CountyFips:
      name: county_fips
      in: query
      description: US county FIPS (5 digits); comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: '^[0-9]{5}$'
    Placement:
      name: placement
      in: query
      description: >-
        Placement grade (ADR 0008, derived from `location.precision`, docs/21 §3.7): `exact`
        (point, joinable to assets), `region` (county/state/country polygon with a count, never a
        point), `none` (unplaced — list/search/alerts only). Comma-separated for OR. Default
        `exact,region` on `GET /v1/proposals/geo` (controls which features are drawn, never
        `meta.unplaced_count`, which always counts every `none`-grade record matching the other
        filters); no default on `GET /v1/proposals` (omitted, every grade is returned).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [exact, region, none]
    AssetType:
      name: asset_type
      in: query
      description: Asset type (docs/21 §3.22, ADR 0008); comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AssetType'
    IncludeSubsidiaries:
      name: include_subsidiaries
      in: query
      description: >-
        `true` also spans the organisation's direct subsidiaries (`parent_org_id` links, one level): the group
        parent the ownership lane links (e.g. a holding company over nine operating pipeline companies) holds no
        `asset_owner` edge of its own. Default `false`.
      schema:
        type: boolean
        default: false
    AssetOwnerRoleFilter:
      name: role
      in: query
      description: '`asset_owner.role` (docs/21 §3.23); comma-separated for OR. Unknown values are rejected.'
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AssetOwnerRole'
    AssetOrganizationFilter:
      name: organization
      in: query
      description: Organisation public id (owner or operator, via `asset_owner`); comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OrganizationPublicId'
    RadiusKm:
      name: radius_km
      in: query
      description: Search radius in kilometres. Default 25, maximum 100.
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 100
        default: 25
    RegionLevel:
      name: level
      in: query
      required: true
      description: Region granularity.
      schema:
        type: string
        enum: [county, state, country]
    RegionIds:
      name: ids
      in: query
      description: >-
        `region_id`s to return (`county_fips` for `level=county`, `state_code` for `level=state`,
        ISO 3166-1 alpha-2 for `level=country`); comma-separated, at most 500. Omitted returns
        every region at that level.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 500
        items:
          type: string
    SponsorId:
      name: sponsor_id
      in: query
      description: Organization public id of the sponsor.
      schema:
        $ref: '#/components/schemas/OrganizationPublicId'
    IssuerId:
      name: issuer_id
      in: query
      description: Organization public id of the issuer.
      schema:
        $ref: '#/components/schemas/OrganizationPublicId'
    SourceIdFilter:
      name: source_id
      in: query
      description: Registry source id (`data/sources.yaml`); comma-separated for OR. A restricted or unknown-terms source id matches nothing on non-admin tiers.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SourceIdValue'
    CapacityMwGte:
      name: 'capacity_mw[gte]'
      in: query
      schema:
        type: number
        minimum: 0
    CapacityMwLte:
      name: 'capacity_mw[lte]'
      in: query
      schema:
        type: number
        minimum: 0
    StorageMwhGte:
      name: 'storage_mwh[gte]'
      in: query
      schema:
        type: number
        minimum: 0
    CapacitySoughtMwGte:
      name: 'capacity_sought_mw[gte]'
      in: query
      schema:
        type: number
        minimum: 0
    BudgetAmountGte:
      name: 'budget_amount[gte]'
      in: query
      description: In the opportunity's `budget_currency`; no conversion.
      schema:
        type: number
        minimum: 0
    FirstSeenFrom:
      name: 'first_seen[from]'
      in: query
      schema:
        type: string
        format: date-time
    FirstSeenTo:
      name: 'first_seen[to]'
      in: query
      schema:
        type: string
        format: date-time
    LastChangedFrom:
      name: 'last_changed[from]'
      in: query
      schema:
        type: string
        format: date-time
    LastChangedTo:
      name: 'last_changed[to]'
      in: query
      schema:
        type: string
        format: date-time
    UpdatedSince:
      name: updated_since
      in: query
      description: Records whose `last_changed` (or, for organizations and matches, `updated_at`) is at or after this instant. The incremental-sync parameter.
      schema:
        type: string
        format: date-time
    # Opportunity filters (US-301 AC2)
    OpportunityKind:
      name: kind
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OpportunityKind'
    OpportunityStatus:
      name: status
      in: query
      description: Default `open` on the list endpoint; pass `status=open,closed,awarded` or any set to widen.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OpportunityStatus'
    Technologies:
      name: technologies
      in: query
      description: Any-of over the opportunity's `technologies[]`; comma-separated. All-source opportunities (empty array) match every value.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    DueAtFrom:
      name: 'due_at[from]'
      in: query
      schema:
        type: string
        format: date-time
    DueAtTo:
      name: 'due_at[to]'
      in: query
      schema:
        type: string
        format: date-time
    OpenAtFrom:
      name: 'open_at[from]'
      in: query
      schema:
        type: string
        format: date
    OpenAtTo:
      name: 'open_at[to]'
      in: query
      schema:
        type: string
        format: date
    # Organization filters
    OrganizationType:
      name: type
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/OrganizationType'
    Country:
      name: country
      in: query
      description: ISO 3166-1 alpha-2; comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Z]{2}$'
    IsCuratedIssuer:
      name: is_curated_issuer
      in: query
      schema:
        type: boolean
    # Event filters (US-703 AC1)
    Since:
      name: since
      in: query
      description: Event `seq` watermark (integer) or RFC 3339 timestamp; events strictly after it. Pairs with `cursor` for resumable, exactly-once consumption.
      schema:
        oneOf:
          - type: integer
            format: int64
            minimum: 0
          - type: string
            format: date-time
    SubjectType:
      name: subject_type
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SubjectType'
    SubjectId:
      name: subject_id
      in: query
      description: Public id of the subject (`prop_…`, `opp_…`, `org_…`, `mat_…`).
      schema:
        $ref: '#/components/schemas/AnyPublicIdValue'
    EventType:
      name: event_type
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventType'
    ChangedKey:
      name: changed_key
      in: query
      description: Canonical field name present in `changed_keys`; comma-separated for OR.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    ObservedAtFrom:
      name: 'observed_at[from]'
      in: query
      schema:
        type: string
        format: date-time
    ObservedAtTo:
      name: 'observed_at[to]'
      in: query
      schema:
        type: string
        format: date-time
    # Map (US-104)
    Bbox:
      name: bbox
      in: query
      required: true
      description: '`min_lon,min_lat,max_lon,max_lat` in WGS 84. Antimeridian-crossing boxes are two requests.'
      schema:
        type: string
        pattern: '^-?[0-9]{1,3}(\.[0-9]+)?,-?[0-9]{1,2}(\.[0-9]+)?,-?[0-9]{1,3}(\.[0-9]+)?,-?[0-9]{1,2}(\.[0-9]+)?$'
        examples: ['-106.6,25.8,-93.5,36.5']
    Zoom:
      name: zoom
      in: query
      required: true
      description: Web-Mercator zoom level driving the cluster radius. Clusters split into markers when ≤ 500 records are visible, regardless of zoom (docs/04 D-10).
      schema:
        type: integer
        minimum: 0
        maximum: 22
    # Match filters (US-401)
