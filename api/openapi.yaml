        type: string
        format: date
    CostPurpose:
      name: purpose
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [extract, adjudicate, draft, classify, other]
    GroupBy:
      name: group_by
      in: query
      description: Aggregation keys; default `source_id,day`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [purpose, source_id, day, model_alias]
        default: [source_id, day]
    # Feeds
    FeedFormat:
      name: format
      in: path
      required: true
      description: '`rss` → RSS 2.0 (`application/rss+xml`); `json` → JSON Feed 1.1 (`application/feed+json`).'
      schema:
        type: string
        enum: [rss, json]
    FeedFormatQuery:
      name: format
      in: query
      description: Default `rss`.
      schema:
        type: string
        enum: [rss, json]
        default: rss
    # Path ids
    ProposalPublicId:
      name: public_id
      in: path
