      tags: [Admin — sources]
      summary: Run now
      description: Enqueues a `source_run` with `trigger = manual` (US-904 AC2). Refused with `409` while a run is already in progress for the source.
      x-tier: admin
      x-status: live
      x-sprint: 2
      x-prd-stories: [US-904]
