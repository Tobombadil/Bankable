      required: [extraction_id, subject_type, subject_id, purpose, payload, confidence, citations, status, source_id, licence_id, created_at]
      properties:
        extraction_id:
          $ref: '#/components/schemas/ExtractionPublicId'
        document_id:
          oneOf:
            - $ref: '#/components/schemas/DocumentPublicId'
            - type: 'null'
        subject_type:
          type: string
          enum: [proposal, opportunity, organization]
        subject_id:
          $ref: '#/components/schemas/AnyPublicIdValue'
        purpose:
