    description: Feeds and sitemaps on the product host.

paths:
  # ───────────────────────────── §3.1 Public — delayed, no key required ─────────────────────────────
  /v1/proposals:
    get:
      operationId: listProposals
      tags: [Proposals]
      summary: List proposals
      description: |
        Paginated list with the core fields (US-101 AC1): `name_canonical`, `kind`, `technology`, `capacity_mw`,
        `storage_mwh`, `jurisdiction`, `location.state_code` / `county_name`, `lifecycle_state`, `last_changed`,
        `source_count`. Default sort `-last_changed`. Public tier returns records whose `public_at <= now()` only
        (US-101 AC3); nothing from a gated, restricted or unknown-terms source at any tier (US-101 AC4).
        `source_count` is computed over visible sources only. `Accept: text/csv` returns an export stream on Pro+
        with provenance columns and a leading `#` licence block (US-105 AC2). Append `.rss` or `.json` to the path
        for the feed twin (`/feeds/proposals.{format}`).
      x-tier: public
      x-status: planned
      x-sprint: 2
      x-prd-stories: [US-101, US-102, US-103, US-105, US-601, US-604, US-703]
      security: *sec_public
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/SortProposals'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/ProposalKind'
        - $ref: '#/components/parameters/Technology'
        - $ref: '#/components/parameters/LifecycleState'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/Iso'
        - $ref: '#/components/parameters/StateCode'
        - $ref: '#/components/parameters/CountyFips'
        - $ref: '#/components/parameters/Placement'
        - $ref: '#/components/parameters/SponsorId'
        - $ref: '#/components/parameters/SourceIdFilter'
        - $ref: '#/components/parameters/CapacityMwGte'
        - $ref: '#/components/parameters/CapacityMwLte'
        - $ref: '#/components/parameters/StorageMwhGte'
        - $ref: '#/components/parameters/FirstSeenFrom'
        - $ref: '#/components/parameters/FirstSeenTo'
        - $ref: '#/components/parameters/LastChangedFrom'
        - $ref: '#/components/parameters/LastChangedTo'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/SlugFilter'
      responses:
        '200':
          description: A page of proposals inside the attribution envelope.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalListResponse'
              examples:
                public:
                  $ref: '#/components/examples/ProposalListPublic'
            text/csv:
              schema:
                $ref: '#/components/schemas/CsvExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ForbiddenTier'
        <<: *common_errors

  /v1/proposals/geo:
    get:
      operationId: getProposalsGeo
      tags: [Map, Proposals]
      summary: Map payload — clustered proposals within a bounding box
      description: |
        Returns a GeoJSON `FeatureCollection` for the viewport (US-104). Accepts every filter of `GET /v1/proposals`
        so list, map and feed share one filter grammar (docs/04 D-4).

        **Placement grades (ADR 0008, docs/21 §3.7), derived from `location.precision`, never stored:**
        `exact` → `exact` (drawn as a point/cluster, joinable to assets); `county_centroid`, `state_centroid`,
        `country_centroid` → `region` (drawn as a `feature_kind: region` feature — `region_level`, `region_id`
        [`county_fips` / `state_code` / `country`], `name`, `count`, `lifecycle_state_counts`, `technology_counts`,
        `capacity_mw_sum`; the geometry is the region's representative point, never a polygon — the filled polygon a
        client draws comes from `GET /v1/geo/regions`, keyed by `region_id`); `unknown` → `none` (never drawn,
        counted in `meta.unplaced_count` only). `exact`-grade proposals cluster server-side by `zoom` (docs/04
        D-10) below the split threshold (≤ 500 visible records); above it, `cluster` features. The `placement`
        filter (csv of `exact,region,none`, default `exact,region` here) controls which grades render as features
        — it never changes `meta.unplaced_count`, `totals.records`, `lifecycle_state_counts` or `technology_counts`,
        which always cover every visible record matching the other filters. `county_fips` filters records to the
        listed county FIPS codes (any placement grade).

        **Restricted-precision rule (docs/04 D-9, US-104 AC3).** A record whose geometry provenance is a source with
        `allows_raw_publication = false` or `reuse_class ∈ {restricted, unknown}` never renders an exact point on a
        non-admin surface: the county centroid (else the state centroid) is returned with `precision =
        county_centroid` (else `state_centroid`) and `precision_reason = licence`, the record is grouped into the
        matching `region` feature rather than drawn as a `proposal` feature, `placement=exact` does not select it
        and `placement=region` does (the grade is judged as served, not as stored), and the detail envelope lists a
        `redactions[]` entry with reason `licence_precision`. Records whose only evidence is restricted are absent
        from every count.

        Budget: ≤ 2,000 features, ≤ 300 KB gzipped, p95 ≤ 400 ms (docs/04 D-13, E-16).
      x-tier: public
      x-status: planned
      x-sprint: 2
      x-prd-stories: [US-104, US-102, US-601]
      security: *sec_public
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Zoom'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/ProposalKind'
        - $ref: '#/components/parameters/Technology'
        - $ref: '#/components/parameters/LifecycleState'
        - $ref: '#/components/parameters/Jurisdiction'
        - $ref: '#/components/parameters/Iso'
        - $ref: '#/components/parameters/StateCode'
        - $ref: '#/components/parameters/CountyFips'
        - $ref: '#/components/parameters/Placement'
        - $ref: '#/components/parameters/SponsorId'
        - $ref: '#/components/parameters/SourceIdFilter'
        - $ref: '#/components/parameters/CapacityMwGte'
        - $ref: '#/components/parameters/CapacityMwLte'
        - $ref: '#/components/parameters/StorageMwhGte'
        - $ref: '#/components/parameters/FirstSeenFrom'
        - $ref: '#/components/parameters/FirstSeenTo'
        - $ref: '#/components/parameters/LastChangedFrom'
        - $ref: '#/components/parameters/LastChangedTo'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Clustered features for the viewport inside the attribution envelope.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoResponse'
              examples:
                clusters:
                  $ref: '#/components/examples/GeoClusters'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        <<: *common_errors

  /v1/proposals/{public_id}:
    parameters:
      - $ref: '#/components/parameters/ProposalPublicId'
    get:
      operationId: getProposal
      tags: [Proposals]
      summary: Proposal detail
      description: |
        Canonical fields, the `provenance[]` sources panel (one row per visible `proposal_source`: source name,
        `source_record_id` where the licence allows, `retrieved_at`, licence badge, `source_url`; gated rows
        omitted entirely, docs/21 §8 item 3), sponsor summary and linked organisations (US-201 AC1, US-203 AC1).
        For attribution-with-restriction sources (CAISO) the raw row is not returned; derived fields plus a
        "view at source" link are (US-201 AC2). A merged record answers `301` with `Location` set to the surviving
        public id (US-201 AC3); an unpublished or taken-down record answers `410`. On the public tier the record is
        rendered as of `now − lag` and `meta.data_as_of` states the cut (US-201 AC4). Pro+ adds `field_provenance`.
        `include=events,matches,sources` expands the related collections inline.
      x-tier: public
      x-status: planned
      x-sprint: 2
      x-prd-stories: [US-201, US-203, US-601, US-604, US-703]
      security: *sec_public
      parameters:
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The proposal inside the attribution envelope.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalDetailResponse'
              examples:
                public:
                  $ref: '#/components/examples/ProposalDetailPublic'
        '301':
          $ref: '#/components/responses/MovedPermanently'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        <<: *common_errors

  /v1/proposals/{public_id}/events:
    parameters:
      - $ref: '#/components/parameters/ProposalPublicId'
    get:
      operationId: listProposalEvents
      tags: [Proposals, Events]
      summary: Lifecycle timeline
      description: |
        Events on the proposal, newest first: type, `observed_at`, source, `before → after` for status changes
        (US-202 AC1). `merged` and `unmerged` events are present and labelled; a `merged` event's `before.absorbed`
        links to the absorbed record (US-202 AC2). The proposal's `lifecycle_state` equals the `after` value of the
        latest visible `status_change` event or `unknown` (US-202 AC3). Public tier: events with `public_at <= now()`.
      x-tier: public
      x-status: planned
      x-sprint: 2
      x-prd-stories: [US-202, US-302, US-601]
      security: *sec_public
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/SortEvents'
      responses:
        '200':
          description: A page of events for the subject.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              examples:
                timeline:
                  $ref: '#/components/examples/EventList'
