  /v1/assets/geo:
    get:
      operationId: getAssetsGeo
      tags: [Map, Assets]
      summary: Map payload — clustered assets within a bounding box
      description: >
        Same envelope and clustering contract as `GET /v1/proposals/geo` (docs/04 D-10), over `asset` instead of
        `proposal`: below the split threshold (≤ 500 visible) individual `asset` features are returned, each
        carrying `dominant_asset_type` on clusters above it. No lag, no tier gating; the licence gate applies as on
        `GET /v1/assets` (gated assets are absent from features, totals and `licence_summary`), and an asset whose
        licence forbids raw publication is off the map entirely (its list row and page stay).

        **Line assets** (2026-09-19, owner option (a): pipelines as a GeoJSON line layer first, vector tiles
        later). Every visible asset with a `geom_line` -- `gas_pipeline` and `transmission_line` rows -- is
        returned as a `feature_kind: asset_line` feature with a `LineString` or `MultiLineString` geometry,
        alongside the point/cluster features, whenever `asset_type` is unspecified or names its type. Viewport
        membership for a line is intersection (a vertex inside the bbox or a segment crossing it), never centroid
        containment. Lines are never clustered and never counted toward the 500-marker split. Geometry is
        Douglas-Peucker simplified at `zoom` to about half a pixel (`totals.line_tolerance_deg`; none at zoom ≥ 14),
        so a national view (zoom 4) of ~3,000 pipelines is a few hundred KB. At most 1,500 lines are returned per
        response, longest first; `totals.line_count` is the number in view before that cap and `totals.lines_shown`
        after it. A `technology` filter matches no line (lines carry no technology). A line asset loaded with only
        a representative point is drawn as a point, never as a fabricated line.

        **Company page map.** `organization=<public id>` (comma-separated for OR) restricts the response to the
        assets that organisation owns or operates (`asset_owner`, either role), points and lines alike; with it
        set, `bbox` and `zoom` are optional and default to the whole world at zoom 5, so the page draws everything
        the organisation has in one request. Every feature carries `slug` and `url` for a direct link to the asset
        page. An unknown organisation matches nothing (an empty collection, not an error), as on `GET /v1/assets`.
      x-tier: public
      x-status: live
      x-sprint: 4
      x-prd-stories: [US-104, US-203]
      security: *sec_public
      parameters:
        - name: bbox
          in: query
          required: false
          description: >-
            `min_lon,min_lat,max_lon,max_lat` in WGS 84. Required unless `organization` is set (then defaults to
            the whole world). Antimeridian-crossing boxes are two requests.
          schema:
            type: string
            pattern: '^-?[0-9]{1,3}(\.[0-9]+)?,-?[0-9]{1,2}(\.[0-9]+)?,-?[0-9]{1,3}(\.[0-9]+)?,-?[0-9]{1,2}(\.[0-9]+)?$'
            examples: ['-106.6,25.8,-93.5,36.5']
        - name: zoom
          in: query
          required: false
          description: >-
            Web-Mercator zoom level driving the cluster radius and the line simplification tolerance. Required
            unless `organization` is set (then defaults to 5).
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - $ref: '#/components/parameters/AssetOrganizationFilter'
        - $ref: '#/components/parameters/IncludeSubsidiaries'
        - $ref: '#/components/parameters/AssetType'
        - $ref: '#/components/parameters/Technology'
        - name: country
          in: query
          description: ISO 3166-1 alpha-2; comma-separated for OR.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              pattern: '^[A-Z]{2}$'
      responses:
        '200':
          description: Clustered asset features and line features for the viewport inside the attribution envelope.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGeoResponse'
              examples:
