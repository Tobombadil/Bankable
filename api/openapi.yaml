  # ───────────────────────────── Examples (US-704 AC1) ─────────────────────────────
    # ---- Sprint 3 first wave: auth, billing, inbound CRM/billing webhooks
    AuthRegister:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          description: Never logged or echoed; argon2-hashed at rest (`services/api/auth.py`).
        name:
          type: [string, 'null']
    AuthLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSessionResponse:
      type: object
      required: [data, meta, licence_summary, redactions]
      description: 'Envelope shape shared with every other public/pro response (docs/23 §10) — the attribution fields are always present and always empty here (auth responses carry no source-derived data).'
      properties:
        data:
          type: object
          required: [user, account, email_verified]
          properties:
            user:
              $ref: '#/components/schemas/User'
            account:
              $ref: '#/components/schemas/Account'
            email_verified:
              type: boolean
            verification_sent:
              type: boolean
              description: Present on `authRegister` only.
            dev_verification_url:
              type: string
              description: Present on `authRegister` only, and only when no `RESEND_API_KEY` is configured (dry-run `EmailPort`) — never present against a real provider.
        meta:
          type: object
        licence_summary:
          type: object
        redactions:
          type: array
          items: {}
    AuthVerifyResponse:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
    CheckoutCreate:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/PlanTier'
        seats:
          type: integer
          minimum: 1
          default: 1
    CheckoutSessionResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [url, session_ref]
              properties:
                url:
                  type: string
                  format: uri
                session_ref:
                  type: string
    PortalSessionResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
    StripeWebhookPayload:
      type: object
      description: Stripe's own event envelope, verbatim — this schema documents the shape the
        platform reads, not one it validates against before signature verification (docs/34 §1).
      required: [id, type, data]
      properties:
        id:
          type: string
        type:
          type: string
        created:
          type: integer
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
    AttioWebhookPayload:
      type: object
      description: |
        Attio's webhook delivery body (services/crm/README.md "webhook verification and payload shape" —
        the exact record-event shape was not in the vendor evidence fetched for this wave and is reconstructed
        from the list-entry-event shape Attio's docs do show plus the adapter's own required fields; treated
        as a documented assumption, not a verified contract). Two shapes are accepted: a batch envelope
        (`events`, a non-empty array of event objects) or a single bare event object at the top level.
      properties:
        event_type:
          type: string
          description: Present on a single bare event object.
          example: record.updated
        id:
          $ref: '#/components/schemas/AttioWebhookEventId'
        actor:
          type: object
          additionalProperties: true
        events:
          type: array
          description: Present on a batch delivery.
          items:
            type: object
            properties:
              event_type:
                type: string
                example: record.updated
              id:
                $ref: '#/components/schemas/AttioWebhookEventId'
              actor:
                type: object
                additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    AttioWebhookEventId:
      type: object
      description: Identifies the changed object by UUID, never by slug (services/crm/README.md A-34-1).
      required: [object_id, record_id]
      properties:
        workspace_id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        record_id:
          type: string
          format: uuid
    WebhookReceipt:
      type: object
      description: |
        Receipt for an inbound vendor webhook (`/webhooks/attio`, `/webhooks/stripe`): `received` counts the
        events the adapter mapped to a known change, `applied` the subset that changed platform state.
      required: [received, applied]
      properties:
        received:
          type: integer
          minimum: 0
        applied:
          type: integer
          minimum: 0

    UnsubscribeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: '`Alert.unsubscribe_token` from a delivered alert email.'
    UnsubscribeResponse:
      type: object
      required: [unsubscribed, saved_search_name]
      properties:
        unsubscribed:
          type: boolean
        saved_search_name:
          type: string
          description: The saved search the `email` channel was removed from.

