        technology_raw:
          type: [string, 'null']
        technologies:
          type: object
          additionalProperties:
            type: number
        capacity_mw:
          type: [number, 'null']
        capacity_value:
          type: [number, 'null']
        capacity_unit:
          type: [string, 'null']
        commissioned_year:
          type: [integer, 'null']
        unit_count:
          type: [integer, 'null']
        attributes:
