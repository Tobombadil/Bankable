        $ref: '#/components/schemas/CandidatePublicId'
    ExtractionId:
      name: extraction_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExtractionPublicId'
    PostId:
      name: post_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PostPublicId'
    Channel:
      name: channel
      in: path
