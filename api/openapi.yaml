                public_id:
                  $ref: '#/components/schemas/AnyPublicIdValue'
                reason_class:
                  type: string
                  enum: [takedown, unpublish, source_unpublished, merged]
    WebhookTest:
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            type:
              const: webhook.test
            data:
              type: object
              required: [webhook_id, message]
              properties:
                webhook_id:
                  $ref: '#/components/schemas/WebhookPublicId'
                message:
                  type: string

