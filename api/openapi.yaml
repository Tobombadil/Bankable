        returned here) within `radius_km` of the asset's geometry, public-tier visibility rules applied, nearest
        first. For a line asset `distance_km` is measured to the nearest point of the line itself, never to its
        representative point (2026-09-19); for a point asset it is the great-circle distance to the point. Empty,
        with a `redactions[]` row, when the asset's geometry is withheld under its licence.
        "Exact" is judged as served: a proposal stored `exact` under a licence with `allows_raw_publication = false`
        is region grade on every non-admin surface and is excluded, since a distance to it would disclose the
        withheld point. `404` when the asset itself is licence-gated.
