          type: string

    # ---------- Alternate representations ----------
    CsvExport:
      type: string
      description: |
        CSV stream (Pro+). A leading `#` comment block carries the licence summary and attribution line; every row
        carries `source_id`, `source_url`, `retrieved_at`, `licence` columns (US-105 AC2, US-603 AC2). Sources with
        `allows_bulk_export = false` contribute derived columns only.
      examples:
        - |
          # Sources: California ISO; ERCOT. data_as_of=2026-08-29T05:00:00Z tier=pro
          # us.iso.caiso.gen_queue: CAISO Terms of Use — derived fields only, credit "Source: California ISO"
          public_id,name_canonical,kind,technology,capacity_mw,storage_mwh,jurisdiction,lifecycle_state,last_changed,source_id,source_url,retrieved_at,licence
          prop_01JBQ7Z8KD,Gemini Solar + Storage,storage,bess_li_ion,690.000,1380.000,US-NV,studied,2026-09-11T06:12:00Z,us.iso.caiso.gen_queue,https://www.caiso.com/…,2026-09-11T05:00:00Z,caiso-tou
    RssFeed:
      type: string
      description: RSS 2.0 with `atom:link rel="self"`, `dc:creator` = source credit, `pubDate` = `public_at`, `guid` = event id, `category` = event type and kind. Channel title states "Public feed, N days delayed — live in Pro".
    JsonFeedItem:
      type: object
      required: [id, url, title, content_text, date_published, tags, _platform]
      properties:
        id:
          $ref: '#/components/schemas/EventPublicId'
        url:
          type: string
          format: uri
        title:
          type: string
        content_text:
          type: string
          description: Derived fields plus the credit line (US-503 AC3).
        date_published:
          type: string
          format: date-time
          description: '`public_at`.'
        tags:
          type: array
          items:
            type: string
        _platform:
          type: object
          required: [event_type, subject, provenance, licence_summary, data_as_of]
          properties:
            event_type:
              $ref: '#/components/schemas/EventType'
            subject:
              type: object
              properties:
                public_id:
                  $ref: '#/components/schemas/AnyPublicIdValue'
                name:
                  type: string
                url:
                  type: string
                  format: uri
            provenance:
              $ref: '#/components/schemas/ProvenanceQuartet'
            licence_summary:
              $ref: '#/components/schemas/LicenceSummary'
            data_as_of:
              type: string
              format: date-time
    JsonFeed:
      type: object
      description: JSON Feed 1.1.
      required: [version, title, feed_url, items]
      properties:
        version:
          type: string
          const: https://jsonfeed.org/version/1.1
        title:
          type: string
          examples: ['Proposals — Public feed, 14 days delayed — live in Pro']
        home_page_url:
          type: string
          format: uri
        feed_url:
          type: string
          format: uri
        description:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/JsonFeedItem'
    BulkMetaLine:
      type: object
      description: First line of every NDJSON page.
      required: [record_type, page, meta, licence_summary, redactions]
      properties:
        record_type:
          type: string
          const: meta
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/Meta'
        licence_summary:
          $ref: '#/components/schemas/LicenceSummary'
        redactions:
          type: array
          items:
            $ref: '#/components/schemas/Redaction'
    BulkProposalLine:
      oneOf:
        - $ref: '#/components/schemas/BulkMetaLine'
        - $ref: '#/components/schemas/Proposal'
      description: One JSON object per line.
    BulkOpportunityLine:
      oneOf:
        - $ref: '#/components/schemas/BulkMetaLine'
        - $ref: '#/components/schemas/Opportunity'
    BulkEventLine:
      oneOf:
        - $ref: '#/components/schemas/BulkMetaLine'
        - $ref: '#/components/schemas/Event'

    # ---------- Outbound webhook payloads (docs/23 §9.1) ----------
    WebhookEnvelopeBase:
      type: object
      required: [id, type, created_at, api_version, data, licence_summary, redactions]
      properties:
        id:
          $ref: '#/components/schemas/WebhookDeliveryPublicId'
