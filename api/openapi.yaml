        <<: *common_errors
    patch:
      operationId: adminUpdateSource
      tags: [Admin — sources]
      summary: Edit cadence, lag, pause, enrichment, egress class
      description: |
        Runtime fields only (docs/21 §4.1 *runtime*): `schedule_cron`, `lag_days`, `lag_overrides`, `paused`,
        `enrichment_enabled`, `model_budget_usd_daily`, `egress`, `attribution_text` (US-904 AC2, US-601 AC2).
        Manifest fields are read-only here and change through `data/sources.yaml`. A lag change enqueues a `relag`
        job; `public_at` on historical rows is recomputed asynchronously (docs/21 §5.4). Every change is an audited
        `source` event with the mandatory `reason`.
      x-tier: admin
      x-status: live
      x-sprint: 2
      x-prd-stories: [US-904, US-601, US-303]
      security: *sec_admin
      parameters:
