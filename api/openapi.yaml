  # ───────────────────────────── §4 Admin — admin. hostname, role operator or owner ─────────────────────────────
  /admin/v1/sources:
    servers: *admin_servers
    get:
      operationId: adminListSources
      tags: [Admin — sources]
      summary: Source health
      description: |
        Every registry row with runtime state (docs/21 §4.1): `health`, `last_success_at`, `last_error`,
        `schedule_cron`, `next_run_at`, `consecutive_failures`, last run's rows seen / new / changed / gone and
        events emitted, `cost_per_changed_record_30d`, `publish_state`, licence class and the legal evidence link
        (US-904 AC1). Unimplemented connectors are listed with `implemented = false`. A source with
        `consecutive_failures >= 3` is `health = failing` and has raised a supervision notification (US-904 AC3).
      x-tier: admin
      x-status: live
      x-sprint: 2
      x-prd-stories: [US-904, US-905, US-303]
      security: *sec_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SourceCategory'
        - $ref: '#/components/parameters/SourceHealth'
        - $ref: '#/components/parameters/PublishStateFilter'
        - $ref: '#/components/parameters/ReuseClass'
        - $ref: '#/components/parameters/Implemented'
      responses:
        '200':
          description: Sources with runtime state.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSourceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        <<: *common_errors
    post:
      operationId: adminCreateSource
      tags: [Admin — sources]
      summary: Add a curated issuer source
      description: |
        Adds a registry row without a code change — the path for the curated RFP issuer list (US-303 AC2,
        US-904 AC2). Only `category = procurement` sources with `access` in `html | rss | api` may be created here;
        connector-backed sources come from `data/sources.yaml`. The new row starts `publish_state = ingest_only`
        with the licence named in the body; publication follows the gate rules of `PUT …/publish-state`. The
        issuer URL host is added to the egress allowlist for the `plain` pool only.
      x-tier: admin
      x-status: live
      x-sprint: 2
      x-prd-stories: [US-303, US-904]
      security: *sec_admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSourceCreate'
      responses:
        '201':
          description: Created.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSourceDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        <<: *common_errors

