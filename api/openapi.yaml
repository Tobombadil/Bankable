                subject:
                  type: object
                  required: [public_id, url]
                  properties:
                    public_id:
                      $ref: '#/components/schemas/AnyPublicIdValue'
                    name_canonical:
                      type: string
                    url:
                      type: string
                      format: uri
    WebhookMatchChanged:
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            type:
              enum: [match.added, match.removed]
            data:
              type: object
              required: [event, match]
              properties:
                event:
                  $ref: '#/components/schemas/Event'
                match:
                  $ref: '#/components/schemas/Match'
    WebhookRecordUnpublished:
