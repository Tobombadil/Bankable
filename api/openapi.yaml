        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        <<: *common_errors

  /admin/v1/sources/{source_id}/publish-state:
    servers: *admin_servers
    parameters:
      - $ref: '#/components/parameters/SourceId'
    put:
      operationId: adminSetSourcePublishState
      tags: [Admin — sources]
      summary: Set the source publish state
      description: |
        `ingest_only | api_only | public`. Transition to `public` or `api_only` is refused with `422 gate_unmet`
        unless the licence has `reuse_class ∈ {open, attribution}`, `gate_flag = false` and non-null `evidence_url`,
        `evidence_retrieved_at`, `classified_by` (invariant L1, US-905 AC1); the body names the gate. Moving down to
        `ingest_only` hides every record and event of the source from all non-admin surfaces within one cache TTL,
        including RSS and API; mixed-provenance records stay visible with the source's fields removed (US-905 AC2).
        Writes an audited `published` / `unpublished` event with the mandatory `reason`.
      x-tier: admin
