          format: date-time
        status:
          $ref: '#/components/schemas/SourceRunStatus'
        snapshot_id:
          oneOf:
            - $ref: '#/components/schemas/SnapshotPublicId'
            - type: 'null'
        http_status:
          type: [integer, 'null']
        bytes:
          type: [integer, 'null']
        egress_class:
          $ref: '#/components/schemas/SourceEgress'
        rows_seen:
          type: integer
        rows_new:
          type: integer
        rows_changed:
          type: integer
        rows_gone:
          type: integer
        events_emitted:
          type: integer
        model_calls:
          type: integer
        cost_usd:
          type: number
        worker_seconds:
          type: number
        dq_status:
          type: string
          enum: [pass, warn, fail]
        dq:
