        The feed `<title>` states "Public feed, N days delayed — live in Pro" (US-604). RSS: `atom:link rel="self"`,
        `dc:creator` = source credit, `pubDate` = `public_at`, `guid` = event id, `category` = event type and kind.
        JSON Feed: `date_published` = `public_at`, plus a `_platform` extension with `event_type`, `subject`,
        `provenance` and `licence_summary`. Edge-cached, 120/hour per IP.
      x-tier: public
