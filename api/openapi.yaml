      summary: Create a password account
      description: |
        Creates a `personal` account and its first user (`services/api/auth.py` `register_user`),
        sends a verification email through the `EmailPort` (`services/README.md` "Pro tier and
        alerts" decision 2: password auth alongside docs/20 §7's passwordless magic-link/Google,
        which remain unbuilt), and signs the caller in immediately — `email_verified` is `false`
        in the response until the link is followed. `dev_verification_url` is present only when
        no `RESEND_API_KEY` is configured (the dry-run `EmailPort`), so the local/CI flow can be
        completed without a mail provider; it is never present against a real one.
      x-tier: public
      x-status: live
      x-sprint: 3
      x-prd-stories: [US-602]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegister'
      responses:
        '201':
          description: Account created; a session cookie is set.
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An active user already has this email address.
          headers: *std_headers
