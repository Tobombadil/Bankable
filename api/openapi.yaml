            name:
              type: string
            level:
              type: string
              enum: [county, state, country]
            state_code:
              type: string
              description: County features only.
    RegionFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/RegionFeature'
    RegionsResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegionFeatureCollection'
