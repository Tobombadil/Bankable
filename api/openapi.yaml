      required: [run_id, source_id, trigger, started_at, status, egress_class, rows_seen, rows_new, rows_changed, rows_gone, events_emitted, model_calls, cost_usd, worker_seconds, dq_status, dq, attempt, dead_lettered]
      properties:
        run_id:
          $ref: '#/components/schemas/SourceRunPublicId'
