          description: The type's objective feature set only (ADR 0008 §4) — no valuation, tariff or contract fields.
        state_code:
          type: [string, 'null']
        county_name:
          type: [string, 'null']
        county_fips:
          type: [string, 'null']
        country:
          type: string
        first_seen:
          type: string
          format: date-time
        last_changed:
          type: string
          format: date-time
        length_miles:
          type: [number, 'null']
