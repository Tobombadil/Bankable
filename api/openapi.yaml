# OpenAPI 3.1 contract for the platform's public, Pro, API and admin surfaces.
#
# Normative inputs: docs/23-api-spec-outline.md (shapes), docs/21-data-model.md (fields, vocabularies, gating),
# docs/04-standards.md §5 (API rules), docs/20-architecture.md §5 and §7 (tiers, auth), docs/10-prd-mvp.md §4
# (story ids). Where this file and docs/23 disagree, docs/23 wins and this file is wrong (docs/23 preamble).
#
# Placeholders: infraque.com is the product domain, pending the naming decision (docs/00-PLAN.md). Every hostname
# and URL in this file is replaced by one find-and-replace once the name is chosen.
#
# Conventions used in this file:
#   x-tier          minimum entitlement for the operation: public | pro | api | admin (see x-tier-definitions)
#   x-prd-stories   PRD story ids (docs/10 §4) the operation satisfies; scripts verify all 44 are covered
#   x-status        planned (not yet shipped) | live; x-sprint names the sprint from docs/10 §6
#   YAML anchors    &std_headers, &sec_* are plain YAML; every consumer used (Redoc, Swagger UI, PyYAML) resolves them
openapi: 3.1.0

info:
  title: Platform API
  version: 1.0.0-draft
  summary: Energy and infrastructure proposals, opportunities and their change feed, with provenance on every row.
  description: |
    The platform continuously discovers energy and infrastructure **proposals** (supply: interconnection queues,
    permits, dockets, announcements) and **opportunities** (demand: RFPs, funding, tenders, large-load requests),
    fuses them into one lifecycle record per real-world project and publishes them on three tiers:

    | Tier | Credential | What it sees |
    |---|---|---|
    | `public` | none (or a `read:public` key / free session) | records and events whose `public_at <= now()`; derived fields only; attribution rendered in every response |
    | `pro` | session or key with `read:live` | the same shapes with `lag_days = 0`, plus `field_provenance`, saved searches, alerts, exports |
    | `api` | key with `read:live` + `read:bulk` / `write:webhooks` | as Pro, plus NDJSON bulk streams, webhooks and higher limits |
    | `admin` | operator/owner session on the `admin.` host | everything, including unpublished, gated and dead-lettered records |

    **Every response carries the attribution envelope** (`meta`, `licence_summary`, `redactions[]`) and every
    record carries `provenance[]`. A record from a `restricted` or `unknown`-terms source is invisible on every
    non-admin surface; a field withheld under a source licence is listed in `redactions[]` with the status still
    `200`. Requests for a record that exists but is not visible to the caller's tier return `404`, never `403`,
    so that existence does not leak (docs/21 §8 item 3).

    **Versioning.** Path-versioned; `v1` is frozen at MVP launch. Additive changes (optional fields, new endpoints,
    documented-open vocabulary values) are non-breaking. Anything else ships as `v2`. A deprecated operation or
    version sends `Deprecation` and `Sunset` headers (RFC 8594) for at least six months before removal, and every
    key that used it in the prior 90 days is emailed (docs/04 API-7).

    **Transport.** HTTPS + HTTP/2, `application/json`; errors are RFC 9457 `application/problem+json`; timestamps
    RFC 3339 UTC with `Z`; dates `YYYY-MM-DD`; `snake_case`; public ids only (`prop_…`, `opp_…`, `org_…`, `evt_…`,
    `mat_…`) — internal UUIDs never appear. `Idempotency-Key` on every mutating request replays the original
    response for 24 h. `X-Request-Id` on every response. Public GETs are `Cache-Control: public, max-age=300` with
    an `ETag`; Pro/API responses are `private, no-store`.

    **Pagination, filtering, sorting** follow `x-filter-grammar` below (docs/23 §7). Unknown query parameters are
    a `400 unknown_parameter`, never ignored.

    **Rate limits** per `x-rate-limits` below (docs/23 §6); `RateLimit-*` headers on every response, `429` with
    `Retry-After` on breach.
  termsOfService: https://infraque.com/legal/api-licence
  contact:
    name: Platform API support
    url: https://infraque.com/docs/api
    email: api@infraque.com
  license:
    name: Platform API licence (drafted by legal-compliance; acceptance recorded per key, US-704 AC2)
    url: https://infraque.com/legal/api-licence

servers:
  - url: https://api.infraque.com
    description: |
      Public, Pro and API tiers. Every path in this group starts with `/v1`, so the effective base URL is
      `https://api.infraque.com/v1`. The host is unversioned here only because OpenAPI path keys must be unique
      across the document and the admin group reuses several path shapes (`/sources`, `/keys`); see api/README.md.
  - url: https://admin.infraque.com
    description: |
      Operators only (role `operator` or `owner`), separate hostname, second factor enforced by the identity
      provider, optional IP allowlist. Every path in this group starts with `/admin/v1`, so the effective base
      URL is `https://admin.infraque.com/admin/v1`. Never issued to a customer key.
  - url: https://infraque.com
    description: Feeds and sitemaps (`/feeds/*`, `/sitemap.xml`); edge-cached, public tier, counted per IP at 120/hour.

tags:
  - name: Proposals
    description: Supply-side objects — one record per real-world project (docs/21 §3.1). Public, delayed.
  - name: Opportunities
    description: Demand-side objects — RFPs, funding, tenders, auctions, programmes (docs/21 §3.3). Public, delayed.
  - name: Organizations
    description: Sponsors and issuers (docs/21 §3.5). No personal data.
  - name: Events
    description: The append-only change log (docs/21 §3.10). The product is the feed.
  - name: Matches
    description: Proposal ↔ opportunity matches with score and rationale (docs/21 §3.11).
  - name: Map
    description: Clustered GeoJSON for the map-first surface (docs/04 §2.2). Same filters and tier rules as the lists.
  - name: Context
    description: Built-infrastructure context layer (docs/00-PLAN.md 2026-09-14) — existing plants under the proposals map, and its identifier-free interaction measurement (docs/21 §3.20-§3.21). Public on every tier; no proposal semantics.
  - name: Documents
    description: Document metadata; bytes only where the licence allows (docs/21 §3.8).
  - name: Sources & licences
    description: Source registry and licence register — the attribution and gating truth (docs/21 §3.19, §4.1).
  - name: Meta
    description: Vocabularies and health.
  - name: Intake
    description: Submit-a-project and submit-an-RFP (US-1001, US-1003). Public, write-only, captcha-gated.
  - name: Account
    description: Current user, account, entitlement and seats (Pro+).
  - name: Billing
    description: Stripe Checkout and Customer Portal hand-offs; entitlement derives from Stripe webhooks through the BillingPort (docs/20 §9, docs/34 §1).
  - name: Saved searches & alerts
    description: Saved filter definitions and their delivery history (Pro+).
  - name: Exports
    description: Async CSV exports with provenance columns (Pro+).
  - name: API keys
    description: Self-service keys, shown once (API plan).
  - name: Bulk
    description: NDJSON streams with `updated_since` and cursor (scope `read:bulk`).
  - name: Webhooks
    description: Outbound subscriptions — a saved search with a URL as its channel (scope `write:webhooks`).
  - name: Feeds
    description: RSS 2.0, JSON Feed 1.1 and sitemaps on the public tier.
  - name: Admin — sources
    description: Source health, runs, snapshots, publish state and licence gates (US-904, US-905).
  - name: Admin — records
    description: Edit with reason, merge/unmerge, per-record publish state, resolution and extraction review.
  - name: Admin — social
    description: Post review queue and per-channel auto-publish (US-801–US-804).
  - name: Admin — tasks
    description: Reported problems, intake submissions, deletion requests (US-907).
  - name: Admin — customers
    description: Users, customers, subscriptions, leads and keys — read-through the CRM/ERP adapter (US-901–US-903).
  - name: Admin — operations
    description: Model cost and the audit log (US-909, US-901 AC2).

x-tier-definitions:
  description: |
    `x-tier` on an operation is the **minimum** entitlement. A higher tier sees the same shape with `meta.lag_days = 0`
    and more fields. Tier is a property of the reader, not a copy of the data (docs/20 §5). Licence gating is
    orthogonal and stricter: it decides whether a field may leave at all (docs/21 §8); tier decides how old it must be.
  public_at_semantics: |
    Every entity and event carries `published_at` (when it became visible to the live tier) and `public_at`
    (materialised `published_at + lag(source_id, event_type)`). The public predicate reads `public_at` only:
    `public_at IS NOT NULL AND public_at <= now()`. Pro/API/admin read `published_at <= now()`. A lag change is a
    configuration change that enqueues a `relag` job to recompute `public_at`; it is not instantaneous across
    historical rows and the admin UI says so (docs/21 §5.4). On the public tier a detail response renders the
    record as of `now − lag`: fields and events newer than the lag are absent, and `meta.data_as_of` states the
    cut (US-201 AC4). Default lag is per source class — 14 days supply, 7 days opportunities, bounded 7–30 —
    with per-source and per-event-type overrides (docs/04 §10 pick 1; `source.lag_days`, `source.lag_overrides`).
  tiers:
    public:
      credential: none, or an API key with only `read:public`, or a free-account session
      predicate: public_at <= now(); publish_state = public; source and licence permit the public tier
      fields: derived and identifying classes only; `raw`, `status_raw`, `raw_place`, exact coordinates from attribution-with-restriction sources and everything from restricted/unknown sources withheld
      lag_days: source.lag_days (or class default)
    pro:
      credential: session with account.entitlement in {pro, api, admin}, or key with `read:live`
      predicate: published_at <= now(); same licence gating as public
      fields: public fields plus `field_provenance` on detail responses, saved searches, alerts, exports, dismissals
      lag_days: 0
    api:
      credential: key with `read:live` and `read:bulk` and/or `write:webhooks`; plan tier `api`
      predicate: as pro
      fields: as pro; plus /v1/bulk/* streams and webhooks; higher limits
      lag_days: 0
    admin:
      credential: operator/owner session on the admin host; scope `admin:*` is never issued to a customer key
      predicate: none — every publish_state, gated sources, dead-lettered runs, costs
      fields: everything, including `overrides`, `raw`, `snapshot_id`, `publish_state`
      lag_days: 0

x-filter-grammar:
  description: |
    `field=value` equality; `field=a,b` OR within one facet; `field[op]=value` for ranges with op in
    `gte, lte, gt, lt, from, to`. Facets combine with AND, values within a facet with OR (US-102 AC3). Filters
    round-trip in the URL so a shared link reproduces the result set on the same tier (US-102 AC2). Unknown
    parameters → `400 unknown_parameter`. Sorting: `sort=-last_changed,name_canonical`, `-` descending, allowlisted
    per resource. Pagination is cursor-based only: `limit` (default 50, max 200; 1,000 on `/v1/bulk/*`) and an
    opaque `cursor` valid 24 h; `page.{next_cursor, prev_cursor, has_more}` in the envelope; `meta.total` and
    `meta.total_is_estimate` only with `include=count` (exact ≤ 10,000 rows).
  operators: [gte, lte, gt, lt, from, to]
  sort_allowlist:
    proposals: [last_changed, first_seen, capacity_mw, name_canonical]
    opportunities: [due_at, open_at, last_changed, budget_amount]
    events: [seq, observed_at]
    matches: [score, first_matched_at]
  defaults:
    proposals: -last_changed
    opportunities: "due_at (with status=open)"
    events: -seq
    matches: -score

x-rate-limits:
  description: |
    Two layers — edge rules per IP for anonymous abuse and an application sliding window per key or session
    (docs/20 §7). Defaults, configurable per plan and per key (docs/10 A-8, US-702 AC1). Headers on every response:
    `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset` (delta-seconds), `RateLimit-Policy`. On breach:
    `429 rate_limited` with `Retry-After`; on daily cap: `429 quota_exceeded` with `Retry-After` to midnight UTC.
    Feeds are edge-cached and counted per IP at 120/hour. Every request is logged with key id, endpoint, status
    and latency (metric M-7, US-702 AC3).
  tiers:
    public_per_ip: {read_per_hour: 60, search_per_hour: 20, bulk: null, writes_per_hour: 5, daily_cap: 1000}
    free_account: {read_per_hour: 300, search_per_hour: 60, bulk: null, writes_per_hour: 10, daily_cap: 3000}
    pro: {read_per_hour: 600, search_per_hour: 120, exports_per_day: 5, export_rows_max: 10000, writes_per_hour: 60, daily_cap: 10000}
    api: {read_per_hour: 6000, search_per_hour: 600, bulk_requests_per_hour: 20, writes_per_hour: 600, daily_cap: 50000}
    admin: {read_per_hour: 1200}
    feeds_per_ip: {read_per_hour: 120}

# Headers present on every response (docs/23 §1, §6; docs/04 API-6, API-7, API-9).
x-standard-headers: &std_headers
  X-Request-Id:
    $ref: '#/components/headers/X-Request-Id'
  RateLimit-Limit:
    $ref: '#/components/headers/RateLimit-Limit'
  RateLimit-Remaining:
    $ref: '#/components/headers/RateLimit-Remaining'
  RateLimit-Reset:
    $ref: '#/components/headers/RateLimit-Reset'
  RateLimit-Policy:
    $ref: '#/components/headers/RateLimit-Policy'
  ETag:
    $ref: '#/components/headers/ETag'
  Cache-Control:
    $ref: '#/components/headers/Cache-Control'
  Deprecation:
    $ref: '#/components/headers/Deprecation'
  Sunset:
    $ref: '#/components/headers/Sunset'

# Security requirement sets. In OpenAPI 3.1 the string list on a non-OAuth scheme is a list of role names —
# here the key scopes of docs/23 §5 for ApiKey, and entitlement / role names for the session schemes.
x-security-sets:
  public: &sec_public
    - {}
    - ApiKey: [read:public]
    - Session: []
  pro: &sec_pro
    - ApiKey: [read:live]
    - Session: [pro]
  api_bulk: &sec_api_bulk
    - ApiKey: [read:live, read:bulk]
  api_keys: &sec_api_keys
    - Session: [api]
    - ApiKey: [read:live]
  api_webhooks: &sec_api_webhooks
    - ApiKey: [write:webhooks]
    - Session: [api]
  admin: &sec_admin
    - AdminSession: [operator, owner]
  owner: &sec_owner
    - AdminSession: [owner]
  legal: &sec_legal
    - AdminSession: [legal]

# Error responses common to every operation (docs/23 §8). Listed once here and referenced per operation.
x-common-errors: &common_errors
  '429':
    $ref: '#/components/responses/RateLimited'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
  default:
    $ref: '#/components/responses/Problem'

