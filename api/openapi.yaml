      summary: Receive an Attio CRM webhook
      description: |
        Served on the API host (docs/34 §6 registers `https://api.infraque.com/webhooks/attio`).
        Inbound `record.updated` (Companies) and `record.updated`/`record.created` (Lead Signals) events from
        Attio (docs/34 §5 "Inbound webhooks"). No session or API key — the `Attio-Signature` HMAC verified
        against `ATTIO_WEBHOOK_SECRET` is the credential; a missing or invalid signature is `401
        unauthenticated`, never processed. A `company.updated` change refreshes the platform's cached
        `account.name` display field only (docs/34 §1: the platform never treats Attio as the source of a
        project fact). `lead_signal.updated` events are currently received and counted but not otherwise
        acted on until the admin-panel wave adds the task table that a `handled` tick would close.
