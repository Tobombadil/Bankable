      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UiEventCreateRequest'
      responses:
        '202':
          description: Accepted; body always empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        <<: *common_errors

