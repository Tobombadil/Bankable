          $ref: '#/components/schemas/MatchStatus'
    ScoreGte:
      name: 'score[gte]'
      in: query
      schema:
        type: number
        minimum: 0
        maximum: 1
    ExcludeDismissed:
      name: exclude_dismissed
      in: query
      description: Hide matches the caller has dismissed (US-402 AC2). Default `false`.
