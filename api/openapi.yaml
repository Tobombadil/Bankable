        or a 20+ character token — those are rejected outright, not merely dropped (docs/21 §3.21). No auth; the
        caller's IP is used only to enforce the rate limit below and is never read into the stored row, logged, or
        otherwise retained. Rate-limited per IP at 60 per minute — well under the public tier's per-hour ceiling,
        since this is a write with essentially zero cost per call and a real abuse surface (anonymous, no key).
