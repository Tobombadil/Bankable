    # ---------- Pro / API tier entities (docs/21 §3.12–§3.17, §4.4) ----------
    RateLimitPolicy:
      type: object
      description: The caller's effective limits (docs/23 §6).
      properties:
        read_per_hour:
          type: integer
        search_per_hour:
          type: integer
        writes_per_hour:
          type: integer
        bulk_requests_per_hour:
          type: [integer, 'null']
        exports_per_day:
          type: [integer, 'null']
        export_rows_max:
          type: [integer, 'null']
        daily_cap:
          type: [integer, 'null']
    User:
      type: object
      description: docs/21 §3.12. Personal-data inventory columns — `email`, `name`, `last_login_at`, `sor_ref` — are admin-only outside `/v1/me`.
      required: [user_id, account_id, role, status, auth_provider, mfa_enforced, marketing_consent, created_at]
      properties:
        user_id:
          $ref: '#/components/schemas/UserPublicId'
        account_id:
          $ref: '#/components/schemas/AccountPublicId'
        email:
          type: [string, 'null']
          format: email
          description: Null after anonymisation.
        email_verified_at:
          type: [string, 'null']
          format: date-time
        name:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        auth_provider:
          type: string
          description: '`password` added by Pro tier and alerts (argon2-hashed session auth per that task''s brief); docs/20 §7''s passwordless `magic_link`/Google flows remain unbuilt this sprint (services/README.md).'
          enum: [magic_link, google, password]
        mfa_enforced:
          type: boolean
        marketing_consent:
          type: boolean
        consent_version:
          type: [string, 'null']
        tos_version:
          type: [string, 'null']
        last_login_at:
          type: [string, 'null']
          format: date-time
        anonymised_at:
          type: [string, 'null']
          format: date-time
        sor_ref:
          type: [string, 'null']
          description: Admin only — contact id in the system of record.
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      description: The entitlement mirror (docs/21 §3.13) — authoritative for nothing.
      required: [account_id, name, kind, entitlement, entitlement_source, entitlement_checked_at, entitlement_stale, seats, seats_used, status]
      properties:
        account_id:
          $ref: '#/components/schemas/AccountPublicId'
        name:
          type: string
        kind:
          type: string
          enum: [personal, organization]
        organization:
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        entitlement:
          $ref: '#/components/schemas/Entitlement'
        entitlement_source:
          type: string
          enum: [sor, manual_grant, trial]
        entitlement_checked_at:
          type: string
          format: date-time
        entitlement_stale:
          type: boolean
        seats:
          type: integer
          minimum: 0
        seats_used:
          type: integer
          minimum: 0
        sor_kind:
          type: [string, 'null']
        sor_ref:
          type: [string, 'null']
          description: Admin only.
        billing_ref:
          type: [string, 'null']
          description: Admin only.
        status:
          $ref: '#/components/schemas/AccountStatus'
    Subscription:
      type: object
      description: Mirror of the commercial record (docs/21 §3.14).
      required: [subscription_id, account_id, sor_kind, plan_code, plan_tier, status, seats, current_period_start, current_period_end, currency, mirrored_at, drift_flag]
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionPublicId'
        account_id:
          $ref: '#/components/schemas/AccountPublicId'
        sor_kind:
          type: string
          enum: [stripe, odoo, erpnext]
        sor_ref:
          type: [string, 'null']
          description: Admin only.
        plan_code:
          type: string
        plan_tier:
          $ref: '#/components/schemas/PlanTier'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        seats:
          type: integer
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancel_at:
          type: [string, 'null']
          format: date-time
        mrr_amount:
          type: [number, 'null']
          description: Admin only.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        mirrored_at:
          type: string
          format: date-time
        drift_flag:
          type: boolean
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [user, account, tier, limits, api_licence]
              properties:
                user:
                  $ref: '#/components/schemas/User'
                account:
                  $ref: '#/components/schemas/Account'
                tier:
                  $ref: '#/components/schemas/Tier'
                  description: Resolved for this request (`scopes ∩ plan_tier` when called with a key).
                scopes:
                  type: array
                  description: Present when called with a key.
                  items:
                    $ref: '#/components/schemas/ApiKeyScope'
                limits:
                  $ref: '#/components/schemas/RateLimitPolicy'
                saved_search_quota:
                  type: object
                  properties:
                    limit:
                      type: integer
                    used:
                      type: integer
                api_licence:
                  type: object
                  required: [current_version, url]
                  properties:
                    current_version:
                      type: string
                      examples: [api-licence-1.0]
                    url:
                      type: string
                      format: uri
    AccountResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [account, subscriptions]
              properties:
                account:
                  $ref: '#/components/schemas/Account'
                subscriptions:
                  type: array
                  items:
                    $ref: '#/components/schemas/Subscription'
    AdminAccountEntitlementResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [account]
              properties:
                account:
                  $ref: '#/components/schemas/Account'
    SavedSearchQuery:
      type: object
      description: Filter definition in the `x-filter-grammar` shape, keyed by parameter name; array values are OR within the facet. Never results.
      additionalProperties: true
      examples:
        - kind: [storage]
          jurisdiction: [US-TX]
          'capacity_mw[gte]': 50
          'capacity_mw[lte]': 500
    SavedSearch:
      type: object
      description: docs/21 §3.15.
      required: [saved_search_id, name, entity, query, delivery_mode, channels, watermark_seq, last_match_count, status, created_at, updated_at]
      properties:
        saved_search_id:
          $ref: '#/components/schemas/SavedSearchPublicId'
        name:
          type: string
          maxLength: 120
        entity:
          $ref: '#/components/schemas/SavedSearchEntity'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        delivery_mode:
          $ref: '#/components/schemas/DeliveryMode'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
        rss_url:
          type: [string, 'null']
          format: uri
          description: Private live feed when `rss` is a channel (`/feeds/saved/{rss_token}`).
        last_run_at:
          type: [string, 'null']
          format: date-time
        watermark_seq:
          type: integer
          format: int64
        last_match_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, paused]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedSearchCreate:
      type: object
      required: [name, entity, query]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        entity:
          $ref: '#/components/schemas/SavedSearchEntity'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        delivery_mode:
          $ref: '#/components/schemas/DeliveryMode'
          default: daily
        channels:
          type: array
          default: [email]
          items:
            $ref: '#/components/schemas/AlertChannel'
    SavedSearchUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        delivery_mode:
          $ref: '#/components/schemas/DeliveryMode'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
        status:
          type: string
          enum: [active, paused]
    SavedSearchListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SavedSearch'
    SavedSearchDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SavedSearch'
    SavedSearchPreviewResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Proposal'
                  - $ref: '#/components/schemas/Opportunity'
                  - $ref: '#/components/schemas/Event'
                  - $ref: '#/components/schemas/Match'
    Alert:
      type: object
      description: docs/21 §3.16. `recipient` is redacted after deletion; rows are aggregated after 12 months.
      required: [alert_id, saved_search_id, channel, mode, window_start, window_end, event_seqs, status, created_at]
      properties:
        alert_id:
          $ref: '#/components/schemas/AlertPublicId'
        saved_search_id:
          $ref: '#/components/schemas/SavedSearchPublicId'
        channel:
          $ref: '#/components/schemas/AlertChannel'
        mode:
          type: string
          enum: [immediate, daily, weekly]
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        event_seqs:
          type: array
          items:
            type: integer
            format: int64
        event_ids:
          type: array
          description: Detail responses only — resolved from `event_seqs`.
          items:
            $ref: '#/components/schemas/EventPublicId'
        recipient:
          type: [string, 'null']
        subject:
          type: [string, 'null']
        provider_message_id:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AlertStatus'
        sent_at:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    AlertListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
    AlertDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Alert'
    Export:
      type: object
      required: [export_id, entity, query, status, row_cap, created_at]
      properties:
        export_id:
          $ref: '#/components/schemas/ExportPublicId'
        entity:
          $ref: '#/components/schemas/SavedSearchEntity'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        status:
          $ref: '#/components/schemas/ExportStatus'
        row_cap:
          type: integer
        row_count:
          type: [integer, 'null']
        truncated:
          type: boolean
          description: '`true` when the filtered set exceeded `row_cap`.'
        download_url:
          type: [string, 'null']
          format: uri
        expires_at:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    ExportCreate:
      type: object
      required: [entity, query]
      properties:
        entity:
          $ref: '#/components/schemas/SavedSearchEntity'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        saved_search_id:
          $ref: '#/components/schemas/SavedSearchPublicId'
          description: Alternative to `query` — export a saved search's current results.
        columns:
          type: array
          description: Optional column allowlist; provenance columns are always appended.
          items:
            type: string
    ExportListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Export'
    ExportDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Export'
    ApiKey:
      type: object
      description: docs/21 §3.17. The secret is never stored or returned after creation.
      required: [key_id, account_id, name, prefix, last4, scopes, tier, rate_limit_per_hour, licence_accepted_version, licence_accepted_at, created_at]
      properties:
        key_id:
          $ref: '#/components/schemas/ApiKeyPublicId'
        account_id:
          $ref: '#/components/schemas/AccountPublicId'
        created_by_user_id:
          $ref: '#/components/schemas/UserPublicId'
        name:
          type: string
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
        last4:
          type: string
          pattern: '^[0-9A-Za-z]{4}$'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        tier:
          type: string
          enum: [public, pro, api]
        rate_limit_per_hour:
          type: integer
        daily_quota:
          type: [integer, 'null']
        expires_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        last_used_ip:
          type: [string, 'null']
          description: Truncated to /24 or /48.
        revoked_at:
          type: [string, 'null']
          format: date-time
        licence_accepted_version:
          type: string
        licence_accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name, licence_accepted_version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
          default: bk_live
        scopes:
          type: array
          description: Requested; intersected with the plan. `admin:*` is rejected with `400`.
          default: ['read:public']
          items:
            type: string
            enum: ['read:public', 'read:live', 'read:bulk', 'write:webhooks']
        expires_at:
          type: [string, 'null']
          format: date-time
        licence_accepted_version:
          type: string
          description: Must equal the current API licence version (`GET /v1/me` → `api_licence.current_version`).
    AdminApiKeyCreate:
      allOf:
        - $ref: '#/components/schemas/ApiKeyCreate'
        - type: object
          required: [account_id, licence_acceptance_ref, reason]
          properties:
            account_id:
              $ref: '#/components/schemas/AccountPublicId'
            rate_limit_per_hour:
              type: integer
            daily_quota:
              type: [integer, 'null']
            licence_acceptance_ref:
              type: string
              description: Reference to the account owner's recorded acceptance (contract or ticket id).
            reason:
              type: string
    ApiKeyCreatedResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/ApiKey'
                - type: object
                  required: [secret]
                  properties:
                    secret:
                      type: string
                      description: The full key, shown once.
                      pattern: '^bk_(live|test)_[0-9A-Za-z]{43}$'
    ApiKeyListResponse:
