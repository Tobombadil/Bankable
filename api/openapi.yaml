      responses:
        '200':
          description: Delivery accepted and processed (or skipped, for an unmapped event type).
          headers: *std_headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReceipt'
              example:
                received: 1
                applied: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/SorUnavailable'
        default:
          $ref: '#/components/responses/Problem'

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [Billing]
      summary: Inbound Stripe webhook
      description: |
        Served on the API host (`https://api.infraque.com/webhooks/stripe`). Stripe calls this directly (`services/billing/stripe.py`'s `handle_webhook`; docs/34 §1
        "Stripe writes it"). Verifies `Stripe-Signature: t=<unix>,v1=<hex>[,v1=<hex>...]` — HMAC-SHA256
        of `"{t}.{raw body}"` with the `STRIPE_WEBHOOK_SECRET`, ±300s tolerance — before touching the
        body; a bad signature is `401`, never processed. Maps `customer.subscription.created|updated|
        deleted|paused|resumed`, `checkout.session.completed` (subscription mode) and
        `invoice.paid`/`invoice.payment_failed` onto `account.entitlement` via the one rule in
        `services/sor/ports.py:entitlement_for`. Always answers `200` once the signature checks out —
        a per-event application failure is logged and counted, never a 5xx (Stripe would otherwise
        retry indefinitely for a problem retrying cannot fix).
      x-tier: public
      x-status: live
      x-sprint: 3
      x-prd-stories: [US-602]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeWebhookPayload'
      responses:
        '200':
          description: Signature verified; `received`/`applied` count what this delivery did.
