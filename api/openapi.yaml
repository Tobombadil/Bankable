    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountPublicId'
    # Request headers
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-chosen unique key (UUID recommended). A replay within 24 h returns the original response; reuse with a different body is `409 conflict`. Required on every mutating call from an API key; recommended from sessions.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    # Outbound webhook headers (documented as parameters on the `webhooks` entries)
    WebhookSignatureHeader:
      name: X-Platform-Signature
      in: header
      required: true
      description: '`t=<unix>,v1=<hex HMAC-SHA256 of "t.body">` using the endpoint secret; reject when `|now − t| > 300 s`. During a secret rotation two `v1=` values are present for 24 h.'
      schema:
        type: string
        pattern: '^t=[0-9]+(,v1=[0-9a-f]{64})+$'
    WebhookDeliveryIdHeader:
      name: X-Platform-Delivery-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/WebhookDeliveryPublicId'
    WebhookEventSeqHeader:
      name: X-Platform-Event-Seq
      in: header
      required: true
      description: The `seq` of the triggering event; ordering key per endpoint.
      schema:
        type: integer
        format: int64

  # ───────────────────────────── §8 Error responses (RFC 9457) ─────────────────────────────
  responses:
    Problem:
      description: Any other error, as RFC 9457 problem details with a stable `code`.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: '`validation_error` (bad body or parameter, `errors[]` lists fields), `unknown_parameter` (unrecognised filter — never silently ignored), or `invalid_cursor`.'
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknown_parameter:
              value:
                type: https://api.infraque.com/errors/unknown_parameter
                title: Unknown query parameter
                status: 400
                code: unknown_parameter
                detail: 'Parameter "technolgy" is not a filter on this resource; see /v1/meta/vocabularies and the filter grammar.'
                instance: /v1/proposals
                request_id: req_4b1e2c
                errors:
                  - field: technolgy
                    message: unknown parameter
                docs: https://infraque.com/docs/api/errors#unknown_parameter
            invalid_cursor:
              value:
                type: https://api.infraque.com/errors/invalid_cursor
                title: Cursor expired or malformed
                status: 400
                code: invalid_cursor
                detail: Cursors are valid for 24 hours; restart from the first page.
                instance: /v1/events
                request_id: req_4b1e2d
                docs: https://infraque.com/docs/api/errors#invalid_cursor
    Unauthenticated:
      description: Pro/API/admin path without a valid credential.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/unauthenticated
            title: Credential missing or invalid
            status: 401
            code: unauthenticated
            detail: This endpoint needs a session or an API key. Public reads are available without one at /v1/proposals.
            instance: /v1/saved-searches
            request_id: req_4b1e2e
            docs: https://infraque.com/docs/api/errors#unauthenticated
    ForbiddenTier:
      description: Credential valid but the plan does not include the endpoint, scope or quota; the body names the required tier.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/forbidden_tier
            title: Plan does not include this endpoint
            status: 403
            code: forbidden_tier
            detail: '`read:bulk` requires the API plan; this key is on the Pro plan.'
            instance: /v1/bulk/proposals
            request_id: req_4b1e2f
            required_tier: api
            docs: https://infraque.com/docs/api/errors#forbidden_tier
    Forbidden:
      description: Role insufficient (admin routes) — e.g. `owner` or `legal` required.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/forbidden_tier
            title: Role insufficient
            status: 403
            code: forbidden_tier
            detail: Clearing a licence gate needs the legal role.
            instance: /admin/v1/licences/pjm-data-miner-restricted/gate
            request_id: req_4b1e30
            required_tier: admin
            docs: https://infraque.com/docs/api/errors#forbidden_tier
    LicenceGated:
      description: The requested representation (raw row, exact coordinates, document bytes) is withheld by the source licence. The derived view is still available at the parent resource; partial withholding on a `200` is reported in `redactions[]`, not here.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/licence_gated
            title: Field withheld under source licence
            status: 403
            code: licence_gated
            detail: Raw fields from source us.iso.caiso.gen_queue are not redistributable; derived fields are returned at /v1/proposals/prop_01JBQ7Z8KD.
            instance: /v1/proposals/prop_01JBQ7Z8KD/sources
            request_id: req_9f2c1a
            docs: https://infraque.com/docs/api/errors#licence_gated
    SeatLimit:
      description: Concurrent sessions above the account's seat count (US-602 AC2).
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/seat_limit
            title: Seat limit reached
            status: 403
            code: seat_limit
            detail: This account has 3 seats and 3 active sessions. Sign out another session or add a seat.
            instance: /v1/me
            request_id: req_4b1e31
            docs: https://infraque.com/docs/api/errors#seat_limit
    NotFound:
      description: No such public id, or the record is not visible to this tier — indistinguishable by design so that a gated record's existence does not leak (docs/21 §8 item 3).
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/not_found
            title: Not found
            status: 404
            code: not_found
            detail: No proposal with this id is visible on the public tier.
            instance: /v1/proposals/prop_01JBQ7Z8ZZ
            request_id: req_4b1e32
            docs: https://infraque.com/docs/api/errors#not_found
    MovedPermanently:
      description: The record was merged; `Location` points at the surviving public id (US-201 AC3). Old slugs resolve the same way.
      headers:
        Location:
          $ref: '#/components/headers/Location'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    Gone:
      description: Record withdrawn by takedown or unpublish; the id is reserved, nothing is returned.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/unpublished
            title: Record unpublished
            status: 410
            code: unpublished
            detail: This record was withdrawn from publication. The id is reserved.
            instance: /v1/proposals/prop_01JBQ7Z8KD
            request_id: req_4b1e33
            docs: https://infraque.com/docs/api/errors#unpublished
    Conflict:
      description: Idempotency-key reuse with a different body, a stale merge preview, a state transition that is not legal from the current state, or a duplicate name.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/conflict
            title: Conflict
            status: 409
            code: conflict
            detail: Merge preview is stale — prop_01JBQ7Z8KD changed since the preview token was issued. Preview again.
            instance: /admin/v1/proposals/prop_01JBQ7Z8KD/merge
            request_id: req_4b1e34
            docs: https://infraque.com/docs/api/errors#conflict
    GateUnmet:
      description: Publication refused because a licence or budget gate is unmet (US-905 AC1); the body names the gate and the missing evidence.
      headers: *std_headers
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/gate_unmet
            title: Licence gate unmet
            status: 422
            code: gate_unmet
            detail: 'Source us.iso.pjm.gen_queue cannot move to public: gate G-PJM is open and licence pjm-data-miner-restricted has reuse_class=restricted.'
            instance: /admin/v1/sources/us.iso.pjm.gen_queue/publish-state
            request_id: req_4b1e35
            gate: G-PJM
            missing: [gate_flag, reuse_class]
            docs: https://infraque.com/docs/api/errors#gate_unmet
    RateLimited:
      description: '`rate_limited` (sliding window exceeded) or `quota_exceeded` (daily cap); `Retry-After` set.'
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://api.infraque.com/errors/rate_limited
                title: Rate limit exceeded
                status: 429
                code: rate_limited
                detail: 60 requests per hour per IP on the public tier; retry in 120 seconds or use a key.
                instance: /v1/proposals
                request_id: req_4b1e36
                docs: https://infraque.com/docs/api/errors#rate_limited
            quota_exceeded:
              value:
                type: https://api.infraque.com/errors/quota_exceeded
                title: Daily quota exhausted
                status: 429
                code: quota_exceeded
                detail: 50,000 requests per day on this key; resets at 00:00 UTC.
                instance: /v1/bulk/events
                request_id: req_4b1e37
                docs: https://infraque.com/docs/api/errors#quota_exceeded
    ServiceUnavailable:
      description: '`unavailable` (maintenance; public reads keep serving from the edge cache) or `sor_unavailable` (CRM/ERP adapter down and no cached value acceptable).'
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/unavailable
            title: Temporarily unavailable
            status: 503
            code: unavailable
            detail: Maintenance in progress; cached public reads continue to be served.
            instance: /v1/exports
            request_id: req_4b1e38
            docs: https://infraque.com/docs/api/errors#unavailable
    SorUnavailable:
      description: CRM/ERP adapter down and no cached value acceptable for this operation (US-902 AC3). Reads fall back to the mirror with `meta.sor_stale = true`; writes get this response.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.infraque.com/errors/sor_unavailable
            title: System of record unavailable
            status: 503
            code: sor_unavailable
            detail: The CRM adapter did not respond; writes are refused until it recovers. Cached data is shown with a staleness banner.
            instance: /admin/v1/customers
            request_id: req_4b1e39
            docs: https://infraque.com/docs/api/errors#sor_unavailable
    NoContent:
      description: Done; no body.
      headers: *std_headers

  # ───────────────────────────── Schemas ─────────────────────────────
  schemas:
    PrivacyRequestCreate:
      type: object
      required: [kind, record_public_id, contact_email]
      properties:
        kind: {type: string, enum: [erasure, correction]}
        record_public_id: {type: string, pattern: '^[a-z]{2,8}_[0-9A-HJKMNP-TV-Z]{10,32}$'}
        contact_email: {type: string, format: email}
        message: {type: string, maxLength: 4000, nullable: true}
    PrivacyRequest:
      type: object
      required: [public_id, kind, record_public_id, status, created_at]
      properties:
        public_id: {type: string}
        kind: {type: string, enum: [erasure, correction]}
        record_public_id: {type: string}
        status: {type: string, enum: [open, in_progress, done, rejected]}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
    PrivacyRequestAdmin:
      allOf:
        - $ref: '#/components/schemas/PrivacyRequest'
        - type: object
          properties:
            contact_email: {type: string, nullable: true}
            message: {type: string, nullable: true}
    PrivacyRequestResponse:
      type: object
      required: [data, meta, licence_summary]
      properties:
        data: {$ref: '#/components/schemas/PrivacyRequest'}
        meta: {$ref: '#/components/schemas/Meta'}
        licence_summary: {$ref: '#/components/schemas/LicenceSummary'}
    PrivacyRequestAdminResponse:
      type: object
      required: [data, meta, licence_summary]
      properties:
        data: {$ref: '#/components/schemas/PrivacyRequestAdmin'}
        meta: {$ref: '#/components/schemas/Meta'}
        licence_summary: {$ref: '#/components/schemas/LicenceSummary'}
    PrivacyRequestListResponse:
      type: object
      required: [data, meta, licence_summary, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PrivacyRequestAdmin'}
        meta: {$ref: '#/components/schemas/Meta'}
        licence_summary: {$ref: '#/components/schemas/LicenceSummary'}
        page: {$ref: '#/components/schemas/Page'}
    # ---------- Public identifiers (docs/21 §1; internal UUIDs never appear) ----------
    ProposalPublicId:
      type: string
      pattern: '^prop_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [prop_01JBQ7Z8KD]
    OpportunityPublicId:
      type: string
      pattern: '^opp_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [opp_01JBQ8A2M0]
    OrganizationPublicId:
      type: string
      pattern: '^org_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [org_01JBQ8C4X1]
    EventPublicId:
      type: string
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [evt_01JBQ8F0N2]
    MatchPublicId:
      type: string
      pattern: '^mat_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [mat_01JBQ8H5R7]
    DocumentPublicId:
      type: string
      pattern: '^doc_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [doc_01JBQ8J9T3]
    SavedSearchPublicId:
      type: string
      pattern: '^ss_[0-9A-HJKMNP-TV-Z]{10,26}$'
    AlertPublicId:
      type: string
      pattern: '^alr_[0-9A-HJKMNP-TV-Z]{10,26}$'
    ExportPublicId:
      type: string
      pattern: '^exp_[0-9A-HJKMNP-TV-Z]{10,26}$'
    ApiKeyPublicId:
      type: string
      pattern: '^key_[0-9A-HJKMNP-TV-Z]{10,26}$'
    WebhookPublicId:
      type: string
      pattern: '^whe_[0-9A-HJKMNP-TV-Z]{10,26}$'
    WebhookDeliveryPublicId:
      type: string
      pattern: '^whd_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [whd_01JBQ9A1B2]
    SourceRunPublicId:
      type: string
      pattern: '^run_[0-9A-HJKMNP-TV-Z]{10,26}$'
    SnapshotPublicId:
      type: string
      pattern: '^snap_[0-9A-HJKMNP-TV-Z]{10,26}$'
    CandidatePublicId:
      type: string
      pattern: '^rc_[0-9A-HJKMNP-TV-Z]{10,26}$'
    ExtractionPublicId:
      type: string
      pattern: '^ext_[0-9A-HJKMNP-TV-Z]{10,26}$'
    PostPublicId:
      type: string
      pattern: '^post_[0-9A-HJKMNP-TV-Z]{10,26}$'
    TaskPublicId:
      type: string
      pattern: '^task_[0-9A-HJKMNP-TV-Z]{10,26}$'
    UserPublicId:
      type: string
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{10,26}$'
    AccountPublicId:
      type: string
      pattern: '^acc_[0-9A-HJKMNP-TV-Z]{10,26}$'
    SubscriptionPublicId:
      type: string
      pattern: '^subn_[0-9A-HJKMNP-TV-Z]{10,26}$'
    AssetPublicId:
      type: string
      pattern: '^asset_[0-9A-HJKMNP-TV-Z]{10,26}$'
      examples: [asset_01J3Z8C4X1]
    AnyPublicIdValue:
      type: string
      description: |
        Any graph public id (`prop_`, `opp_`, `org_`, `mat_`, `evt_`, `doc_`, `asset_`), an operational one (`usr_`, `acc_`,
        `key_`, `post_`, `task_`, `run_`, `snap_`, `ext_`), or — for admin audit events on the source and licence
        registers (`GET /admin/v1/audit`) — the register's own text id (`us.iso.ercot.gen_queue`, `us-ercot-open`).
      pattern: '^((prop|opp|org|mat|evt|doc|asset|usr|acc|key|post|task|run|snap|ext)_[0-9A-HJKMNP-TV-Z]{10,26}|[a-z][a-z0-9_.-]{1,120})$'
    SourceIdValue:
      type: string
      description: The `data/sources.yaml` id — dotted, lower-case.
      pattern: '^[a-z]{2,6}(\.[a-z0-9_]+){1,4}$'
      examples: [us.iso.caiso.gen_queue]
    LicenceIdValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
      examples: [caiso-tou]

    # ---------- Vocabularies (docs/21 §7; served live at /v1/meta/vocabularies) ----------
    ProposalKind:
      type: string
      enum: [generation, storage, load, transmission, pipeline, lng, nuclear, ccs, hydrogen, other]
    LifecycleState:
      type: string
      description: Proposal lifecycle (docs/21 §7.1 incl. `under_construction` per docs/04 §10 pick 3). Documented-open; additions announced ≥ 30 days ahead.
      enum: [unknown, announced, filed, studied, permitted, contracted, under_construction, built, withdrawn, cancelled]
    OpportunityKind:
      type: string
      enum: [rfp, foa, tender, auction, loan_program, procurement_notice, program]
    OpportunityStatus:
      type: string
      enum: [unknown, announced, open, frozen, reinstated, closed, cancelled, awarded]
    OrganizationType:
      type: string
      enum: [developer, ipp, utility, coop, cca, agency, lender, investor, epc, oem, offtaker, other]
    AliasKind:
      type: string
      enum: [legal_name, trade_name, filing_spelling, abbreviation, former_name, subsidiary]
    LocationKind:
      type: string
      enum: [point, county, state, region, service_territory]
    LocationPrecision:
      type: string
      description: >-
        What `geom` actually means. `county_centroid` with `precision_reason = licence` is the
        restricted-precision rule (docs/04 D-9). `country_centroid` added by ADR 0008 (2026-09-18)
        as the third region-grade precision alongside `county_centroid`/`state_centroid`.
      enum: [exact, county_centroid, state_centroid, country_centroid, unknown]
    PlacementGrade:
      type: string
      description: >-
        Derived from `location.precision`, never stored (ADR 0008, docs/21 §3.7): `exact` ->
        `exact`; `county_centroid`/`state_centroid`/`country_centroid` -> `region`; `unknown` ->
        `none`.
      enum: [exact, region, none]
    AssetType:
      type: string
      description: Registry-sourced infrastructure type (docs/21 §3.22, ADR 0008).
      enum:
        - power_plant
        - gas_pipeline
        - gas_processing_plant
        - gas_storage
        - lng_terminal
        - compressor_station
        - ethanol_plant
        - biodiesel_plant
        - rng_project
        - transmission_line
        - substation
        - refinery
    AssetStatus:
      type: string
      description: The source's current operating status (docs/21 §3.22) — never a lifecycle.
      enum: [operating, standby, retired, unknown]
    AssetOwnerRole:
      type: string
      enum: [owner, operator]
    DocType:
      type: string
      enum: [filing, order, notice, rfp_document, news_article, press_release, report, other]
    StoragePolicy:
      type: string
      enum: [stored, link_only, headline_only]
    SubjectType:
      type: string
      enum: [proposal, opportunity, organization, match, document, source, licence, post, user, account, api_key]
    EventType:
      type: string
      description: docs/21 §7.3. Identity, proposal lifecycle, opportunity lifecycle, field-level, matching, publication and operational groups.
      enum:
        - created
        - source_linked
        - source_unlinked
        - merged
        - unmerged
        - alias_added
        - status_change
        - filed
        - studied
        - permitted
        - contracted
        - under_construction
        - built
        - withdrawn
        - cancelled
        - announced
        - opened
        - closed
        - frozen
        - reinstated
        - awarded
        - due_date_changed
        - field_changed
        - capacity_changed
        - sponsor_changed
        - location_changed
        - extraction_accepted
        - match_added
        - match_removed
        - lead_created
        - published
        - unpublished
        - gate_cleared
        - licence_reclassified
        - source_health_changed
        - admin_edit
        - personal_data_redacted
        - key_issued
        - key_revoked
    ActorType:
      type: string
      enum: [pipeline, model, user, system]
    MatchStatus:
      type: string
      enum: [active, removed, superseded]
    CreatedBy:
      type: string
      enum: [pipeline, user, import, rule, model]
    ReuseClass:
      type: string
      enum: [open, attribution, restricted, unknown]
    RecordPublishState:
      type: string
      enum: [pending_review, ingest_only, api_only, public, unpublished]
    SourcePublishState:
      type: string
      enum: [ingest_only, api_only, public]
    SourceCategory:
      type: string
      enum: [generation_queue, load_queue, permit, regulatory_docket, funding, procurement, registry, planning, news, aggregator, social_channel]
    SourceAccess:
      type: string
      enum: [api, bulk_file, html, js_app, pdf, rss, email, wsdl]
    SourceCadence:
      type: string
      enum: [15-min, daily, weekly, twice_weekly, monthly, quarterly, annual, realtime, continuous]
    SourceEgress:
      type: string
      enum: [plain, browser, residential, api_key]
    SourceHealth:
      type: string
      enum: [ok, degraded, failing, blocked, paused]
    SourceRunStatus:
      type: string
      enum: [running, ok, unchanged, partial, failed, blocked, budget]
    Tier:
      type: string
      enum: [public, pro, api, admin]
    Entitlement:
      type: string
      description: '`account.entitlement` — the resolved tier (docs/21 §3.13). Distinct from `user.role`.'
      enum: [public, pro, api, admin]
    UserRole:
      type: string
      description: docs/21 §3.12. `legal` added 2026-09-12 so a role distinct from `owner` can clear a licence gate (US-905 AC1) — this enum was stale on that addition until Pro tier and alerts corrected it.
      enum: [viewer, member, operator, legal, owner]
    UserStatus:
      type: string
      enum: [active, disabled, anonymised]
    AccountStatus:
      type: string
      enum: [active, suspended, closed]
    PlanTier:
      type: string
      enum: [free, pro, team, api]
    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, paused, canceled]
    SavedSearchEntity:
      type: string
      enum: [proposal, opportunity, event, match]
    DeliveryMode:
      type: string
      enum: [immediate, daily, weekly, none]
    AlertChannel:
      type: string
      enum: [email, webhook, rss]
    AlertStatus:
      type: string
      enum: [queued, sent, bounced, failed, suppressed]
    ApiKeyScope:
      type: string
      enum: ['read:public', 'read:live', 'read:bulk', 'write:webhooks', 'admin:*']
    ApiKeyPrefix:
      type: string
      enum: [bk_live, bk_test]
    WebhookType:
      type: string
      enum: [event.published, match.added, match.removed, record.unpublished, webhook.test]
    WebhookEndpointStatus:
      type: string
      enum: [active, paused, disabled]
    WebhookDeliveryStatus:
      type: string
      enum: [pending, delivered, retrying, failed]
    ExportStatus:
      type: string
      enum: [queued, running, ready, failed, expired]
    ExtractionStatus:
      type: string
      enum: [proposed, accepted, rejected, superseded]
    PostChannel:
      type: string
      enum: [bluesky, linkedin, x]
    PostState:
      type: string
      enum: [draft, approved, scheduled, published, rejected, withdrawn, failed]
    TaskType:
      type: string
      enum: [report, intake_proposal, intake_opportunity, deletion_request, resolution_dispute]
    TaskStatus:
      type: string
      enum: [open, in_progress, done, rejected]
    ReportIssueType:
      type: string
      enum: [wrong_merge, wrong_status, wrong_sponsor, other]
    RedactionReason:
      type: string
      description: '`licence` (raw/identifying field withheld), `licence_precision` (exact geometry replaced by a centroid), `tier` (newer than the public lag), `personal_data` (redacted), `publish_state` (source or record unpublished).'
      enum: [licence, licence_precision, tier, personal_data, publish_state]

    # ---------- Attribution and licence envelope (docs/23 §10) ----------
    Meta:
      type: object
      description: Response metadata. `tier`, `lag_days` and `data_as_of` drive the public messaging and the "live in Pro" banner (US-604, US-201 AC4).
      required: [tier, lag_days, data_as_of, generated_at, request_id, terms_url]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        lag_days:
          type: integer
          minimum: 0
          description: Effective lag applied to this response; `0` on Pro and above. On mixed-source lists it is the maximum lag present.
        data_as_of:
          type: string
          format: date-time
          description: Instant the data is current to. On the public tier `now − lag` of the materialised view; live tiers report the last commit time.
        generated_at:
          type: string
          format: date-time
        request_id:
          type: string
          pattern: '^req_[0-9a-z]{6,32}$'
        terms_url:
          type: string
          format: uri
          description: The API licence version this response was served under.
        total:
          type: integer
          minimum: 0
          description: Present only with `include=count`.
        total_is_estimate:
          type: boolean
          description: '`false` when `total ≤ 10,000` and exact; `true` when estimated.'
        unplaced_count:
          type: integer
          minimum: 0
          description: Geo endpoints only — visible records with no geography, so they are never silently dropped (docs/04 D-8).
        sor_stale:
          type: boolean
          description: Admin customer/subscription views only — data comes from the cached mirror because the adapter is unavailable (US-902 AC3).
        sor_cached_at:
          type: string
          format: date-time
      additionalProperties: false
    Page:
      type: object
      required: [next_cursor, prev_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque; valid 24 h.
        prev_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
      additionalProperties: false
    LicenceSummarySource:
      type: object
      description: One entry per distinct source present in the payload; the list page renders one credit line per entry (US-105 AC1).
      required: [source_id, name, licence_id, licence_name, reuse_class, attribution_text, requires_link_back, record_count, retrieved_at_max]
      properties:
        source_id:
          $ref: '#/components/schemas/SourceIdValue'
        name:
          type: string
        operator:
          type: [string, 'null']
        licence_id:
          $ref: '#/components/schemas/LicenceIdValue'
        licence_name:
          type: string
        licence_url:
          type: [string, 'null']
          format: uri
        reuse_class:
          $ref: '#/components/schemas/ReuseClass'
        attribution_text:
          type: [string, 'null']
          description: Exact credit string to render (source override or licence default).
        requires_link_back:
          type: boolean
        record_count:
          type: integer
          minimum: 0
        retrieved_at_max:
          type: string
          format: date-time
    LicenceSummary:
      type: object
      required: [sources, attribution_line, redistribution]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/LicenceSummarySource'
        attribution_line:
          type: string
          description: Rendered credit line for the whole payload, ready to print.
          examples: ['Sources: California ISO; ERCOT; U.S. Energy Information Administration (public domain).']
        redistribution:
          type: string
          description: Human-readable statement of what may be redistributed from this payload and which sources withheld raw rows.
    Redaction:
      type: object
      description: A field that exists on the record but does not travel. Partial redaction is a `200`, never an error.
      required: [public_id, field, reason]
      properties:
        public_id:
          $ref: '#/components/schemas/AnyPublicIdValue'
        field:
          type: string
          description: JSON path within the record, e.g. `sources[0].raw`, `location.geom`, `after.status_raw`.
        reason:
          $ref: '#/components/schemas/RedactionReason'
        source_id:
          $ref: '#/components/schemas/SourceIdValue'
        note:
          type: string
          examples: [county centroid returned]
    Envelope:
      type: object
      description: The envelope every response carries (docs/23 §10; docs/04 API-5). Feed items, export rows and webhook deliveries carry the same fields.
      required: [data, meta, licence_summary, redactions]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        licence_summary:
          $ref: '#/components/schemas/LicenceSummary'
        redactions:
          type: array
          items:
            $ref: '#/components/schemas/Redaction'
    ListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [page]
          properties:
            page:
              $ref: '#/components/schemas/Page'

    # ---------- Provenance (docs/21 rule 1; docs/23 §10 per-record fields) ----------
    ProvenanceQuartet:
      type: object
      description: The four mandatory fields on every row that originates outside the platform, plus the licence's reuse class and credit for rendering.
      required: [source_id, source_url, retrieved_at, licence_id, reuse_class]
      properties:
        source_id:
          $ref: '#/components/schemas/SourceIdValue'
        source_name:
          type: string
        source_url:
          type: string
          format: uri
          description: Deep link to the row or its nearest addressable page — the "view at source" link.
        retrieved_at:
          type: string
          format: date-time
        licence_id:
          $ref: '#/components/schemas/LicenceIdValue'
        reuse_class:
          $ref: '#/components/schemas/ReuseClass'
        attribution_text:
          type: [string, 'null']
        snapshot_id:
          $ref: '#/components/schemas/SnapshotPublicId'
          description: Admin tier only.
    ProvenanceRow:
      allOf:
        - $ref: '#/components/schemas/ProvenanceQuartet'
        - type: object
          description: One visible source row on a fused record (`provenance[]`).
          properties:
            source_record_id:
              type: [string, 'null']
              description: Stable id in the source (queue id, docket number); absent where the licence withholds identifying fields.
            first_seen:
              type: string
              format: date-time
            last_seen:
              type: string
              format: date-time
            gone_at:
              type: [string, 'null']
              format: date-time
              description: Set when the row disappeared from the register — a signal, never a delete.
    FieldProvenance:
      type: object
      description: 'Per canonical field: which source and snapshot the value came from (docs/21 §3.1). Pro+ detail responses only.'
      additionalProperties:
        type: object
        required: [source_id, licence_id, retrieved_at]
        properties:
          source_id:
            $ref: '#/components/schemas/SourceIdValue'
          licence_id:
            $ref: '#/components/schemas/LicenceIdValue'
          retrieved_at:
            type: string
            format: date-time
          snapshot_id:
            $ref: '#/components/schemas/SnapshotPublicId'
            description: Admin tier only.
      examples:
        - capacity_mw:
            source_id: us.iso.caiso.gen_queue
            licence_id: caiso-tou
            retrieved_at: '2026-09-11T05:00:00Z'

    # ---------- Errors (docs/23 §8; RFC 9457) ----------
    ErrorCode:
      type: string
      enum:
        - validation_error
        - unknown_parameter
        - invalid_cursor
        - unauthenticated
        - forbidden_tier
        - licence_gated
        - seat_limit
        - not_found
        - unpublished
        - conflict
        - gate_unmet
        - rate_limited
        - quota_exceeded
        - sor_unavailable
        - unavailable
    Problem:
      type: object
      description: RFC 9457 problem details. No stack traces, internal ids or source payloads ever appear here. `type` is `https://api.infraque.com/errors/{code}`.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          pattern: '^https://api\.infraque\.com/errors/(validation_error|unknown_parameter|invalid_cursor|unauthenticated|forbidden_tier|licence_gated|seat_limit|not_found|unpublished|conflict|gate_unmet|rate_limited|quota_exceeded|sor_unavailable|unavailable)$'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        request_id:
          type: string
          pattern: '^req_[0-9a-z]{6,32}$'
        errors:
          type: array
          description: Field-level problems on `validation_error` / `unknown_parameter`.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        required_tier:
          $ref: '#/components/schemas/Tier'
          description: On `forbidden_tier`.
        gate:
          type: string
          description: On `gate_unmet` — the gate name (G-PJM, G-MISO, …) or `budget`.
        missing:
          type: array
          description: On `gate_unmet` — the unmet conditions.
          items:
            type: string
        docs:
          type: string
          format: uri
      examples:
        - type: https://api.infraque.com/errors/licence_gated
          title: Field withheld under source licence
          status: 403
          code: licence_gated
          detail: Raw fields from source us.iso.caiso.gen_queue are not redistributable; derived fields are returned.
          instance: /v1/proposals/prop_01JBQ7Z8KD/sources
          request_id: req_9f2c1a
          docs: https://infraque.com/docs/api/errors#licence_gated

    # ---------- Domain entities (docs/21 §3) ----------
    OrganizationSummary:
      type: object
      description: Embedded sponsor / issuer reference.
      required: [public_id, slug, name_canonical, type, url]
      properties:
        public_id:
          $ref: '#/components/schemas/OrganizationPublicId'
        slug:
          type: string
        name_canonical:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        url:
          type: string
          format: uri
          description: Detail page on the product host.
    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: Point
        coordinates:
          type: array
          description: '`[lon, lat]` WGS 84.'
          minItems: 2
          maxItems: 2
          items:
            type: number
    GeoJsonLineString:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          description: '`[lon, lat]` vertices, WGS 84, at least two.'
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
    GeoJsonMultiLineString:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          const: MultiLineString
        coordinates:
          type: array
          description: One `LineString` coordinate array per part, at least one.
          minItems: 1
          items:
            type: array
            minItems: 2
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
          items: {}
    Location:
      type: object
      description: docs/21 §3.7. `geom` is a representative point, never a raw restricted-source coordinate on non-admin surfaces; `precision` says what it means.
      required: [kind, precision, country, provenance]
      properties:
        kind:
          $ref: '#/components/schemas/LocationKind'
        geom:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPoint'
            - $ref: '#/components/schemas/GeoJsonPolygon'
            - type: 'null'
        precision:
          $ref: '#/components/schemas/LocationPrecision'
        precision_reason:
          type: [string, 'null']
          enum: [licence, source, geocoder, null]
          description: >-
            `licence` when an exact coordinate was replaced by its region grade under the restricted-precision rule
            (docs/04 D-9): the county centroid (`precision = county_centroid`), else the state centroid
            (`state_centroid`), else `unknown` with `geom = null`. Applied where the row is served, so it holds for
            a location stored `exact` under a licence with `allows_raw_publication = false` too; the stored
            coordinate is never returned on a non-admin surface, and the envelope lists `location.geom` in
            `redactions[]` with reason `licence_precision`.
        county_fips:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
        county_name:
          type: [string, 'null']
        state_code:
          type: [string, 'null']
          description: ISO 3166-2 subdivision.
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        raw_place:
          type: [string, 'null']
          description: Verbatim place string — gated (raw class); admin or `allows_raw_publication` sources only.
        geocoder:
          type: [string, 'null']
          enum: [source_provided, census_tiger, manual, null]
        provenance:
          $ref: '#/components/schemas/ProvenanceQuartet'
    ProposalIdentifiers:
      type: object
      description: Resolution keys. Identifying class — withheld for sources whose licence withholds identifying fields.
      properties:
        eia_plant_id:
          type: [string, 'null']
        eia_generator_id:
          type: [string, 'null']
        queue_ids:
          type: array
          items:
            type: object
            required: [iso, id]
            properties:
              iso:
                type: string
              id:
                type: string
        ferc_dockets:
          type: array
          items:
            type: string
        nrc_dockets:
          type: array
          items:
            type: string
      additionalProperties: true
    Proposal:
      type: object
      description: One real-world project (docs/21 §3.1). Fields absent on the caller's tier are listed in the envelope's `redactions[]`.
      required: [public_id, slug, url, kind, name_canonical, jurisdiction, lifecycle_state, identifiers, first_seen, last_changed, min_reuse_class, source_count, created_by, provenance]
      properties:
        public_id:
          $ref: '#/components/schemas/ProposalPublicId'
        slug:
          type: string
          examples: [gemini-solar-bess-clark-nv]
        url:
          type: string
          format: uri
          description: Canonical detail page (`https://infraque.com/proposals/{slug}`).
        kind:
          $ref: '#/components/schemas/ProposalKind'
        name_canonical:
          type: string
        sponsor:
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        technology:
          type: [string, 'null']
          description: Normalised technology token.
          examples: [bess_li_ion]
        technology_raw:
          type: [string, 'null']
          description: Verbatim source value — raw class, gated.
        capacity_mw:
          type: [number, 'null']
          description: numeric(12,3); nameplate or requested MW.
        storage_mwh:
          type: [number, 'null']
        jurisdiction:
          type: string
          description: ISO 3166-2.
        iso:
          type: [string, 'null']
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        status_raw:
          type: [string, 'null']
          description: Verbatim source status — raw class, gated.
        identifiers:
          $ref: '#/components/schemas/ProposalIdentifiers'
        proposed_online_date:
          type: [string, 'null']
          format: date
        first_seen:
          type: string
          format: date-time
        last_changed:
          type: string
          format: date-time
          description: Latest event that changed a canonical field, as visible to the caller's tier.
        published_at:
          type: [string, 'null']
          format: date-time
          description: Pro+ only.
        public_at:
          type: [string, 'null']
          format: date-time
          description: When the record became (or becomes) visible on the public tier.
        min_reuse_class:
          $ref: '#/components/schemas/ReuseClass'
          description: Most restrictive reuse class across the *visible* sources.
        source_count:
          type: integer
          minimum: 0
          description: Active visible source rows.
        created_by:
          type: string
          enum: [pipeline, user, import]
        resolution_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        merged_into:
          oneOf:
            - $ref: '#/components/schemas/ProposalPublicId'
            - type: 'null'
        provenance:
          type: array
          description: One entry per visible source row.
          items:
            $ref: '#/components/schemas/ProvenanceRow'
        field_provenance:
          $ref: '#/components/schemas/FieldProvenance'
        sources:
          type: array
          description: With `include=sources`.
          items:
            $ref: '#/components/schemas/ProposalSource'
        events:
          type: array
          description: With `include=events` — first page, newest first.
          items:
            $ref: '#/components/schemas/Event'
        matches:
          type: array
          description: With `include=matches`.
          items:
            $ref: '#/components/schemas/Match'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummary'
    ProposalSource:
      allOf:
        - $ref: '#/components/schemas/ProvenanceRow'
        - type: object
          description: One source's observation of a proposal (docs/21 §3.2). `raw` and `status_raw` only where `allows_raw_publication`.
          required: [link_method, link_confidence, active]
          properties:
            raw:
              type: object
              description: Parsed source row verbatim — gated (raw class).
              additionalProperties: true
            normalised:
              type: object
              description: Canonical projection before fusion (derived class).
              additionalProperties: true
            status_raw:
              type: [string, 'null']
            link_method:
              type: string
              enum: [deterministic_key, rule, model, user]
            link_confidence:
              type: number
              minimum: 0
              maximum: 1
            link_event_id:
              $ref: '#/components/schemas/EventPublicId'
            active:
              type: boolean
    OpportunitySource:
      $ref: '#/components/schemas/ProposalSource'
      description: Identical shape for an opportunity (docs/21 §3.4).
    OpportunityIdentifiers:
      type: object
      properties:
        grants_gov_number:
          type: [string, 'null']
        ted_notice_id:
          type: [string, 'null']
        sam_notice_id:
          type: [string, 'null']
        solicitation_number:
          type: [string, 'null']
      additionalProperties: true
    Opportunity:
      type: object
      description: Demand-side object (docs/21 §3.3).
      required: [public_id, slug, url, kind, title, jurisdiction, technologies, status, identifiers, first_seen, last_changed, min_reuse_class, source_count, created_by, provenance]
      properties:
        public_id:
          $ref: '#/components/schemas/OpportunityPublicId'
        slug:
          type: string
        url:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/OpportunityKind'
        issuer:
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        title:
          type: string
        summary:
          type: [string, 'null']
          description: Derived summary; never a copied article body.
        jurisdiction:
          type: string
          description: ISO 3166-2, or `US` for federal.
        technologies:
          type: array
          description: Empty for all-source.
          items:
            type: string
        capacity_sought_mw:
          type: [number, 'null']
        budget_amount:
          type: [number, 'null']
          description: numeric(18,2) in `budget_currency`.
        budget_currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        open_at:
          type: [string, 'null']
          format: date
        due_at:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/OpportunityStatus'
        status_raw:
          type: [string, 'null']
          description: Raw class, gated.
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        identifiers:
          $ref: '#/components/schemas/OpportunityIdentifiers'
        first_seen:
          type: string
          format: date-time
        last_changed:
          type: string
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        public_at:
          type: [string, 'null']
          format: date-time
        min_reuse_class:
          $ref: '#/components/schemas/ReuseClass'
        source_count:
          type: integer
          minimum: 0
        created_by:
          type: string
          enum: [pipeline, user, import]
        merged_into:
          oneOf:
            - $ref: '#/components/schemas/OpportunityPublicId'
            - type: 'null'
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceRow'
        field_provenance:
          $ref: '#/components/schemas/FieldProvenance'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OpportunitySource'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        documents:
          type: array
          description: Title, type and link only (US-302 AC1).
          items:
            $ref: '#/components/schemas/DocumentSummary'
    OrganizationAlias:
      allOf:
        - $ref: '#/components/schemas/ProvenanceQuartet'
        - type: object
          required: [alias, kind, confidence, created_by]
          properties:
            alias:
              type: string
            kind:
              $ref: '#/components/schemas/AliasKind'
            confidence:
              type: number
              minimum: 0
              maximum: 1
            created_by:
              type: string
              enum: [pipeline, model, user]
    Organization:
      type: object
      description: docs/21 §3.5. Holds no personal data.
      required: [public_id, slug, url, name_canonical, type, country, ids, is_curated_issuer, first_seen, last_changed, provenance]
      properties:
        public_id:
          $ref: '#/components/schemas/OrganizationPublicId'
        slug:
          type: string
        url:
          type: string
          format: uri
        name_canonical:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        jurisdiction:
          type: [string, 'null']
        ids:
          type: object
          properties:
            lei:
              type: [string, 'null']
            sam_uei:
              type: [string, 'null']
            eia_utility_id:
              type: [string, 'null']
            cik:
              type: [string, 'null']
            duns:
              type: [string, 'null']
          additionalProperties: true
        website:
          type: [string, 'null']
          format: uri
        is_curated_issuer:
          type: boolean
          description: On the curated RFP issuer list (US-303).
        first_seen:
          type: string
          format: date-time
        last_changed:
          type: string
          format: date-time
        merged_into:
          oneOf:
            - $ref: '#/components/schemas/OrganizationPublicId'
            - type: 'null'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationAlias'
        proposal_count:
          type: integer
          minimum: 0
          description: Visible proposals sponsored.
        opportunity_count:
          type: integer
          minimum: 0
        asset_counts:
          $ref: '#/components/schemas/OrganizationAssetTotals'
        group_asset_counts:
          description: '`asset_counts` over the organisation and its direct subsidiaries together; equals `asset_counts` when it has none. Detail responses only.'
          $ref: '#/components/schemas/OrganizationAssetTotals'
        parent:
          description: GLEIF Level 2 direct parent (`parent_org_id`), or null. Detail responses only.
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        subsidiaries:
          type: array
          description: Organisations whose `parent_org_id` is this one, name order, at most 50. Detail responses only.
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        subsidiary_count:
          type: integer
          minimum: 0
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceRow'
    DocumentSummary:
      type: object
      required: [document_id, title, doc_type, url, provenance]
      properties:
        document_id:
          $ref: '#/components/schemas/DocumentPublicId'
        title:
          type: string
        doc_type:
          $ref: '#/components/schemas/DocType'
        published_date:
          type: [string, 'null']
          format: date
        url:
          type: string
          format: uri
          description: '`GET /v1/documents/{document_id}`.'
        provenance:
          $ref: '#/components/schemas/ProvenanceQuartet'
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          description: docs/21 §3.8. Bytes only where `storage_policy = stored` and the licence allows.
          required: [subject_type, storage_policy, identifiers, text_extracted, personal_data_flag]
          properties:
            subject_type:
              type: string
              enum: [proposal, opportunity, organization, none]
            subject_id:
              oneOf:
                - $ref: '#/components/schemas/AnyPublicIdValue'
                - type: 'null'
            identifiers:
              type: object
              properties:
                accession_number:
                  type: [string, 'null']
                docket_id:
                  type: [string, 'null']
                adams_id:
                  type: [string, 'null']
              additionalProperties: true
            storage_policy:
              $ref: '#/components/schemas/StoragePolicy'
            content_type:
              type: [string, 'null']
            byte_size:
              type: [integer, 'null']
            sha256:
              type: [string, 'null']
              pattern: '^[0-9a-f]{64}$'
            page_count:
              type: [integer, 'null']
            text_extracted:
              type: boolean
            personal_data_flag:
              type: boolean
            robots_opt_out:
              type: boolean
            download_url:
              type: [string, 'null']
              format: uri
              description: Pre-signed, short-lived; present only when the licence allows and `personal_data_flag = false`.
            download_expires_at:
              type: [string, 'null']
              format: date-time
    Event:
      type: object
      description: One row of the append-only log (docs/21 §3.10). `before`/`after` are keyed by canonical field name and gated at field class.
      required: [id, seq, subject_type, subject_id, event_type, observed_at, recorded_at, actor_type]
      properties:
        id:
          $ref: '#/components/schemas/EventPublicId'
        seq:
          type: integer
          format: int64
          description: The API cursor and alert watermark.
        subject_type:
          $ref: '#/components/schemas/SubjectType'
        subject_id:
          $ref: '#/components/schemas/AnyPublicIdValue'
        subject:
          type: object
          description: Denormalised subject summary for feeds and webhooks.
          properties:
            public_id:
              $ref: '#/components/schemas/AnyPublicIdValue'
            name:
              type: string
            url:
              type: string
              format: uri
        event_type:
          $ref: '#/components/schemas/EventType'
        headline:
          type: string
          description: Rendered one-line headline used by feeds and posts.
          examples: ['Permit issued: Gemini Solar + Storage']
        observed_at:
          type: string
          format: date-time
          description: When it happened per the source.
        recorded_at:
          type: string
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        public_at:
          type: [string, 'null']
          format: date-time
        before:
          type: [object, 'null']
          additionalProperties: true
        after:
          type: [object, 'null']
          additionalProperties: true
        changed_keys:
          type: array
          items:
            type: string
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_user_id:
          oneOf:
            - $ref: '#/components/schemas/UserPublicId'
            - type: 'null'
          description: Admin audit views only.
        reason:
          type: [string, 'null']
          description: Present on `actor_type = user` events.
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        reverses_event_id:
          oneOf:
            - $ref: '#/components/schemas/EventPublicId'
            - type: 'null'
        provenance:
          oneOf:
            - $ref: '#/components/schemas/ProvenanceQuartet'
            - type: 'null'
          description: Null only for `actor_type = user` events.
    MatchRationale:
      type: object
      required: [rules_passed, rules_failed]
      properties:
        rules_passed:
          type: array
          items:
            type: string
        rules_failed:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties: true
    Match:
      type: object
      description: docs/21 §3.11. An entity with score, rationale and lifecycle; never a bare join.
      required: [match_id, proposal, opportunity, score, rationale, rationale_text, rule_set_version, created_by, status, first_matched_at, last_evaluated_at]
      properties:
        match_id:
          $ref: '#/components/schemas/MatchPublicId'
        proposal:
          type: object
          required: [public_id, name_canonical, url]
          properties:
            public_id:
              $ref: '#/components/schemas/ProposalPublicId'
            name_canonical:
              type: string
            url:
              type: string
              format: uri
        opportunity:
          type: object
          required: [public_id, title, url]
          properties:
            public_id:
              $ref: '#/components/schemas/OpportunityPublicId'
            title:
              type: string
            due_at:
              type: [string, 'null']
              format: date-time
            url:
              type: string
              format: uri
        score:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          $ref: '#/components/schemas/MatchRationale'
        rationale_text:
          type: string
          examples: ['storage, TX, 50–500 MW, due in 45 days']
        rule_set_version:
          type: string
          examples: [match-rules@v2]
        created_by:
          type: string
          enum: [rule, model, user]
        status:
          $ref: '#/components/schemas/MatchStatus'
        first_matched_at:
          type: string
          format: date-time
        last_evaluated_at:
          type: string
          format: date-time
        removed_at:
          type: [string, 'null']
          format: date-time
        dismissed_by_me:
          type: boolean
          description: Pro+ only; the caller's per-user dismissal (US-402 AC2).
        crm_lead_ref:
          type: [string, 'null']
          description: Admin only.
    LicenceSummaryEmbedded:
      type: object
      required: [licence_id, name, reuse_class, attribution_required, requires_link_back, allows_derived_publication, allows_raw_publication, allows_api_redistribution, allows_bulk_export, allows_commercial_use, share_alike, gate_flag]
      properties:
        licence_id:
          $ref: '#/components/schemas/LicenceIdValue'
        name:
          type: string
        url:
          type: [string, 'null']
          format: uri
        reuse_class:
          $ref: '#/components/schemas/ReuseClass'
        attribution_required:
          type: boolean
        attribution_text:
          type: [string, 'null']
        requires_link_back:
          type: boolean
        allows_derived_publication:
          type: boolean
        allows_raw_publication:
          type: boolean
        allows_api_redistribution:
          type: boolean
        allows_bulk_export:
          type: boolean
        allows_commercial_use:
          type: boolean
        share_alike:
          type: boolean
        gate_flag:
          type: boolean
        gate_name:
          type: [string, 'null']
          examples: [G-PJM]
        quote_text:
          type: [string, 'null']
          description: The free-text `license` clause quoted from `data/sources.yaml` for this licence (docs/21 §3.19) — the literal terms, not a paraphrase. `null` for a licence recorded before this field existed. Distinct from the admin-only `notes` (`AdminLicence`), which may carry in-progress legal commentary not meant for public display.
    Licence:
      allOf:
        - $ref: '#/components/schemas/LicenceSummaryEmbedded'
        - type: object
          description: docs/21 §3.19 public view.
          properties:
            gate_cleared_at:
              type: [string, 'null']
              format: date-time
            expires_at:
              type: [string, 'null']
              format: date-time
            source_count:
              type: integer
              minimum: 0
    AdminLicence:
      allOf:
        - $ref: '#/components/schemas/Licence'
        - type: object
          description: Adds gate evidence (admin only).
          properties:
            gate_cleared_by:
              oneOf:
                - $ref: '#/components/schemas/UserPublicId'
                - type: 'null'
            evidence_url:
              type: [string, 'null']
              format: uri
            evidence_retrieved_at:
              type: [string, 'null']
              format: date-time
            evidence_object_key:
              type: [string, 'null']
            classified_by:
              type: [string, 'null']
            contract_ref:
              type: [string, 'null']
            notes:
              type: [string, 'null']
    Source:
      type: object
      description: Public registry view (docs/21 §4.1 manifest fields plus publish state and lag).
      required: [source_id, name, category, url, access, cadence, tier, licence, publish_state, lag_days, lag_overrides, implemented, provenance]
      properties:
        source_id:
          $ref: '#/components/schemas/SourceIdValue'
        name:
          type: string
        jurisdiction:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/SourceCategory'
        operator:
          type: [string, 'null']
        url:
          type: string
          format: uri
        access:
          $ref: '#/components/schemas/SourceAccess'
        format:
          type: [string, 'null']
        cadence:
          $ref: '#/components/schemas/SourceCadence'
        tier:
          type: integer
          enum: [1, 2, 3]
        licence:
          $ref: '#/components/schemas/LicenceSummaryEmbedded'
        attribution_text:
          type: [string, 'null']
          description: Effective credit string (source override, else licence default).
        publish_state:
          $ref: '#/components/schemas/SourcePublishState'
        lag_days:
          type: [integer, 'null']
          description: Override of the class default; null = default.
        lag_overrides:
          type: object
          description: 'Per-event-type lag, e.g. `{"withdrawn": 0}`.'
          additionalProperties:
            type: integer
            minimum: 0
        implemented:
          type: boolean
        last_success_at:
          type: [string, 'null']
          format: date-time
        provenance:
          type: object
          description: The registry entry's own provenance — the manifest version and hash.
          required: [manifest_version, manifest_hash]
          properties:
            manifest_version:
              type: string
              examples: ['2026-09-12']
            manifest_hash:
              type: string
              pattern: '^[0-9a-f]{64}$'

    # ---------- Map (US-104; docs/04 §2.2) ----------
    GeoClusterProperties:
      type: object
      required: [feature_kind, count, lifecycle_state_counts, technology_counts, capacity_mw_sum, bbox, precision]
      properties:
        feature_kind:
          type: string
          const: cluster
        cluster_id:
          type: string
        count:
          type: integer
          minimum: 1
        lifecycle_state_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Keys are `LifecycleState` values.
        technology_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        status_counts:
          type: object
          description: Opportunity clusters only; keys are `OpportunityStatus` values.
          additionalProperties:
            type: integer
            minimum: 0
        kind_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        capacity_mw_sum:
          type: number
          minimum: 0
        dominant_lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        dominant_technology:
          type: [string, 'null']
        bbox:
          type: array
          description: '`[min_lon, min_lat, max_lon, max_lat]` of the members; zoom into it to split the cluster.'
          minItems: 4
          maxItems: 4
          items:
            type: number
        precision:
          type: string
          description: '`mixed` when members differ.'
          enum: [exact, county_centroid, state_centroid, mixed]
        expands_to_zoom:
          type: integer
          minimum: 0
          maximum: 22
    GeoRecordProperties:
      type: object
      description: An individual proposal or opportunity marker or polygon. Carries the accessible-name fields of docs/04 D-14 and the provenance for the drawer (D-12).
      required: [feature_kind, public_id, name, url, precision, provenance]
      properties:
        feature_kind:
          type: string
          enum: [proposal, opportunity]
        public_id:
          $ref: '#/components/schemas/AnyPublicIdValue'
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
        technology:
          type: [string, 'null']
        technologies:
          type: array
          items:
            type: string
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        status:
          $ref: '#/components/schemas/OpportunityStatus'
        capacity_mw:
          type: [number, 'null']
        capacity_sought_mw:
          type: [number, 'null']
        due_at:
          type: [string, 'null']
          format: date-time
        county_name:
          type: [string, 'null']
        state_code:
          type: [string, 'null']
        precision:
          $ref: '#/components/schemas/LocationPrecision'
        precision_reason:
          type: [string, 'null']
          enum: [licence, source, geocoder, null]
          description: >-
            `licence` when the feature's point is a region centroid standing in for a withheld exact coordinate
            (restricted-precision rule, docs/04 D-9). A location stored `exact` under a licence with
            `allows_raw_publication = false` is never drawn as a `proposal` feature at all — it joins the `region`
            feature for its county (else state) — so `licence` appears here only on `county_centroid` rows.
        precision_note:
          type: [string, 'null']
          examples: ['location shown at county level (source licence)', 'location shown at state level (source licence)']
        centroid:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPoint'
            - type: 'null'
          description: Polygon features only — label anchor.
        last_changed:
          type: string
          format: date-time
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceRow'
    GeoAggregateProperties:
      type: object
      description: State-level aggregate for records with state-only geography (docs/04 D-8).
      required: [feature_kind, state_code, count, lifecycle_state_counts, technology_counts, capacity_mw_sum]
      properties:
        feature_kind:
          type: string
          const: state_aggregate
        state_code:
          type: string
        count:
          type: integer
          minimum: 1
        lifecycle_state_counts:
          type: object
          additionalProperties:
            type: integer
        technology_counts:
          type: object
          additionalProperties:
            type: integer
        status_counts:
          type: object
          additionalProperties:
            type: integer
        capacity_mw_sum:
          type: number
    GeoRegionProperties:
      type: object
      description: >-
        A region-placement group (ADR 0008, docs/21 §3.7): every visible proposal whose
        `location.precision` is `county_centroid`, `state_centroid` or `country_centroid`,
        grouped by `region_id`. The geometry is the region's representative point, never a
        polygon — the filled shape comes from `GET /v1/geo/regions`.
      required: [feature_kind, region_level, region_id, name, count, lifecycle_state_counts, technology_counts, capacity_mw_sum]
      properties:
        feature_kind:
          type: string
          const: region
        region_level:
          type: string
          enum: [county, state, country]
        region_id:
          type: string
          description: '`county_fips` (county), `state_code` (state), or ISO 3166-1 alpha-2 (country).'
        name:
          type: [string, 'null']
        count:
          type: integer
          minimum: 1
        lifecycle_state_counts:
          type: object
          additionalProperties:
            type: integer
        technology_counts:
          type: object
          additionalProperties:
            type: integer
        capacity_mw_sum:
          type: number
    GeoFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
        geometry:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPoint'
            - $ref: '#/components/schemas/GeoJsonPolygon'
        properties:
          oneOf:
            - $ref: '#/components/schemas/GeoClusterProperties'
            - $ref: '#/components/schemas/GeoRecordProperties'
            - $ref: '#/components/schemas/GeoAggregateProperties'
            - $ref: '#/components/schemas/GeoRegionProperties'
          discriminator:
            propertyName: feature_kind
            mapping:
              cluster: '#/components/schemas/GeoClusterProperties'
              proposal: '#/components/schemas/GeoRecordProperties'
              opportunity: '#/components/schemas/GeoRecordProperties'
              state_aggregate: '#/components/schemas/GeoAggregateProperties'
              region: '#/components/schemas/GeoRegionProperties'
    GeoFeatureCollection:
      type: object
      description: RFC 7946 FeatureCollection. Up to 2,000 features.
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        features:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/GeoFeature'
        totals:
          type: object
          description: Counts over everything visible in the bbox, including cluster members.
          properties:
            records:
              type: integer
            clustered:
              type: boolean
              description: '`false` when every record is an individual feature (≤ 500 visible).'
            lifecycle_state_counts:
              type: object
              additionalProperties:
                type: integer
            technology_counts:
              type: object
              additionalProperties:
                type: integer
    GeoResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GeoFeatureCollection'

    # ---------- Assets (docs/21 §3.22-§3.23, ADR 0008 — generalises the 2026-09-14 context layer) ----------
    AssetGeoProperties:
      type: object
      description: An individual asset marker (`GET /v1/assets/geo`, and `GET /v1/context/plants/geo` forcing `asset_type=power_plant`).
      required: [feature_kind, public_id, slug, url, name, asset_type, status, technologies, source]
      properties:
        feature_kind:
          type: string
          const: asset
        public_id:
          $ref: '#/components/schemas/AssetPublicId'
        slug:
          type: string
        url:
          type: string
          format: uri
          description: The asset page.
        name:
          type: string
        operator_name:
          type: [string, 'null']
        asset_type:
          $ref: '#/components/schemas/AssetType'
        status:
          $ref: '#/components/schemas/AssetStatus'
        technology:
          type: [string, 'null']
        technology_raw:
          type: [string, 'null']
        technologies:
          type: object
          description: Raw per-technology nameplate MW split.
          additionalProperties:
            type: number
        capacity_mw:
          type: [number, 'null']
        unit_count:
          type: [integer, 'null']
        commissioned_year:
          type: [integer, 'null']
        state_code:
          type: [string, 'null']
        county_name:
          type: [string, 'null']
        source:
          $ref: '#/components/schemas/ProvenanceQuartet'
    AssetLineProperties:
      type: object
      description: >-
        One line asset (`gas_pipeline`, `transmission_line`) drawn from its `geom_line`, simplified at the request's
        zoom. Never clustered. `attributes` is the subset of the asset's objective attributes useful on a map:
        for an EIA Atlas pipeline row (one per operator × pipeline type) `pipeline_type`, `miles`,
        `states_crossed`, `segment_count`, `part_count`; other sources may add `operator`, `interstate`,
        `intrastate`, `diameter`, `diameter_in`, `diameter_mix`, `length_miles`, `states`, `voltage_kv` --
        whichever the registry recorded. The detail response carries the whole set.
      required: [feature_kind, public_id, slug, url, name, asset_type, status, length_miles, attributes, source]
      properties:
        feature_kind:
          type: string
          const: asset_line
        public_id:
          $ref: '#/components/schemas/AssetPublicId'
        slug:
          type: string
        url:
          type: string
          format: uri
          description: The asset page.
        name:
          type: string
        operator_name:
          type: [string, 'null']
        asset_type:
          $ref: '#/components/schemas/AssetType'
        status:
          $ref: '#/components/schemas/AssetStatus'
        state_code:
          type: [string, 'null']
        capacity_value:
          type: [number, 'null']
          description: The registry's native capacity figure (e.g. MMcf/d for a pipeline), unit in `capacity_unit`.
        capacity_unit:
          type: [string, 'null']
        length_miles:
          type: number
          minimum: 0
          description: The registry's stated length (`attributes.miles` or `attributes.length_miles`), else the geodesic length of the stored (unsimplified) line.
        attributes:
          type: object
          additionalProperties: true
        source:
          $ref: '#/components/schemas/ProvenanceQuartet'
    AssetClusterProperties:
      type: object
      required: [feature_kind, count, asset_type_counts, technology_counts, capacity_mw_sum, bbox, expands_to_zoom]
      properties:
        feature_kind:
          type: string
          const: asset_cluster
        count:
          type: integer
          minimum: 1
        asset_type_counts:
          type: object
          additionalProperties:
            type: integer
        technology_counts:
          type: object
          additionalProperties:
            type: integer
        capacity_mw_sum:
          type: number
        dominant_asset_type:
          $ref: '#/components/schemas/AssetType'
        dominant_technology:
          type: [string, 'null']
        bbox:
          type: array
          description: '`[min_lon, min_lat, max_lon, max_lat]` of the members; zoom into it to split the cluster.'
          minItems: 4
          maxItems: 4
          items:
            type: number
        expands_to_zoom:
          type: integer
          minimum: 0
          maximum: 22
    AssetGeoFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        id:
          type: string
          description: Individual `asset` and `asset_line` features only — the asset's public id.
        geometry:
          description: '`Point` for `asset` and `asset_cluster`; `LineString` or `MultiLineString` for `asset_line`.'
          oneOf:
            - $ref: '#/components/schemas/GeoJsonPoint'
            - $ref: '#/components/schemas/GeoJsonLineString'
            - $ref: '#/components/schemas/GeoJsonMultiLineString'
        properties:
          oneOf:
            - $ref: '#/components/schemas/AssetGeoProperties'
            - $ref: '#/components/schemas/AssetClusterProperties'
            - $ref: '#/components/schemas/AssetLineProperties'
          discriminator:
            propertyName: feature_kind
            mapping:
              asset: '#/components/schemas/AssetGeoProperties'
              asset_cluster: '#/components/schemas/AssetClusterProperties'
              asset_line: '#/components/schemas/AssetLineProperties'
    AssetGeoFeatureCollection:
      type: object
      description: >-
        RFC 7946 FeatureCollection of assets: point markers or clusters (≤ 500 markers before clustering) plus up to
        1,500 line features. Up to 2,000 features in total (docs/04 D-13).
      required: [type, features, totals]
      properties:
        type:
          type: string
          const: FeatureCollection
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        features:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/AssetGeoFeature'
        totals:
          type: object
          required: [records, clustered, asset_type_counts, technology_counts]
          properties:
            records:
              type: integer
              description: >-
                Points and lines matching the filters, over the whole match and **not** narrowed to
                `bbox` (the same contract `/v1/proposals/geo` uses: a record the viewport excludes,
                or one with no geometry at all, stays counted rather than dropping out the moment a
                caller pans). A client labelling "in view" counts the returned features instead,
                adding each cluster's `count`.
            clustered:
              type: boolean
              description: '`false` when every point record is an individual feature (≤ 500 visible). Lines never cluster.'
            asset_type_counts:
              type: object
              description: Over the whole filter match, points and lines alike.
              additionalProperties:
                type: integer
            technology_counts:
              type: object
              additionalProperties:
                type: integer
            line_count:
              type: integer
              minimum: 0
              description: Line assets intersecting the viewport, before the 1,500-feature cap.
            lines_shown:
              type: integer
              minimum: 0
              description: '`asset_line` features actually returned (longest first when capped).'
            line_tolerance_deg:
              type: number
              minimum: 0
              description: Douglas-Peucker tolerance in degrees applied to every line at this zoom; `0` at zoom ≥ 14.
    AssetGeoResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AssetGeoFeatureCollection'

    # ---------- Asset entity (list/detail, docs/21 §3.22-§3.23) ----------
