      summary: Merge another proposal into this one, with preview
      description: |
        `{public_id}` survives; `absorb_public_id` is absorbed. With `preview = true` the response shows the
        resulting canonical fields, moved sources, matches and documents without writing. A real merge writes one
        `merged` event whose `before.absorbed` holds the full absorbed row and every moved id (invariant M1), sets
        `merged_into_id` and `publish_state = unpublished` on the absorbed record and adds its slug to
        `slug_history` so old URLs `301` (docs/21 §6.3, US-201 AC3, US-202 AC2). `preview_token` from the preview
        must be sent with the write; a stale token (either record changed since) answers `409 conflict`.
