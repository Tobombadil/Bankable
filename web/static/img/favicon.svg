<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Inframation's mark (docs/31-brand-identity.md §5.1, B-3): the information sign, a
       circle with the i knocked out and the orange dot. Light: navy circle, white stem;
       dark: a #eef1f5 circle, a #0e0f11 stem. favicon.ico and apple-touch-icon.png draw
       the same shapes; web/og_card.py `favicon_svg` writes this file. -->
  <style>
    .disc { fill: #0b1023; }
    .stem { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #eef1f5; }
      .stem { fill: #0e0f11; }
    }
  </style>
  <circle class="disc" cx="8" cy="8" r="8"/>
  <rect class="stem" x="6.6" y="7.35" width="2.8" height="5.9" rx="0.5"/>
  <circle fill="#e68023" cx="8" cy="4.55" r="1.75"/>
</svg>
