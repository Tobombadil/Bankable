# Bankable — data source registry
# Machine-readable seed for the ingestion layer. One entry per source.
#
# Field guide
#   category : generation_queue | load_queue | permit | regulatory_docket | funding | procurement |
#              registry | planning | news | aggregator | social_channel
#   access   : api | bulk_file | html | js_app | pdf | rss | email | wsdl
#   reuse    : open (public domain / open licence) | attribution (open with credit) |
#              noncommercial (reuse granted for noncommercial purposes only — CC BY-NC, a state site's
#              "for noncommercial use" clause; publishable only while PLATFORM_POSTURE=noncommercial,
#              docs/26-platform-posture.md; the docs/13 §6 row must say `noncommercial` first) |
#              restricted (redistribution needs licence or consent) | unknown (terms not retrievable)
#   publication : raw_ok (rows render in full on public pages and in exports) |
#              derived_only (normalised fields, events and county/state placement only; raw row,
#              status_raw and exact coordinates withheld; link out) | none (nothing published).
#              Must be no more permissive than the docs/13-legal-data-rights.md §6 rule for the
#              source; scripts/check_manifest_licences.py enforces it (2026-09-18). restricted and
#              unknown sources are always `none`.
#   (there is no lag field: nothing this manifest declares is time-delayed on any tier. The ISO
#              change-event lag was removed on 2026-09-21 — owner, docs/00-PLAN.md decisions log —
#              along with its knob, because a dormant per-source delay an admin could switch back on
#              is the same defeatable promise. tests/test_publication_is_never_time_delayed.py fails
#              if a `change_event_lag_days` key reappears on any entry.)
#   tier     : 1 = MVP, 2 = second wave, 3 = later / opportunistic
#   effort   : S (<1 day connector) | M (1–3 days) | L (>3 days or needs agreements/browser automation)
#   verified : result of scripts/probe_sources.py on the date shown (see data/probes/)
#
# Reuse of US federal government works is public domain (17 U.S.C. §105). ISO/RTO and state sites are
# NOT federal works: each carries its own terms and is recorded individually below.

version: 2026-09-18
sources:

# ─────────────────────────────────────────────────────────────────────────────
# A. US GENERATION INTERCONNECTION QUEUES (supply side: what is being proposed)
# ─────────────────────────────────────────────────────────────────────────────
- id: us.iso.caiso.gen_queue
  name: CAISO Public Queue Report
  jurisdiction: US-CA
  category: generation_queue
  operator: California ISO
  url: https://www.caiso.com/PublishedDocuments/PublicQueueReport.xlsx
  access: bulk_file
  auth: none
  format: xlsx
  cadence: weekly
  license: 'CAISO Terms of Use (rev. 2025-05-14), retrieved 2026-09-12 — "No material or information from this Website ... may be copied, reproduced, republished ... except (i) as authorized in these Terms of Use"; and "may be used by you provided that you keep intact all copyright ... notices and that you credit the California ISO"'
  reuse: attribution
  publication: derived_only
  tier: 1
  effort: S
  connector: gridstatus.CAISO.get_interconnection_queue
  probe: {method: GET}
  verified: {date: 2026-09-12, result: ok, rows: 2278, note: 'connector run: 384,823 bytes, DQ pass; 3 sheets (queued/completed/withdrawn)'}
  notes: >-
    Public Records Act material; render credit "California ISO" on every derived record. API Terms bar using
    the API to monitor CAISO system availability or performance. Publish derived-only until counsel resolves
    the tension between the two clauses. See docs/13-legal-data-rights.md section 1.2.

- id: us.iso.ercot.gen_queue
  name: ERCOT GIS Report (Generator Interconnection Status)
  jurisdiction: US-TX
  category: generation_queue
  operator: ERCOT
  url: https://www.ercot.com/mp/data-products/data-product-details?id=PG7-200-ER
  access: api
  auth: none (public MIS document listing → xlsx download)
  format: xlsx
  cadence: monthly
  license: 'ERCOT Website User Agreement clause 5, retrieved 2026-09-12 — "raw data provided in public portions of this website may be used, reproduced, and redistributed in compilations, charts, and analyses without maintaining such notices"'
  reuse: open
  publication: raw_ok
  tier: 1
  effort: S
  connector: gridstatus.Ercot.get_interconnection_queue
  probe: {method: GET, url: "https://www.ercot.com/misapp/servlets/IceDocListJsonWS?reportTypeId=15933"}
  verified: {date: 2026-09-12, result: ok, rows: 1778, note: 'connector run: GIS_Report_August2026 via MIS doclookupId, 675,108 bytes, DQ pass'}
  notes: >-
    Most permissive ISO terms; raw-ok. Clause 6 bars use that degrades ERCOT systems (rate-limit). Clause 8
    bars using the ERCOT list server for marketing. ERCOT Public API (api.ercot.com) needs free registration
    (clickwrap); not required for the GIS report. See docs/13-legal-data-rights.md section 1.1.

- id: us.iso.ercot.large_load_queue
  name: ERCOT Large Load Interconnection Status Report
  jurisdiction: US-TX
  category: load_queue
  operator: ERCOT
  url: https://www.ercot.com/services/rq/large-load-integration
  access: api
  auth: none
  format: json (EMIL catalogue watch) / xlsx expected once the report is published
  cadence: monthly
  license: 'ERCOT Website User Agreement clause 5, retrieved 2026-09-12 — raw public data "may be used, reproduced, and redistributed in compilations, charts, and analyses"'
  reuse: open
  publication: raw_ok
  tier: 1
  effort: S
  probe: {method: GET}
  verified: {date: 2026-09-12, result: not_published, rows: 0, note: 'registry id NP3-990-CD does not exist (EMIL answers Product Not Found); no large-load status report in the 5,837-product EMIL catalogue or the 184 public MIS report types; NPRR1267 section 3.2.7 (PUCT-approved 2025-07-31) requires a monthly report but what is published is a PDF slide deck to TAC/LLWG, per-project status going to TSPs only pending the Large Load Portal. Connector watches the EMIL catalogue and emits a change event when the product appears.'}
  notes: >-
    The single most newsworthy queue in the country right now. Batch Zero process approved by PUCT June 2026.
    Same clause-5 permission as the GIS report; raw-ok. The product id NP3-990-CD recorded here in Phase 0 was
    wrong: it resolves to "Product Not Found" and NP3-990-EX is the 60-Day SASM Disclosure report. Verified
    2026-09-12 against the full public EMIL catalogue (api/1/services/read/common/all-emil-items-search.json,
    5,837 products), the public MIS report-type list (IceRepListJsonWS, 184 types) and the GIS Report document
    list: no machine-readable large-load register exists yet. NPRR1267 adds Nodal Protocol 3.2.7, "ERCOT must
    publish a Large Load Interconnection status report each month to the ERCOT website" with aggregation across
    location, Load Zone, TSP, load type, request date, energisation date and size range; today that obligation is
    met by a monthly PDF slide deck to TAC and the Large Load Working Group, and ERCOT's April 2026 board update
    says per-project status reports go to TSPs only, ahead of a Large Load Portal "currently in development".
    The connector therefore watches the EMIL catalogue for the product and emits a change event when it appears;
    the row parser is written then, against the real file.

