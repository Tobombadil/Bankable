- id: us.iso.pjm.gen_queue
  name: PJM New Services Queue (Queue Point / Data Miner)
  jurisdiction: US-PJM
  category: generation_queue
  operator: PJM Interconnection
  url: https://apiportal.pjm.com/
  access: api
  auth: api_key (free PJM Tools account)
  format: json
  cadence: daily
  license: 'Three documents retrieved 2026-09-12. Data Miner 2 Terms of Use PDF — "Members may republish data, however non-members are specifically prohibited from republishing data". apiportal.pjm.com — "for internal use only and redistribution ... is strictly prohibited without an effective PJM-issued Redistribution License". pjm.com Legal & Privacy (governs planning pages) — reserves rights, contains no redistribution clause'
  reuse: restricted
  tier: 1
  effort: M
  connector: gridstatus.PJM.get_interconnection_queue (PJM_API_KEY)
  probe: {method: GET, url: "https://api.pjm.com/api/v1/"}
  verified: {date: 2026-09-12, result: needs_key, note: "401 without key; gridstatus raised 'api_key must be provided'"}
  notes: >-
    Data Miner 2 / API portal are restricted; non-members 6 connections/min; Pennsylvania law, Montgomery
    County forum; clause 9 indemnity extends to customer use of derivatives. The New Services Queue on pjm.com
    planning pages (serial-service-request-status) links only to the site-wide Legal & Privacy notice, which
    has no redistribution prohibition — counsel question 1 in docs/13-legal-data-rights.md section 7. Until
    answered: link-out-only, and do not accept the Data Miner ToU for the queue connector.

