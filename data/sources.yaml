    not a blocker. The connector (pipeline/connectors/us_tx_rrc_class_vi, built 2026-09-25) is otherwise
    unchanged: no code was touched by this reclassification. No RRC document is kept in the repository by
    choice, not by prohibition: the sha256s in `verified` are the evidence of what was measured, the parser is pinned on
    synthetic cell arrays, and a developer-local copy under the gitignored tests/fixtures/local/ drives the
    one end-to-end test.
    Identity is the RRC's own tracking number (stable across the three releases, survived an operator
    rename). The PDF's document metadata names its RRC author; the connector never reads metadata. The
    best of the six primacy states by a distance: a genuine machine-readable table, an application-level
    status vocabulary with the RRC's own legend, a well count and an injection interval per application.

    COPYING CONDITIONS, re-read 2026-10-22 (legal-compliance lane; Site Policies HTTP 200, 68,255 bytes, the
    capture behind docs/39 §7.3). The Site Policies, verbatim: "Entities or individuals who copy information
    from the RRC website or link to the RRC website must follow Sections 3 and 5 of The State Website Linking
    and Privacy Policy entitled, “Linking to State Agency Websites” and “Copying Information from State
    Agency Websites,” respectively." And: "Because of the harm to State computer systems, including, but not
    limited to, the partial or total alteration or damage to data, or the interruption of computer services
    to other users, the RRC does not consent to access to its computer system by “robots,” denial of service
    attacks, or any other automated process that results in severe degradation of system performance." The
    state policy itself: DIR's page
    (https://dir.texas.gov/resource-library-item/state-website-linking-and-privacy-policy) answered a 403
    challenge page ("Just a moment...") on 2026-10-22, at about 18:24 UTC (docs/39 §7.3) and once more at
    18:49 UTC, and was not retried further or bypassed. The text used is a state agency's reproduction, the
    Texas Board of Architectural Examiners (https://www.tbae.texas.gov/links-privacy-policy/, read
    2026-10-22), where the paragraph is headed "Copying and Use of Information by Web Site Owners Linking to
    State Agency Sites" and is unnumbered, so it is secondary until read on DIR's site: "Use of the
    information must identify the state agency that is the source of the information, its Web address, the
    date the information was copied from the state agency’s Web site by the site owner and must be
    accompanied by a statement that neither the site owner nor the information, as it is presented on the
    site owner’s Web site, is endorsed by the State or any state agency." And: "To protect the intellectual
    property of state agencies, copied information must reflect the copyright, trademark, service mark or
    other intellectual property rights of the state agency whose protected information is being used by the
    site owner." HOW THIS ROW MEETS THEM (2026-10-22): agency and web address in `attribution`, the
    no-endorsement statement in `notice`, both rendered with the credit on every surface (record pages,
    API `attribution_text`, feeds, alerts, /attribution, /legal/reuse; a `noncommercial` row is never in a bulk
    or CSV export); the date copied is each record's
    `retrieved_at` (the record page prints "Retrieved <date>" after the credit; the API carries
    `retrieved_at` beside `attribution_text`). Until then the live Class VI records carried only "Source:
    Railroad Commission of Texas", with no web address and no statement. `license` is left as read on
    2026-09-25 because the licence_id is a digest of that field and the terms did not change; changing it
    would leave the events already loaded under the old licence row, whose credit a refresh does not reach.
    INFERENCE (not legal advice): the robots sentence is conditional on "severe degradation of system
    performance", and a weekly read at 0.5 rps is well outside it. The intellectual-property sentence binds
    "protected information"; the records carry facts (operator, project, county, status, dates) and link to
    the RRC's own PDF unaltered, so no RRC copyright line is rendered. Counsel to confirm both, and which of
    the RRC's noncommercial grant and the state paragraph (which has no noncommercial limit) governs
    (docs/39 §7.6 item 4); the class stays `noncommercial`.

