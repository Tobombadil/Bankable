  access: bulk_file
  auth: none
  format: csv in zip (one row per TARGET business day since 1999-01-04, units per euro, N/A where not quoted)
  cadence: daily
  license: 'ECB "Disclaimer & Copyright" (https://www.ecb.europa.eu/services/using-our-site/disclaimer/html/index.en.html), read 2026-10-22 — "Subject to the exception below, users of this website may make free use of the information obtained directly from it subject to the following conditions: When such information is distributed or reproduced, it must appear accurately and the ECB must be cited as the source. Where the information is incorporated in documents that are sold (regardless of the medium), the natural or legal person publishing the information must inform buyers, both before they pay any subscription or fee and each time they access the information taken from this website, that the information may be obtained free of charge through this website. If the information is modified by the user (e.g. by seasonal adjustment of statistical data or calculation of growth rates) this must be stated explicitly." The rates page (https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html), same day: "The reference rates are published for information purposes only. Using the rates for transaction purposes is strongly discouraged."'
  reuse: attribution
  publication: raw_ok
  attribution: "Source: European Central Bank, euro foreign exchange reference rates"
  changes_statement: "USD equivalents are calculated by Inframation from the ECB's euro reference rates (US dollars per euro divided by the currency's units per euro, on one fixing date); they are approximate and are not published by the ECB"
  licence_url: "https://www.ecb.europa.eu/services/using-our-site/disclaimer/html/index.en.html"
  tier: 1
  effort: S
  probe: {method: GET, url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"}
  verified: {date: 2026-10-22, result: ok, rows: 7119, note: 'GET eurofxref-hist.zip, HTTP 200, 641,589 bytes (sha256 93bac351...3eda), Last-Modified Wed, 21 Oct 2026 13:56:26 GMT; 7,119 fixings from 1999-01-04 to 2026-10-21; vendored from 2025-01-01 as data/vendored/fx/eurofxref-hist-from-2025.csv'}
  notes: >-
    Rates are units per euro; the USD rate of a currency is our cross rate, stated as a change
    (changes_statement). Of the store's notice currencies, every one but MKD is quoted (2026-10-22):
    an MKD notice has no USD equivalent and nothing is substituted. A sold product must also tell
    buyers the rates are free from the ECB's website (license quote); no tier is sold today
    (docs/26). robots.txt (read 2026-10-22) allows /stats/eurofxref/ and sets Crawl-delay 5, that is
    1 request per 5 s; the daily refresh is one conditional GET, run by the scheduler's value_tick
    at 16:19 UTC (infra/scheduler/app.py; by hand, python -m pipeline.fx refresh).

