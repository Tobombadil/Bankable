- id: us.lbnl.queued_up
  name: LBNL "Queued Up" project-level interconnection queue data file (non-ISO regions)
  jurisdiction: US
  # 2026-10-23: was `aggregator`. Berkeley Lab is a national laboratory publishing its own compilation under
  # CC BY 4.0, not a private aggregator; the connector reads only Berkeley Lab's file from Berkeley Lab's host.
  category: generation_queue
  operator: Lawrence Berkeley National Laboratory, in collaboration with GridTracker
  url: https://eta-publications.lbl.gov/publications/queued-2026-edition-characteristics
  access: bulk_file
  auth: none (emp.lbl.gov answers non-browser clients with a Cloudflare block page and is never fetched; the publication page and the file on eta-publications.lbl.gov answer 200)
  format: xlsx
  cadence: annual (data through 2025 published May 2026)
  # Once the hold is lifted, a new edition is noticed within a month of its release: the run is then `blocked`
  # until a reviewer records the new edition's licence (pipeline/connectors/us_lbnl_queued_up, KNOWN_EDITION).
  poll: monthly
  # release_month: https://eta-publications.lbl.gov/publications/queued-2026-edition-characteristics "Date Published 05/2026" (read 2026-10-23); the data file answered Last-Modified Thu, 07 May 2026 18:07:07 GMT
  release_month: 5
  license: 'Publication page https://eta-publications.lbl.gov/publications/queued-2026-edition-characteristics, retrieved 2026-10-23 (HTTP 200) — "Copyright Notice: The Queued Up data file is licensed CC BY 4.0. You may use, share, or adapt the dataset as long as you attribute it to Lawrence Berkeley National Laboratory and GridTracker." and "Queued Up Data File. Copyright (c) 2026, The Regents of the University of California, through Lawrence Berkeley National Laboratory (subject to receipt of any required approvals from the U.S. Dept. of Energy) & GridTracker. CC BY 4.0. All rights reserved." The file''s Introduction sheet adds the DOE contract notice ("This dataset has been authored by an author at Lawrence Berkeley National Laboratory under Contract No. DE-AC02-05CH11231 with the U.S. Department of Energy ...") and the standard no-warranty disclaimer'
  # 2026-10-23 review round: held. LBNL's own licence is CC BY 4.0 (the register class, docs/13 §6), but the rows
  # kept are the non-ISO utilities' OASIS queues, whose terms are unread (us.oasis.non_iso_queues: unknown, none),
  # and a compiler's licence cannot clear an operator's terms, so the class recorded here is the rows' own:
  # `unknown`. The registry refuses scheduled runs (a person may run it into the quarantine store with
  # --allow-restricted), the loader refuses every row, and the coverage page lists it as withheld. Most pending
  # rows also cannot be matched to EIA-860M's planned units by the resolver (notes). Lifting either is an owner
  # decision (docs/13 §2.1); `attribution` / `raw_ok` is the ceiling LBNL's licence allows.
  reuse: unknown
  publication: none
  attribution: "Lawrence Berkeley National Laboratory and GridTracker, Queued Up data file (2026 edition), CC BY 4.0"
  licence_url: "https://creativecommons.org/licenses/by/4.0/"
  changes_statement: "Modified by Inframation: non-ISO regions only; statuses and technologies mapped to Inframation's vocabulary."
  notice: "Queued Up Data File. Copyright (c) 2026, The Regents of the University of California, through Lawrence Berkeley National Laboratory (subject to receipt of any required approvals from the U.S. Dept. of Energy) & GridTracker."
  tier: 1
  effort: S
  connector: pipeline/connectors/us_lbnl_queued_up (2026-10-23, lane national-queues)
  probe: {method: GET}
  verified: {date: 2026-10-23, result: ok, rows: 12401, note: 'Review round (lane national-queues, 2026-10-23), the fixed connector re-run over that run''s stored file (no new fetch): 12,431 rows kept, 30 of TVA''s and Duke Energy Florida''s twice-listed positions collapsed to their located row (12,401 records; Duke Energy Florida''s position 2, listed at 1,701 MW and at 701 MW, stays two suffixed records, DQ warn); 7 developers read as natural persons removed; placeholder developers ("N/A" 863, "Masked" 203, "Third Party" 28) and 2 placeholder project names read as no name. Lifecycle: withdrawn 8,015, studied 1,699, built 1,462, filed 576, contracted 567, under construction 72, unknown 10 (LBNL''s own `unknown`, now unmapped whatever its phase); 2,914 pending requests hold 621.5 GW, 120 of them with a project name and 526 with a developer. Not loaded: held, reuse unknown and publication none (notes). First run: connector run cc9b1dac 2026-10-23T16:55:42Z (lane national-queues): queued-2027-edition-characteristics 404, queued-2026-edition-characteristics 200 with both licence sentences, then sites/default/files/2026-05/lbnl_ix_queue_data_file_thru2025.xlsx 200, 15,571,236 bytes, sha256 794582d3...08b6, ETag "69fcd4cb-ed9924", Last-Modified Thu, 07 May 2026 18:07:07 GMT; 3 requests. Sheet 03. Complete Queue Data 38,201 rows: West 8,097 and Southeast 4,334 kept (12,431); ERCOT 3,757, CAISO 2,868, NYISO 1,936 dropped (read first-hand); PJM 7,666, MISO 5,424, SPP 2,837, ISO-NE 1,282 dropped (withheld). Lifecycle (status map as committed, re-parse 9a1d1006): withdrawn 8,015, studied 1,699, built 1,492, filed 576, contracted 570, under construction 72, unknown 7 (LBNL''s own unknown, unmapped); 2,917 pending requests (filed to under construction) hold 621.5 GW. (That run''s note that nameless rows "list under their queue position" was wrong: the loader names a proposal after its developer first, and 2,790 rows would have been named after a developer string, 1,094 of them after a placeholder now read as no name.)'}
  notes: >-
    The national queue compilation of the 7 ISOs/RTOs and 50 non-ISO balancing areas (~98 % of US installed
    capacity), one edition a year. Only its non-ISO rows are kept (LBNL region West or Southeast: TVA, Southern,
    Duke, FPL, PacifiCorp, BPA, APS, NV Energy, Xcel Colorado and 40 more transmission providers), the queues no
    other connector reads. ERCOT, CAISO and NYISO rows are dropped because those queues are read first-hand;
    PJM rows are dropped because PJM rows are not public until a licence exists (CLAUDE.md); MISO, SPP and
    ISO-NE rows are dropped because their operators' recorded status (unknown, restricted, restricted) withholds
    them and a compiler's CC BY notice cannot license what the operator's terms withhold. Dropped rows are never
    stored as records; the snapshot meta counts them. GridTracker, LBNL's collaborator and co-licensor, is the
    company behind Interconnection.fyi (the file's Introduction sheet names two Interconnection.fyi authors);
    Interconnection.fyi itself is never fetched (us.gridtracker.interconnection_fyi). Every run (scheduled once
    the hold is lifted; until then only a person's quarantine run) re-reads the reviewed edition's publication page and is `blocked` if its Notes block (licence statement, copyright line
    and their links) differs in any way from the one read on 2026-10-23, or if a later edition's page answers:
    a new edition is published only after a reviewer records its licence here. Held at reuse unknown and
    publication none (review round, 2026-10-23) for two reasons. (1) Terms: the West and Southeast rows restate the OASIS queues of TVA,
    Southern, Duke, PacifiCorp, BPA and the other non-ISO transmission providers, recorded here as
    us.oasis.non_iso_queues with terms unread; the rule applied to MISO's rows (a compiler's CC BY cannot license
    what the operator's terms withhold) applies to them as well until the owner decides otherwise, for instance
    on the ground that those postings are required by FERC Order 2003/2023 rather than published under terms of
    their own. (2) Double counting: 2,794 of the 2,914 pending requests have no project name and 2,388 no
    developer, so the resolver's evidence against an EIA-860M unit is county, capacity and COD at most (0.35,
    below MIN_EVIDENCE 0.50) and the pair is never eligible. Measured on the 2026-10-23 EIA-860M frame: of 529
    planned EIA units in non-ISO balancing areas in these states, 247 have a pending LBNL request in the same
    county with a compatible technology within 10 % of its MW (861 pairs, 616 of them below the evidence floor);
    within 5 % there are 62 one-to-one pairs and 51 of them can never match (e.g. EIA "Hammond" storage, Floyd
    County GA, 57.5 MW and SOCO IC-1267, 57.5 MW, no name or developer). A bridge in the resolver for a nameless
    queue row with a unique same-county, same-family counterpart within 5 % MW (review-only) is the precondition
    for publishing pending rows. Not SPP rows: WAPA-IS (273 rows; in the SPP RTO since October 2015, every
    queue_date on or before 2015) and the April 2026 SPP RTO-West joiners (TSGT 104, WAPA-RM 110, PRPA 62, CSU 8,
    BHCT 51 rows), whose queues moved into SPP's process after LBNL's end-2025 snapshot; LBNL places all of them
    in its West region and their rows predate the move, so they are the utilities' own queues, held with the
    rest. See docs/13-legal-data-rights.md section 2.1.

