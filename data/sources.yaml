  auth: none
  format: biweekly text PDF (e.g. https://epd.georgia.gov/document/document/pa1225-3/download, 3 pages, one block per application)
  cadence: biweekly
  license: 'NOT RETRIEVED — no reuse clause found. epd.georgia.gov links only accessibility and privacy pages; https://georgia.gov/privacy-and-security (read 2026-09-28) covers submitted information and the Georgia Open Records Act, not reuse of published content.'
  reuse: unknown
  publication: none
  tier: 2
  effort: M
  probe: {method: GET}
  verified: {date: 2026-09-28, result: ok, note: 'pa1225-3 PDF 200, 101,871 bytes, text layer present (County / Facility Name / Application No / Facility Address / Description of Operation / Reason for Application); one data-centre application in that issue; epd.georgia.gov robots.txt allows /document/.'}
