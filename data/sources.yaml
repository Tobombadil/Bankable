# Bankable — data source registry
# Machine-readable seed for the ingestion layer. One entry per source.
#
# Field guide
#   category : generation_queue | load_queue | permit | regulatory_docket | funding | procurement |
#              registry | planning | news | aggregator | social_channel | market_price (wholesale,
#              retail and contract prices; context data, never proposals; docs/29, 2026-10-22)
#   access   : api | bulk_file | html | js_app | pdf | rss | email | wsdl
#   reuse    : open (public domain / open licence) | attribution (open with credit) |
#              noncommercial (reuse granted for noncommercial purposes only — CC BY-NC, a state site's
#              "for noncommercial use" clause; publishable only while PLATFORM_POSTURE=noncommercial,
#              docs/26-platform-posture.md; the docs/13 §6 row must say `noncommercial` first) |
#              restricted (redistribution needs licence or consent) | unknown (terms not retrievable)
#   publication : raw_ok (rows render in full on public pages and in exports) |
#              derived_only (normalised fields, events and county/state placement only; raw row,
#              status_raw and exact coordinates withheld; link out) | none (nothing published).
#              Must be no more permissive than the docs/13-legal-data-rights.md §6 rule for the
#              source; scripts/check_manifest_licences.py enforces it (2026-09-18). restricted and
#              unknown sources are always `none`.
#   notice   : optional, a statement the source's terms require on every copy (a copyright notice, a
#              no-endorsement statement), verbatim. Rendered after `attribution` and any
#              `changes_statement` wherever the credit is (pipeline/connectors/registry.py
#              `credit_text`). The docs/13 §6 rule names it first as `notice "..."`; R5 of
#              scripts/check_manifest_licences.py requires the two to match exactly (2026-10-22,
#              docs/13 §6.4).
#   (there is no lag field: nothing this manifest declares is time-delayed on any tier. The ISO
#              change-event lag was removed on 2026-09-21 — owner, docs/00-PLAN.md decisions log —
#              along with its knob, because a dormant per-source delay an admin could switch back on
#              is the same defeatable promise. tests/test_publication_is_never_time_delayed.py fails
#              if a `change_event_lag_days` key reappears on any entry.)
#   tier     : 1 = MVP, 2 = second wave, 3 = later / opportunistic
#   effort   : S (<1 day connector) | M (1–3 days) | L (>3 days or needs agreements/browser automation)
#   verified : result of scripts/probe_sources.py on the date shown (see data/probes/)
#   poll     : optional, how often the scheduler asks the source when that should differ from `cadence`
#              (how often the source changes). Any cadence keyword (hourly, daily, weekly, ...);
#              infra/scheduler/cadence.py `poll_cadence` buckets it and infra/scheduler/freshness.py
#              measures staleness against it (2026-10-07).
#   dq_thresholds : optional mapping overriding pipeline/connectors/dq.py DEFAULT_THRESHOLDS for one
#              source (row_drift_hold_pct, null_spike_hold_pp, ...); the runner passes it to the gates.
#   release_month : optional, 1–12, only on sources whose cadence falls in the scheduler's annual bucket:
#              the month the source publishes its annual data, with the page that says so cited in a
#              comment above it. The scheduler runs the source on the 2nd of the *following* month
#              (infra/scheduler/cadence.py `annual_run_month`); without the field an annual source
#              runs in January, as before 2026-09-27. infra/scheduler/test_cadence.py validates it.
#   status   : optional; `pending` = terms read and recorded, nothing built: no connector, so the
#              registry lists the source as unimplemented and nothing is fetched, stored or published
#              until the coordinator clears the row and a lane builds it (docs/29, 2026-10-22).
#              `reuse` and `publication` on a pending row record the ceiling the terms allow, not a
#              promise to publish; a row withheld by its terms is `none` as usual. `excluded` = recorded
#              so the source is never picked up, first- or second-hand (paid exchange data, private
#              PPA indices, re-hosts); nothing is planned for it.
#
# Reuse of US federal government works is public domain (17 U.S.C. §105). ISO/RTO and state sites are
# NOT federal works: each carries its own terms and is recorded individually below.

version: 2026-09-18
sources:

# ─────────────────────────────────────────────────────────────────────────────
# A. US GENERATION INTERCONNECTION QUEUES (supply side: what is being proposed)
# ─────────────────────────────────────────────────────────────────────────────
- id: us.iso.caiso.gen_queue
  name: CAISO Public Queue Report
  jurisdiction: US-CA
  category: generation_queue
  operator: California ISO
  url: https://www.caiso.com/PublishedDocuments/PublicQueueReport.xlsx
  access: bulk_file
  auth: none
  format: xlsx
  cadence: weekly
  license: 'CAISO Terms of Use (rev. 2025-05-14), retrieved 2026-09-12 — "No material or information from this Website ... may be copied, reproduced, republished ... except (i) as authorized in these Terms of Use"; and "may be used by you provided that you keep intact all copyright ... notices and that you credit the California ISO"'
  reuse: attribution
  publication: derived_only
  attribution: "Source: California ISO"
  licence_url: "https://www.caiso.com/privacy-terms-of-use"
  tier: 1
  effort: S
  connector: pipeline.vendor.gridstatus.queues.caiso_queue (vendored from gridstatus 0.36.0, 2026-10-07)
  probe: {method: GET}
  verified: {date: 2026-09-12, result: ok, rows: 2278, note: 'connector run: 384,823 bytes, DQ pass; 3 sheets (queued/completed/withdrawn)'}
  notes: >-
    Public Records Act material; render credit "California ISO" on every derived record. API Terms bar using
    the API to monitor CAISO system availability or performance. Publish derived-only until counsel resolves
    the tension between the two clauses. See docs/13-legal-data-rights.md section 1.2.

- id: us.iso.ercot.gen_queue
  name: ERCOT GIS Report (Generator Interconnection Status)
  jurisdiction: US-TX
  category: generation_queue
  operator: ERCOT
  url: https://www.ercot.com/mp/data-products/data-product-details?id=PG7-200-ER
  access: api
  auth: none (public MIS document listing → xlsx download)
  format: xlsx
  cadence: monthly
  # Published on the 1st at about 21:00 UTC (GIS_Report_September2026: 2026-10-01T16:08:28-05:00),
  # after the monthly tick at 05:21 UTC; polled daily so a release is fetched the next morning.
  poll: daily
  license: 'ERCOT Website User Agreement clause 5, retrieved 2026-09-12 — "raw data provided in public portions of this website may be used, reproduced, and redistributed in compilations, charts, and analyses without maintaining such notices"'
  reuse: open
  publication: raw_ok
  tier: 1
  effort: S
  connector: pipeline.vendor.gridstatus.queues.ercot_queue (vendored from gridstatus 0.36.0, 2026-10-07)
  probe: {method: GET, url: "https://www.ercot.com/misapp/servlets/IceDocListJsonWS?reportTypeId=15933"}
  verified: {date: 2026-09-12, result: ok, rows: 1778, note: 'connector run: GIS_Report_August2026 via MIS doclookupId, 675,108 bytes, DQ pass'}
  notes: >-
    Most permissive ISO terms; raw-ok. Clause 6 bars use that degrades ERCOT systems (rate-limit). Clause 8
    bars using the ERCOT list server for marketing. ERCOT Public API (api.ercot.com) needs free registration
    (clickwrap); not required for the GIS report. See docs/13-legal-data-rights.md section 1.1.

- id: us.iso.ercot.large_load_queue
  name: ERCOT Large Load Interconnection Status Report
  jurisdiction: US-TX
  category: load_queue
  operator: ERCOT
  url: https://www.ercot.com/services/rq/large-load-integration
  access: api
  auth: none
  format: json (EMIL catalogue watch) / xlsx expected once the report is published
  cadence: monthly
  license: 'ERCOT Website User Agreement clause 5, retrieved 2026-09-12 — raw public data "may be used, reproduced, and redistributed in compilations, charts, and analyses"'
  reuse: open
  publication: raw_ok
  tier: 1
  effort: S
  probe: {method: GET}
  verified: {date: 2026-10-07, result: not_published, rows: 0, note: 'Rechecked 2026-10-07 (lane L11): the large-load integration page lists forms, Batch Zero and RFI material and no status report; the September 2026 LLWG meeting page lists no status report; the queue appears only as system-wide charts in PDF decks (e.g. March 2026 TAC report p.3, MW by study status: observed energized, approved to energize, planning studies approved, under ERCOT review, no studies submitted), with no county, zone table or project rows. The EMIL catalogue API (filter-emil-items-search.json) answered HTTP 403 with an Incapsula bot challenge to one GET from this environment, so the catalogue itself was not re-read and the connector''s next run from this host is expected to fail. 2026-09-12: registry id NP3-990-CD does not exist (EMIL answers Product Not Found); no large-load status report in the 5,837-product EMIL catalogue or the 184 public MIS report types; NPRR1267 section 3.2.7 (PUCT-approved 2025-07-31) requires a monthly report but what is published is a PDF slide deck to TAC/LLWG, per-project status going to TSPs only pending the Large Load Portal. Connector watches the EMIL catalogue and emits a change event when the product appears.'}
  notes: >-
    The single most newsworthy queue in the country right now. Batch Zero process approved by PUCT June 2026.
    Same clause-5 permission as the GIS report; raw-ok. The product id NP3-990-CD recorded here in Phase 0 was
    wrong: it resolves to "Product Not Found" and NP3-990-EX is the 60-Day SASM Disclosure report. Verified
    2026-09-12 against the full public EMIL catalogue (api/1/services/read/common/all-emil-items-search.json,
    5,837 products), the public MIS report-type list (IceRepListJsonWS, 184 types) and the GIS Report document
    list: no machine-readable large-load register exists yet. NPRR1267 adds Nodal Protocol 3.2.7, "ERCOT must
    publish a Large Load Interconnection status report each month to the ERCOT website" with aggregation across
    location, Load Zone, TSP, load type, request date, energisation date and size range; today that obligation is
    met by a monthly PDF slide deck to TAC and the Large Load Working Group, and ERCOT's April 2026 board update
    says per-project status reports go to TSPs only, ahead of a Large Load Portal "currently in development".
    The connector therefore watches the EMIL catalogue for the product and emits a change event when it appears;
    the row parser is written then, against the real file. Its rows are catalogue products, not projects, so
    the loader never writes them as proposals (services/ingest/large_load_watch.py, 2026-10-07; docs/25 §3.10):
    before that, a product appearing would have been published as a `load` project named after the report.

# Data-centre demand signals (2026-09-28, owner decision "track data-centre demand from public filings";
# survey and ranking in docs/25 §3). A data centre's backup generators need a state air permit that is filed
# before construction, so state air-permit registers are the earliest machine-readable public trace of one.
- id: us.va.deq.data_center_air_sites
  name: Virginia DEQ Air Sites (Daily) — sites DEQ flags as data centres
  jurisdiction: US-VA
  category: permit
  operator: Virginia Department of Environmental Quality
  url: https://gisdata.deq.virginia.gov/arcgis/rest/services/public/EDMA/MapServer/294
  access: api
  auth: none (public ArcGIS MapServer query endpoint, listed by the DEQ Environmental Data Hub)
  format: json (ArcGIS REST query, WGS84 points)
  cadence: daily
  rate_limit_rps: 0.5
  license: >-
    Virginia DEQ Data and Web GIS Tools Terms of Use, https://geohub-vadeq.hub.arcgis.com/pages/terms-of-use
    (page item 9789d10afd864dcbbd08baaddfd44802, read 2026-09-28; the map service's own description says "By
    viewing and using this data for any purpose, you agree to DEQ's Terms of Use" and links it): "GIS
    information is in the public domain and may be copied without permission; citation of the source is
    suggested." Conditions in the same text: "You shall not and will not attempt to derive any personal
    information from any Open Dataset or by combining any data from it with data from any other source";
    no use that could "damage, disable, overburden, or impair" the hub; no obtaining information "through any
    means not intentionally made available"; data "as is", "for reference purposes only".
  reuse: open
  publication: raw_ok
  attribution: "Source: Virginia Department of Environmental Quality"
  tier: 1
  effort: S
  probe: {method: GET, url: "https://gisdata.deq.virginia.gov/arcgis/rest/services/public/EDMA/MapServer/294?f=json"}
  verified:
    date: 2026-09-28
    result: ok
    rows: 205
    note: >-
      Connector run 0c7b5ae1 (python -m pipeline.connectors run, scratch data root): one query page, HTTP 200,
      288,467 bytes, sha256 43aba64f0c1476437b3f797fa9d864ebdab82d00622e2e75d9f8db87e90b9c22, DQ pass (no
      unmapped status, no duplicate id, provenance on every row). Layer total 4,043 air sites; 198 carry DEQ's
      data-centre flag and 7 more name a data centre as principal product. AIR_OP_STATUS Operating 158,
      Planned 45, Under Construction 1, Temporarily Shutdown 1 -> built 159, filed 45, under_construction 1.
      Every row has a DEQ point (205 exact; 180 at 6 decimals, 19 at 5, 6 at 4) and a derived county (Loudoun
      87, Fairfax 32, Prince William 32, Mecklenburg 10, Henrico 8; spelled "Loudoun County" until 2026-10-07, now
      the bare name ICIS-Air and EIA-860M use, docs/25 §3.10); derived county agrees with EPA ICIS-Air's
      county on 157 of the 160 rows that join on PLA_ICIS_ID (the 3 others sit on the Manassas city /
      Prince William line). Loaded through services/ingest/loader.py into a scratch SQLite store: 205 load
      proposals, publish_state public, location precision exact.
  notes: >-
    Credit "Virginia Department of Environmental Quality" on every record (suggested by the terms, rendered as
    policy). Northern Virginia is the largest data-centre market in the world and DEQ is the only US air
    agency found that flags data centres itself: layer 294 carries `PLA_DATA_CENTER_YN` on all 4,043 air
    sites. The connector keeps the flagged rows plus the few whose DEQ principal product names a data centre;
    Planned rows are data centres before construction. Politeness: one query page per run (under 1,000 rows),
    0.5 rps. robots.txt on gisdata.deq.virginia.gov answers 404 (no rule); apps.deq.virginia.gov, which
    serves the same map service, answers `Disallow: /` and is not used. The DEQ web page "Issued Air Permits
    for Data Centers" (www.deq.virginia.gov/news-info/shortcuts/permits/air/issued-air-permits-for-data-centers)
    answered an Akamai 403 to this environment on 2026-09-28 and is not used. Personal data: the sibling
    "Planned Air Sites" layer (298) carries DEQ staff user names and is not queried; the connector's
    `redact` strips such columns if they ever appear on layer 294. The per-row `Data_Disclaimer` paragraph is
    dropped at parse: "In collaboration with various agencies and organizations, DEQ strives to deliver
    accurate, useful, and up-to-date information. ... By accessing DEQ data, you agree to the terms and
    conditions outlined above."

- id: us.epa.echo.icis_air
  name: EPA ECHO ICIS-Air national facility download (data-centre selection, placed through FRS)
  jurisdiction: US
  category: permit
  operator: US EPA Office of Enforcement and Compliance Assurance (ECHO)
  url: https://echo.epa.gov/files/echodownloads/ICIS-AIR_downloads.zip
  access: bulk_file
  auth: none
  format: >-
    zip of CSVs; the connector reads only ICIS-AIR_FACILITIES.csv (19 columns, 280,208 rows) by HTTP range
    (central directory, then the one member), and joins ECHO_EXPORTER.csv from
    https://echo.epa.gov/files/echodownloads/echo_exporter.zip (443,452,854 bytes, 3,221,273 facilities) on
    REGISTRY_ID for the FRS coordinate, collection method and accuracy
  cadence: weekly
  rate_limit_rps: 0.1
  license: US federal work — public domain, 17 U.S.C. §105 (docs/13 §2.12 EPA hedge applies)
  reuse: open
  publication: raw_ok
  tier: 2
  effort: M
  probe: {method: HEAD}
  verified:
    date: 2026-10-07
    result: ok
    rows: 521
    note: >-
      Connector run 8281d666 2026-10-07T10:35:58Z (python -m pipeline.connectors run us.epa.echo.icis_air, canonical
      data root, its first run there): 4 requests to echo.epa.gov, 75.5 s, stored snapshot 260,136 bytes, sha256
      c65ff2cbfd52f292a03b908c822e00850faa6725e81f3ff03a49c2f6e674b85d, DQ pass (no unmapped status, no duplicate id,
      provenance on every row). ICIS zip 69,793,380 bytes, Last-Modified 2026-10-04, read by range (10,639,818 bytes;
      facilities member 63,277,549 bytes uncompressed, 280,271 rows); Exporter zip 444,227,767 bytes in full,
      Last-Modified 2026-10-04, 3,224,627 facilities. 639 candidates -> 521 data-centre facilities (514 on 2026-09-29).
      Placement exact 379; not passed on: method not site-specific 122, no FRS record 12, accuracy not stated or
      coarse 7, point outside the stated state 1. Both validators (ETag, Last-Modified) are recorded, so the next run
      asks conditionally. 2026-09-29 (lane run, scratch root): 514 rows, 138 Virginia facilities in both sources,
      each on exactly one proposal after resolution.
  notes: >-
    The national second source for data-centre air sites (docs/25 §3.7). Selection (connector docstring):
    not Permanently Closed and a data-centre name, or NAICS 518210 without an extraction co-code or a
    non-data-centre name, or NAICS 541513/541519 with a named data-centre operator. Hand-checked precision
    63 of 73 distinct sampled rows judged data centres, 5 uncertain, 5 offices (all NAICS 518210 basis); recall
    against Virginia DEQ's own flag 138 of the 160 DEQ data centres present in ICIS-Air (45 more DEQ
    Planned sites are not in ICIS-Air at all). Thin before construction and blind wherever a state does not
    report minor sources (Texas: 12 facilities; permit-by-rule engines have no registration). Coordinates:
    only FRS points with a site-specific collection method, a stated accuracy of at most 200 m and a point
    inside the stated state become exact; ZIP-centroid and other coarse FRS points are never passed on.
    `PGM_SYS_ID` equals Virginia DEQ's `PLA_ICIS_ID`; both connectors emit `icis_air:<id>` and
    pipeline/resolve.py pairs them (D3). robots: echo.epa.gov allows /files/ (Crawl-delay 10, honoured by the
    0.1 rps limit); echodata.epa.gov (the ECHO REST API host) answers `Disallow: *` and is never used. The
    FRS national download (frs_downloads.zip, 368,601,232 bytes) was measured and rejected: FRS_FACILITIES.csv
    has latitude/longitude but no collection method or accuracy. 2026-10-07 (lane L11, docs/25 §3.10): a facility
    ICIS carries twice under re-padded or re-prefixed programme ids with the same FRS id and the same name is one
    row (4 folded on the 2026-10-07 snapshot: 521 -> 517); a name-based tightening of the NAICS 518210 basis was
    tested and rejected, because the enterprise-named rows it would drop are mostly real data centres.

- id: us.ga.epd.air_permit_advisories
  name: Georgia EPD Air Protection Branch public advisories (permit applications received)
  jurisdiction: US-GA
