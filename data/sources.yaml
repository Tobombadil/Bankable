# ─────────────────────────────────────────────────────────────────────────────
# B. US NON-ISO UTILITIES (Southeast, West, Mountain) — the coverage gap
# ─────────────────────────────────────────────────────────────────────────────
- id: us.oasis.non_iso_queues
  name: Non-ISO utility generator interconnection queues via OASIS / utility sites
  jurisdiction: US (Duke, Southern, TVA, Dominion-non-PJM, PacifiCorp, APS, NV Energy, Xcel-CO, BPA, WAPA, etc.)
  category: generation_queue
  operator: ~40 transmission providers
  url: https://www.oasis.oati.com/
  access: html
  auth: none (OATI OASIS sites; some require free registration)
  format: html/xlsx/pdf (one layout per utility)
  cadence: weekly–monthly
  license: per-utility; most publish under FERC Order 2003/2023 transparency obligations
  reuse: attribution
  tier: 2
  effort: L
  notes: >
    ~25–30% of US queued capacity lives outside the seven ISOs. No single API. This is where a durable
    data moat could exist because every entry costs labour. Prioritise by queued MW: Duke Energy Carolinas,
    Southern Company, TVA, PacifiCorp, APS, NV Energy, Xcel Colorado, BPA.

