      downloadable files", "Coverage of planned CO2 storage sites with global stratigraphic wells" and a
      "Global dataset of point source emissions and emitting facilities". No /about, /data or /methodology
      page exists (all 404) and no data source is named anywhere on the public site.
  notes: >-
    DO NOT INGEST, DO NOT SCRAPE. Same class as Cleanview and Energy Adepto: a private paid aggregator with
    no stated licence. They are not on CLAUDE.md's named prohibited list only because they are newer than it;
    treat them as if they were. Their robots.txt allowing crawlers changes nothing - robots is not a licence,
    and an unlicensed compilation is protected by contract and (in the EU) database right whatever robots
    says. Permitted: reading their public marketing pages for competitive research, as recorded above.
    Not permitted: fetching, storing or deriving from their project pages, map layers or API under any
    circumstance. Their underlying public sources are the things to build - EPA Class VI (us.epa.class_vi),
    the six primacy states, GHGRP (us.epa.ghgrp), FOIA-obtained documents - none of which they own.

