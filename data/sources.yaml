  access: bulk_file
  auth: none (page 403 to non-browser clients; direct xlsx link works in browser)
  format: xlsx
  cadence: annual (data through 2025 published May–Jun 2026)
  license: CC BY 4.0 (attribute LBNL and GridTracker)
  reuse: attribution
  tier: 1
  effort: S
  probe: {method: GET}
  verified: {date: 2026-09-12, result: blocked_403_html, note: "site blocks non-browser UA; file itself is public"}
  notes: >-
    Best backfill and normalisation reference. ~8,200 active projects, 1,312 GW generation + 749 GW storage at
    end-2025. Includes codebook. Annual cadence only. The CC BY 4.0 claim above is UNVERIFIED as of 2026-09-12
