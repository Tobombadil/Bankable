  notes: >-
    The site finder's grid layer (owner, 2026-10-22): sites within 1 mile of a 69 kV-or-higher line, within 5 miles
    of a substation, outside the FEMA floodplain. Lines are power=line and power=cable ways (cables flagged
    underground) whose highest voltage is 69 kV or more, plus ways with no usable voltage (kept as voltage
    unknown); line=busbar/bay ways are substation internals and dropped. Substations are power=substation nodes,
    closed ways and multipolygon relations (area -> centroid plus outline), every subtype kept except
    substation=traction and minor_distribution. Source ids are way/<id>, node/<id>, relation/<id>; source_url is
    the element's www.openstreetmap.org page, which robots.txt disallows for crawling (/way/, /node/, /relation/):
    the platform links to it and never fetches it. retrieved_at is the extract's replication timestamp (PBF
    header), not the download time. Operators ride as text (attributes.operator), not linked to organisations.
    Share-alike (ODbL 4.4): the derived database the API serves is offered under ODbL as the build's own public
    files (docs/25 section 2.7); the final wording of that offer is the legal lane's (docs/13 section 6). This source
    is OpenStreetMap's data, not a private aggregator: OpenInfraMap renders the same data and is never scraped, and
    Geofabrik's paid "Power Networks" product is not used. Never mixed with DHS's restricted HIFLD substation layer or
    anything derived from it (us.dhs.hifld.electric_substations). pipeline/context/osm_power.py builds;
    infra/scripts/build_grid_layers.sh and .github/workflows/grid-layers.yml run the national build monthly, one state
    at a time, each download checked against Geofabrik's .md5 file and its Content-Length and retried alone (three
    attempts) when a transfer fails part-way;
    services/ingest/osm_power.py loads and withdraws. The server loads the states GRID_LAYERS_REGIONS names
    (US-TX for the beta; 'all' for national); the pull refuses to run when it is unset, because the national line
    index does not fit the beta server's memory yet (docs/25 section 2.7, limit 3). Region rule (fix round
    2026-10-22): each row is labelled by the vendored state polygon of its representative point, and a load of a
    state holds every row whose scope (states its vertices touch, plus every extract that held it) names that
    state, so ways across a state line are never dropped from either side; the same rule decides withdrawals and
    the per-state counts the promotion gate compares (10% and at least 50 rows). Narrowing GRID_LAYERS_REGIONS later
    removes the dropped states' rows at the next load. The credit's changes_statement
    names where the derived database's files are (ODbL 4.6) until the legal lane writes the offer page.
    See docs/25 section 2.7 and docs/13 section 6.

