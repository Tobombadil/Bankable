    sentence quoted above, and the Download Data URL it was read from now 301s to the project page. Not
    reclassified (the 2026-09-12 quote was genuinely retrieved); re-verify from the notice inside a download
    file before the next release is ingested. docs/13 section 2.18.
    2026-09-26 (legal-compliance lane, noncommercial-posture reclassification pass): reviewed against the
    new `noncommercial` register class and left `reuse: attribution` / `publication: raw_ok` unchanged. The
    entry as a whole is CC BY 4.0, which is `attribution`, not `noncommercial` — the only CC BY-NC 4.0
    material here is the TZ-ID row subset quoted above, and those rows are already dropped at ingest
    (never stored, never published), so there is no noncommercial-licensed content in this source's
    published rows to carry a `noncommercial` class or to gate on `PLATFORM_POSTURE`. Splitting the TZ-ID
