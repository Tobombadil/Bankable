- id: us.epa.ghgrp.subpart_uu_pp
  name: EPA GHGRP Subpart UU (injection of CO2 - EOR and other injection without an MRV plan) and Subpart PP (suppliers of CO2 - capture and separation)
  jurisdiction: US
  category: registry
  operator: US EPA (Office of Atmospheric Protection, GHGRP)
  url: https://www.epa.gov/ghgreporting/data-sets
  access: bulk_file
  auth: none
  format: >-
    sheets "CO2 Injection" (Subpart UU: facility, lat/lon, NAICS, Quantity of CO2 Received for
    Injection) and "Suppliers" (Subpart PP column "GHG Quantity Associated with CO2 Supply") of
    ghgp_data_<year>.xlsx in the annual Data Summary Spreadsheets zip; Envirofacts
    pub_dim_facility filtered reported_subparts CONTAINING UU / PP, and the pp_subpart_level_information table
  cadence: annual (RY2023 newest on 2026-09-25)
  license: public domain
  reuse: open
  publication: raw_ok
  tier: 2
  effort: S
  rate_limit_rps: 0.5
  probe: {method: GET, url: "https://data.epa.gov/efservice/pub_dim_facility/reported_subparts/CONTAINING/UU/count/JSON"}
  verified:
    date: 2026-09-25
    result: ok
    note: >-
      Same zip as us.epa.ghgrp.subpart_rr (sha256 895349c8...bf8345). Sheet "CO2 Injection": 81 facility
      rows RY2023 (TX 34, WY 14, NM 9, MS 8, ND 3, MI 3, MT 3, LA 2, CO 2, OK 2, AR 1) with lat/lon and
      Quantity of CO2 Received for Injection; Envirofacts reported_subparts CONTAINING UU = 1,207
      facility-years all years, 81 for 2023 (87,523 bytes, sha256
      76738d7ba36d6b2c73733f6fcaee350dca236a7f146b1b526fece9987c93a223). Sheet "Suppliers": 1,004 rows
      of which the CO2-supply column is populated for the Subpart PP set; pp_subpart_level_information
      count = 1,771 facility-year rows (200, 35 bytes), 138 PP facilities for 2023 (Envirofacts count).
      No uu_subpart_level_information table exists (404).
  notes: >-
    UU is the EOR asset class in the US: every facility injecting CO2 that has NOT opted into an RR
    MRV plan reports here, so UU + RR together enumerate CO2 injection sites nationally, and UU rows
    are the counterparties of CO2 pipelines and of the Permian/Wyoming/Mississippi floods. PP is the
    capture side: a Subpart PP reporter captures or separates a CO2 stream for supply (ethanol plants,
    gas-processing plants, ammonia, hydrogen, natural CO2 domes), i.e. the operational half of the
    "Capture" asset class; planned capture is a proposal and comes from DOE awards, Class VI
    applications and filings instead. Both are context layers (existing facilities), same posture
    as us.epa.ghgrp. Scope limit: US only, above the 25,000 tCO2e reporting threshold.

