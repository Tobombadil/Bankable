- id: us.ferc.elibrary
  name: FERC eLibrary (undocumented JSON backend used by the SPA)
  jurisdiction: US
  category: regulatory_docket
  operator: FERC
  url: https://elibrary.ferc.gov/eLibrarywebapi/api/Search/AdvancedSearch
  access: api
  auth: none
  format: json
  cadence: realtime
  license: public domain
  reuse: open
  tier: 1
  effort: M
  probe: {method: POST, body: '{"searchText":"interconnection agreement","searchDescription":true,"searchFullText":false,"searchDocketNumber":false,"resultsPerPage":3,"curPage":1,"sortBy":"","groupBy":"DOCKET","filterDate":{"dateType":"filed_date","startDate":"09/01/2026","endDate":"09/12/2026"},"docketNumbers":[],"documentClasses":[],"documentTypes":[],"availability":"P","categories":[],"idList":[],"accessionNumber":"","libraryTypes":[],"filedBy":"","affiliations":""}'}
  verified: {date: 2026-09-12, result: ok, rows: 131, note: "connector run: 30-day window, docket-number substring search (ER26/CP26) plus description terms, 131 documents, DQ pass. filterDate has no measured effect (totalHits identical across every date window and dateType tried); the connector filters filed_date client-side instead. sortBy anything other than empty string (e.g. filed_date) returns HTTP 200 success:false with a null-reference errorMessage - treated as error, so sortBy is always sent empty. Full detail in pipeline/connectors/us_ferc_elibrary/connector.py docstring."}
  notes: >
    Docket prefixes of interest: ER (electric rate/IA filings incl. LGIAs), CP (gas pipeline & LNG
    certificates), P (hydro), EL, RM. eSubscription email alerts are the officially supported channel.

