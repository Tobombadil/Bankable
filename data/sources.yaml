      52bf877ca70647ab703f01073add365caa1eed68b77c6b4f553ad0964c3c4e05, 243 hypercube rows -> 68 project rows (Technical
      Review 36, Application Withdrawn 13, Final Permit Decisions Issued 11, Completeness Review 5, Prepare Draft Permit
      1, Public Comment Period 1, Prepare Final Permit Decision 1). The app's "Last Updated" reads 2026-09-25; the
      tracker PDF link moved to documents/2026-09/class-vi-permit-tracker_9-25-26.pdf. DQ warn, not pass: the new Phase
      "Prepare Final Permit Decision" (1 row, 1.5 %) was unmapped and read `unknown`; status_map.yaml maps it to
      `studied` from 2026-10-07, so the next run reclassifies that row without an event. 0 duplicate keys, provenance
      on every row, state null on 2 rows (2.9 %, the tribal-land projects). Loaded into a store copy with the dev
      sources: 66 of 68 placed. The resolver merged 3 of them into CAISO generation requests (Tulare, Sutter,
      Montezuma) until the kind rule of 2026-10-07 (pipeline/resolve.py KIND_CLASSES, docs/22 §22.12); with it, 0.
  notes: >-
    One row per PROJECT, not per well: each Class VI well needs its own application and permit, and the
    tracker's "# of Permit Applications for Project" carries the well count (235 applications over 68 projects
    on 2026-09-22 - that count, not a project count, is where the old "175+ applications" note came from).
    Carries company, project, county/parish/tribe, state, EPA region, application received date, the full
    NOD (<=4) and RAI (<=11) round ladders with sent/received dates, milestone estimated+actual dates for each
    review phase, phase, EPA's free-text current-status note, on-hold status and days, GSDT project id (47 of
    68 rows) and a per-project udr.epa.gov UIC Data Repository link (all 68 rows).
    The "UIC Class VI Permit Tracker (pdf)" download
    (https://www.epa.gov/system/files/documents/2026-05/permit-tracker_5-22-26.pdf, 353,074 bytes, sha256
    b969e5bb0f2b466e2067ffaaa1ed9943faa05f30b9eaa8c2f0fda659ee7b8f3d) is NOT a data route and is deliberately
    not parsed: one page, no tables, produced by "Adobe Acrobat Paper Capture Plug-in" (OCR of a chart image),
    project labels truncated mid-word ("Carbon Storage Solutions, LLC: Front Range Storage .. ."), OCR errors
    ("CTV Ill" for CTV III), and no per-project dates - only a shared date axis. It is recorded as evidence in
    every snapshot's meta.
    EXCLUSION, the important one: applications in the SIX states granted Class VI primacy - Arizona,
    Louisiana, North Dakota, Texas, West Virginia and Wyoming - are transferred to the state and are
    explicitly "not tracked here". The prior note listed five and omitted Arizona. Each state is registered
    separately below (us.az.adeq.class_vi, us.la.dce.class_vi, us.nd.dmr.class_vi, us.tx.rrc.class_vi,
    us.wv.dep.class_vi, us.wy.deq.class_vi); national CCS coverage is EPA plus all six, never EPA alone.
    Personal data: the app carries a "Primary Permit Writer" field (named EPA staff, 21 distinct values). It
    is outside the connector's FIELDS list, so it is never requested, never snapshotted and never stored.
    Two rows are on tribal land and EPA's "State" column reads "Osage Nation" / "All Other Indian Tribes";
    those normalise to a null state rather than a guessed one.

