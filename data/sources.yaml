      28,389,973 bytes, sha256 895349c8008b7962dba68659c8187cec6b340d68be84ccb3f0e7fb6037bf8345,
      Last-Modified 2024-10-15) - no RY2024 summary is published as of today. ghgp_data_2023.xlsx sheet
