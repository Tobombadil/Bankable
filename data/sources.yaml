  auth: none
  format: biweekly text PDF (e.g. https://epd.georgia.gov/document/document/pa1225-3/download, 3 pages, one block per application)
  cadence: biweekly
  license: 'No reuse terms published (read 2026-10-24, docs/07 §1.2). epd.georgia.gov links only accessibility, privacy and platform pages; the Georgia.gov privacy statement (https://georgia.gov/privacy-and-security) "applies to Georgia.gov websites that link to it in the footer" and covers visitor information and the Georgia Open Records Act. Footer: "© Georgia.gov".'
  reuse: attribution
  publication: derived_only
  licence_url: https://georgia.gov/privacy-and-security
  attribution: 'Source: Georgia Environmental Protection Division, Air Protection Branch'
  tier: 2
