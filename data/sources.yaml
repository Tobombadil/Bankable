  access: html
  auth: none
  format: html/pdf
  cadence: daily
  license: public records; per-site terms
  reuse: attribution
  tier: 3
  effort: L
  notes: >
    CPCN applications, IRPs, RFP approvals, large-load tariff cases. Halcyon ($99/mo–$50k/yr) already
    productises this; treat as partner-or-later, not MVP. Machine-readable exceptions: PUCT Interchange, NY DMM RSS.

- id: us.utility_rfps
  name: Utility / co-op / CCA all-source and renewable RFPs
