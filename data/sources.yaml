  auth: none
  format: json
  cadence: realtime
  license: public domain
  reuse: open
  tier: 1
  effort: M
  probe: {method: POST, body: '{"searchText":"interconnection agreement","searchDescription":true,"searchFullText":false,"searchDocketNumber":false,"resultsPerPage":3,"curPage":1,"sortBy":"","groupBy":"DOCKET","filterDate":{"dateType":"filed_date","startDate":"09/01/2026","endDate":"09/12/2026"},"docketNumbers":[],"documentClasses":[],"documentTypes":[],"availability":"P","categories":[],"idList":[],"accessionNumber":"","libraryTypes":[],"filedBy":"","affiliations":""}'}
  verified: {date: 2026-09-12, result: ok, note: "returns searchHits/totalHits; endpoint undocumented, proxy intermittently 5xx; keep ≤0.5 rps"}
  notes: >
    Docket prefixes of interest: ER (electric rate/IA filings incl. LGIAs), CP (gas pipeline & LNG
    certificates), P (hydro), EL, RM. eSubscription email alerts are the officially supported channel.

