- id: us.eia.atlas.gas_pipelines
  name: EIA US Energy Atlas — Natural Gas Interstate and Intrastate Pipelines (line geometries)
  jurisdiction: US
  category: registry
  operator: US Energy Information Administration (ArcGIS Hub site)
  url: https://atlas.eia.gov/datasets/eia::natural-gas-interstate-and-intrastate-pipelines/about
  access: api
  auth: none
  format: geojson/shapefile (ArcGIS feature service export)
  cadence: annual
  license: 'US federal work — public domain; EIA copyright/reuse page quoted in docs/13-legal-data-rights.md section 2.11 (retrieved 2026-09-15) asks that EIA be cited as the source. The dataset-level licenseInfo field on the Atlas item was not retrieved (the Hub catalogue API returned no row for the slug, 2026-09-15); read it in a browser before the layer ships'
  reuse: open
  publication: raw_ok
  tier: 2
  effort: M
  probe: {method: GET}
  verified: {date: 2026-09-19, result: ok_fallback, note: 'anonymous GET on the Atlas feature-service query URL answered HTTP 200 with the ArcGIS error body {code: 499, message: Token Required} (services7.arcgis.com/FGr1D95XCGALKXqM, the EIA org; its 79 public feature services carry no gas layer and the Hub lists this dataset as an Image item), so the connector fell back to the shapefile zip EIA publishes on www.eia.gov/maps/map_data/ (allowed by eia.gov robots.txt; /maps/ is not under a Disallow). Query URL tried: https://services7.arcgis.com/FGr1D95XCGALKXqM/arcgis/rest/services/NaturalGas_InterIntrastate_Pipelines_US_EIA/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=2000. Fetched https://www.eia.gov/maps/map_data/NaturalGas_InterIntrastate_Pipelines_US_EIA.zip at 2026-09-19T15:34:29Z: 2,954,667 bytes, sha256 bfd9757e…ac56, Last-Modified 2020-04-27, member NaturalGas_Pipelines_US_202001 (vintage 202001, metadata pubdate 2020-04-28): 32,961 PolyLine features, fields TYPEPIPE (Interstate 17,996 / Intrastate 14,896 / Gathering 69), Operator (253 distinct), Status (all Operating), Shape_Leng (degrees). No pipeline name, diameter or capacity field exists. pipeline/context/eia_atlas.py dissolves by (Operator, TYPEPIPE) -> 259 rows, 40 degenerate single-vertex segments dropped, 230,252 geodesic miles, parquet 2,306,020 bytes unsimplified (no simplification needed under the 40 MB budget), 7.27 s incl. fetch. Tallgrass operator strings present: Rockies Express Pipeline (49 segments), Rockies Express (Entrega) (16), Rockies Express (Echo Springs Lateral) (1), Tallgrass Interstate Gas Transmission (1), Trailblazer Pipeline Co (39), Ruby Pipeline LLC (4).'}
  notes: >-
    Candidate for the second built-infrastructure context layer (existing pipelines; docs/00-PLAN.md decision
    2026-09-15 "Pipelines join the plan"). Line geometries, so the layer is pre-built vector tiles on the tiles
    bucket, not clustered GeoJSON from the API. HIFLD's natural gas pipeline layer is the alternative used by
    Open Grid Works; its public availability has changed and needs its own terms check before use.

- id: us.oasis.non_iso_queues
  name: Non-ISO utility generator interconnection queues via OASIS / utility sites
  jurisdiction: US (Duke, Southern, TVA, Dominion-non-PJM, PacifiCorp, APS, NV Energy, Xcel-CO, BPA, WAPA, etc.)
  category: generation_queue
  operator: ~40 transmission providers
  url: https://www.oasis.oati.com/
  access: html
  auth: none (OATI OASIS sites; some require free registration)
  format: html/xlsx/pdf (one layout per utility)
  cadence: weekly–monthly
  license: per-utility; most publish under FERC Order 2003/2023 transparency obligations
  # 2026-09-18: docs/13-legal-data-rights.md §6 (line 1270) records this source `unknown` (terms not retrieved); reclassified from `attribution`. Gated until the terms are read and recorded.
  reuse: unknown
  publication: none
  tier: 2
  effort: L
  notes: >
    ~25–30% of US queued capacity lives outside the seven ISOs. No single API. This is where a durable
