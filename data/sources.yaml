- id: us.grants_gov.search2
  name: Grants.gov Search2 API
  jurisdiction: US
  category: funding
  operator: HHS / Grants.gov
  url: https://api.grants.gov/v1/api/search2
  access: api
  auth: none
  format: json
  cadence: realtime
  # Polled hourly (2026-10-07, audit F12): the full posted|forecasted search is 2 POSTs a run, 192 a
  # day at the 15-minute floor; notices are posted on business days with deadlines weeks out.
  poll: hourly
  license: public domain
  reuse: open
  publication: raw_ok
  # The API's Terms of Service (https://www.grants.gov/api/terms-conditions, read 2026-10-22), quoted
  # in `notes`, ask every service that uses the API to show this notice; it is the credit line the
  # loader renders (a request of the API's terms, not a licence condition on the public-domain data).
  attribution: "This product uses the Grants.gov API but is not endorsed or certified by the U.S. Department of Health and Human Services."
  licence_url: "https://www.grants.gov/api/terms-conditions"
  # The terms publish no numeric limit ("Right to Limit", quoted in `notes`); 1 request a second is
  # shared by the search and the per-notice detail reads (same host).
  rate_limit_rps: 1
  tier: 1
  effort: S
  probe: {method: POST, body: '{"keyword":"energy","oppStatuses":"forecasted|posted","rows":5}'}
  verified: {date: 2026-09-12, result: ok, rows: 151, note: 'connector run: keyword energy, oppStatuses forecasted|posted, 151 hits over 2 pages, DQ pass. 2026-10-22: POST https://api.grants.gov/v1/api/fetchOpportunity read by hand for 6 notices in the store (279638, 322667, 356623, 361315, 361526, 363396), 6 of 6 errorcode 0, 2 s apart; 5 of them (all but 361315) recorded as tests/fixtures/grants_gov_fetch_opportunity.json with the contact fields and the publisher user id replaced'}
  notes: >-
    Filter by agency (DOE-*, USDA-RD, EPA, DOT) and CFDA/ALN. Detail endpoint (lane rfp-value,
    2026-10-22): POST https://api.grants.gov/v1/api/fetchOpportunity {"opportunityId": <id>}, no
    authentication ("Authentication and authorization is not required for fetchOpportunity",
    https://www.grants.gov/api/common/fetchopportunity). It carries the funding figures the search
    lacks (synopsis/forecast `estimatedFunding`, `awardCeiling`, `awardFloor`, `numberOfAwards`)
    and also the programme officer's name, email and phone, which the connector never stores. The
    connector reads it only for the notices its own search returned, reuses a reading for 7 days
    while the hit's status and dates are unchanged, and reads at most 150 a run, one attempt each
    with a 20 s timeout. Because of the "Right to Limit" clause below, the first failure, 429, 5xx,
    challenge or other refusal stops the detail reads for the run (no retry, no backoff wait), as
    do ten error bodies in a row, and no read starts more than 300 s into the run; what was not
    read keeps its earlier reading and waits for the next run, and a notice whose own read failed
    is not asked again for a day. A re-read with the same figures keeps the earlier reading, so it
    changes no stored record. API Terms of
    Service, read 2026-10-22, verbatim: "You may use the Grants.gov API to search, display,
    analyze, retrieve, view and otherwise "get" information from grants data." "All services,
    which utilize or access the API, should display the following notice prominently within the
    application: "This product uses the Grants.gov API but is not endorsed or certified by the
    U.S. Department of Health and Human Services."" "You may not modify or falsely represent
    content accessed through the API and still claim the source is the U.S. Department of Health
    and Human Services Office of Grants for Grants.gov System." "Your use of the API may be
    subject to certain limitations on access, calls, or use as set forth within this Agreement or
    otherwise provided by HHS. If Grants.gov reasonably believes that you have attempted to exceed
    or circumvent these limits, your ability to use the API may be temporarily or permanently
    blocked." No numeric limit is published.

