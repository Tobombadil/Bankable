    ("funded by the U.S. Department of Energy under Contract No. DE-AC02-05CH11231"), no Creative Commons
    statement. Derived-only with credit "Lawrence Berkeley National Laboratory and GridTracker" until
    verified. See docs/13-legal-data-rights.md section 2.1.

