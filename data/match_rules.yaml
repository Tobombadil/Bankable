# Proposal <-> opportunity matching rules (docs/10 US-401 AC1: "the rule set is a versioned config
# file"). Loaded by `services/match/rules.py`, applied by `services/match/engine.py`, measured by
# `services/match/eval.py` against `data/eval/match_labels.csv` (docs/22 §21 "Proposal–opportunity
# matching v1", §25 "Matching v2"). Bump `rule_set_version` whenever a rule, weight, threshold or
# term list changes: every stored match records the version that produced it, and a re-run under a
# new version re-evaluates every pair (`services/match/run.py`).
#
# An opportunity's `technologies` list is split on `|` first: the extractors store a multi-technology
# notice as one pipe-joined element (`["solar_pv|nuclear"]`).
#
# A pair is a match when ALL FOUR rules pass (US-401 AC1), the eligibility gate passes (v2, below)
# and the weighted score is at least `threshold`. Each rule yields a credit in [0, 1]: 1.0 for a
# clean pass, a smaller value for a pass on incomplete evidence (a national programme, an unstated
# capacity window, no stated deadline), 0 for a fail. `score = sum(weight_i * credit_i) /
# sum(weight_i)`. The gate has no weight: it never moves a score.
#
# v1 -> v2 (2026-10-21, docs/22 §25): the eligibility gate (`rules.eligibility`), `ccs` mapped and
# `microgrid` / `metering` / `load` excluded (`rules.technology`), and `national_kinds`
# (`rules.jurisdiction`). Weights, threshold, size window and timing are unchanged.
rule_set_version: match-rules@v2

# Public display gate (coordinator decision, 2026-09-26). docs/10 US-401 AC3 sets the bar at
# precision >= 0.7 at the default threshold; this rule set measured 0.250 (5/20, 95 % CI
# 0.112-0.469) on the 103 labelled pairs and 0.333 on the held-out half (docs/22 §21), so most of
# the matches it produces would be wrong claims in front of readers. While `false`: matches are
# still computed and stored, their `match_added` / `match_removed` events are written with
# `public_at` and `published_at` NULL (never visible on any tier, feed or webhook), and every
# match route returns an empty list with `matches_withheld` to every caller but an operator.
# Operators see everything and the CRM lead hand-off still works. Set `true` only for a rule set
# whose own measurement clears AC3.
# v2 does NOT meet AC3 (docs/22 §25.5). It measured 6/6 = 1.000 (95 % CI 0.610-1.000) on the
# held-out half of the independent labels of 2026-10-20, but that sample has 82 pairs (62 held out),
# below AC3's 100; the decisive rules (`people`, rule J) were written with test-half notices known
# (6/18 = 0.333 without both); every predicted pair comes from one notice; the CI lower bound is
# 0.61. Stays `false` until a fresh blind draw of at least 100 pairs measures the rule set.
publish: false

# Set a priori, before any label existed: a pair on full evidence scores 1.0, and 0.70 still admits
# one rule passing on its weakest credit. `services/match/eval.py --sweep` on the `tune` half of
# data/eval/match_labels.csv could not move it -- that half holds no positive pair, and every pair
# the rules accept there scores 0.865 -- so it stands untuned. docs/22 §21 has the numbers. v2 did
# not tune it either: the tune half still holds no positive pair, and v2 accepts none of its pairs
# at any threshold from 0.50 to 0.95 (docs/22 §25.4).
threshold: 0.70

weights:
  technology: 0.35
  jurisdiction: 0.30
  size_window: 0.15
  timing: 0.20

rules:
  technology:
    # Pass when the proposal's technology and one of the opportunity's technologies fall in the
    # same family. Tokens are the normalised values docs/21 §7 and /v1/meta/vocabularies publish on
    # either side; families let a `bess` tender meet a `storage` queue row. An opportunity whose
    # technologies list is EMPTY fails this rule: an empty list means "not extracted", not
    # "all-source" -- an all-source solicitation is curated with an explicit `all_source` token.
    all_source_tokens: [all_source, any]
    families:
      solar: [solar, solar_pv, solar_thermal, solar_storage]
      storage: [storage, bess, bess_li_ion, pumped_storage, solar_storage, wind_storage]
      wind: [wind, wind_offshore, wind_onshore, wind_storage]
      # `gas_pipeline` and `pipeline` (2026-10-24): the opportunity extractor files every "pipeline"
      # notice as `gas` (pipeline/connectors/opportunity.py), so a pipeline proposal meets those
      # notices whatever its source says it carries.
      gas: [gas, gas_cc, gas_ct, gas_steam, gas_ice, gas_other, natural_gas, lng_terminal, gas_pipeline, pipeline]
      hydro: [hydro, pumped_storage]
      marine: [marine]
      nuclear: [nuclear]
      geothermal: [geothermal]
      biomass: [biomass, waste, biogas, rng]
      transmission: [transmission, grid_equipment]
      hydrogen: [hydrogen, fuel_cell]
      coal: [coal]
      oil: [oil]
      efficiency: [efficiency]
      heat: [heat, solar_thermal, geothermal, chp]
      ev_charging: [ev_charging]
      # v2: the opportunity extractor's `ccs` (carbon capture, CCUS, CO2 removal) meets the EPA
      # Class VI wells' `co2_geologic_sequestration` (68 proposals in the 2026-10-20 store).
      ccs: [ccs, co2_geologic_sequestration]
    # v2: vocabulary deliberately left out of matching. Each is recognised (so the vocabulary test
    # in services/match/test_rules.py knows it is not an oversight) and fails the technology rule
    # with its own reason:
    # - microgrid (opportunity; "microgrid|mini-grid|off-grid|rural electrification"): a buyer's
    #   distribution-level system for its own communities, bid by EPC contractors; no proposal
    #   technology is a microgrid, and mapping it to solar/storage would put every utility-scale
    #   solar queue row in the country against a rural electrification tender.
    # - metering (opportunity; "smart meter|metering|AMI"): a utility buying meters. No project.
    # - load (proposal; data centres and large-load requests): a consumer, not a project that
    #   answers a solicitation for supply; no opportunity token describes demand for load.
    excluded_tokens: [microgrid, metering, load]
  jurisdiction:
    # ISO 3166-2 on both sides (`US-TX`), or ISO 3166-1 for a country-level row (`US`). A different
    # country fails. Credits for the passes that are not an exact region match:
    national_credit: 0.8      # the opportunity is country-wide (`US`) and the proposal is in it
    unresolved_credit: 0.5    # one side carries only a country (no state/region known)
    adjacent_credit: 0.5      # neighbouring US states (the table below); "AZ/NV adjacent"
    # v2 (docs/22 §25.2 rule J): a country-only jurisdiction means "country-wide" only for these
    # opportunity kinds -- federal funding opportunities, programmes, loan programmes, national
    # auctions. A single buyer's tender or procurement notice that states only its country did not
    # have its region extracted; it passes on `unresolved_credit`, like a proposal with no region.
    # Evidence: the tune-half notices of Scottish Water (Scotland only) and SSEN Distribution
    # (north of Scotland, central southern England) are stored as `GB` and v1 credited them GB-wide.
    national_kinds: [foa, program, loan_program, auction]
    adjacency:
      US-AL: [US-FL, US-GA, US-MS, US-TN]
      US-AR: [US-LA, US-MO, US-MS, US-OK, US-TN, US-TX]
      US-AZ: [US-CA, US-CO, US-NM, US-NV, US-UT]
      US-CA: [US-AZ, US-NV, US-OR]
      US-CO: [US-AZ, US-KS, US-NE, US-NM, US-OK, US-UT, US-WY]
      US-CT: [US-MA, US-NY, US-RI]
      US-DC: [US-MD, US-VA]
      US-DE: [US-MD, US-NJ, US-PA]
      US-FL: [US-AL, US-GA]
      US-GA: [US-AL, US-FL, US-NC, US-SC, US-TN]
      US-IA: [US-IL, US-MN, US-MO, US-NE, US-SD, US-WI]
      US-ID: [US-MT, US-NV, US-OR, US-UT, US-WA, US-WY]
      US-IL: [US-IA, US-IN, US-KY, US-MO, US-WI]
      US-IN: [US-IL, US-KY, US-MI, US-OH]
      US-KS: [US-CO, US-MO, US-NE, US-OK]
      US-KY: [US-IL, US-IN, US-MO, US-OH, US-TN, US-VA, US-WV]
      US-LA: [US-AR, US-MS, US-TX]
      US-MA: [US-CT, US-NH, US-NY, US-RI, US-VT]
      US-MD: [US-DC, US-DE, US-PA, US-VA, US-WV]
      US-ME: [US-NH]
      US-MI: [US-IN, US-OH, US-WI]
      US-MN: [US-IA, US-ND, US-SD, US-WI]
      US-MO: [US-AR, US-IA, US-IL, US-KS, US-KY, US-NE, US-OK, US-TN]
      US-MS: [US-AL, US-AR, US-LA, US-TN]
      US-MT: [US-ID, US-ND, US-SD, US-WY]
      US-NC: [US-GA, US-SC, US-TN, US-VA]
      US-ND: [US-MN, US-MT, US-SD]
      US-NE: [US-CO, US-IA, US-KS, US-MO, US-SD, US-WY]
      US-NH: [US-MA, US-ME, US-VT]
      US-NJ: [US-DE, US-NY, US-PA]
      US-NM: [US-AZ, US-CO, US-OK, US-TX, US-UT]
      US-NV: [US-AZ, US-CA, US-ID, US-OR, US-UT]
      US-NY: [US-CT, US-MA, US-NJ, US-PA, US-VT]
      US-OH: [US-IN, US-KY, US-MI, US-PA, US-WV]
      US-OK: [US-AR, US-CO, US-KS, US-MO, US-NM, US-TX]
      US-OR: [US-CA, US-ID, US-NV, US-WA]
      US-PA: [US-DE, US-MD, US-NJ, US-NY, US-OH, US-WV]
      US-RI: [US-CT, US-MA]
      US-SC: [US-GA, US-NC]
      US-SD: [US-IA, US-MN, US-MT, US-ND, US-NE, US-WY]
      US-TN: [US-AL, US-AR, US-GA, US-KY, US-MO, US-MS, US-NC, US-VA]
      US-TX: [US-AR, US-LA, US-NM, US-OK]
      US-UT: [US-AZ, US-CO, US-ID, US-NM, US-NV, US-WY]
      US-VA: [US-DC, US-KY, US-MD, US-NC, US-TN, US-WV]
      US-VT: [US-MA, US-NH, US-NY]
      US-WA: [US-ID, US-OR]
      US-WI: [US-IA, US-IL, US-MI, US-MN]
      US-WV: [US-KY, US-MD, US-OH, US-PA, US-VA]
      US-WY: [US-CO, US-ID, US-MT, US-NE, US-SD, US-UT]
  size_window:
    # The window an opportunity's `capacity_sought_mw` implies: a bid may be a fraction of what is
    # sought (down to `lower_ratio` of it) and may exceed it slightly (`upper_ratio`). "50–500 MW"
    # for a 500 MW solicitation. A window that neither side can state passes at `unstated_credit`.
    lower_ratio: 0.1
    upper_ratio: 1.1
    unstated_credit: 0.5
  timing:
    open_statuses: [announced, open, reinstated]
    unknown_status_credit: 0.5   # `status = unknown`: not known to be closed
    no_deadline_credit: 0.5      # open with no stated `due_at`
    proposal_excluded_states: [withdrawn, cancelled, built]
  eligibility:
    # v2 gate (docs/22 §25.2), unweighted. A notice can match a project only when
    # (a) it is about energy at all: `services/match/relevance.py` (shared with the API for the
    #     docs/16 U-7 default view; its own version, `opportunity-relevance@v1`), and
    # (b) what it funds or buys is something a project's sponsor could apply for or bid WITH THIS
    #     PROJECT: the first class below that claims the notice decides (`services/match/
    #     eligibility.py`); a notice no class claims is eligible.
    # A class claims a notice when one of its `terms` (case-insensitive regexes) occurs in the
    # title or summary, or when the notice states CPV codes and every one of them starts with a
    # `cpv_all_in` prefix. `summary` is null for every current opportunity connector, so on today's
    # data the terms read the title only.
    #
    # Provenance of each term, because the test half must not have informed any (docs/22 §25.2):
    #   [A] a priori: the categories the coordinator named before this rule set existed ("people,
    #       training, scholarships, staff, pure research, studies or planning"; docs/22 §21.5) and
    #       their plain synonyms, or the public-procurement vocabulary for what a contract buys;
    #   [T] a tune-half row of data/eval/match_labels.csv (named in the comment).
    require_energy_relevance: true
    classes:
      - name: people
        eligible: false
        reason: funds or hires people, not projects
        terms:
          - '\bscholarships?\b'           # [A]
          - '\bfellowships?\b'            # [A]
          - '\btraining\b'                # [A]
          - '\btrainees?\b'               # [A]
          - '\bworkforce\b'               # [A]
          - '\binternships?\b'            # [A]
          - '\bapprenticeships?\b'        # [A]
          - '\bstudents?\b'               # [A]
          - '\bteaching\b'                # [A]
          - '\bcurricul(um|a)\b'          # [A]
          - '\bstaff(ing)?\b'             # [A] "staff"; v1 tune: grants.gov "Staff Support to Tribal ..."
          - '\brecruitment\b'             # [A]
          - '\bcapacity[\s-]+building\b'  # [A]
          - '\bdelegates?\b'              # [T] tune ocds-h6vhtk-0775ad: DESNZ hires IEA delegates
        cpv_all_in: ['80', '796']         # [A] CPV 80 education and training; 796 recruitment, personnel
      - name: project_offtake
        eligible: true
        reason: buys energy or capacity from projects
        # [A] Checked before the exclusions below: "supply of electricity under a PPA" is a
        # project's market, not a supplier's.
        terms:
          - '\bpower\s+purchase\b'
          - '\bppas?\b'
          - '\boff-?take\b'
          - '\bcontracts?\s+for\s+difference\b'
          - '\bcapacity\s+(auction|market|solicitation)s?\b'
          - '\ball[\s-]source\b'
      - name: research
        eligible: false
        reason: funds research, not projects
        terms:
          - '\bresearch\b'                # [A] "pure research"
          - '\br\s*&\s*d\b'               # [A]
          # [A] Also hits NIH's "(Clinical Trial Not Allowed)" title suffix: the meaning is
          # inverted, the verdict is not (the notice is research funding either way).
          - '\bclinical\s+trials?\b'
          - '\bbroad\s+agency\s+announcements?\b'  # [A] the US research solicitation
          - '\bbaa\b'                     # [A]
          - '\binvestigators?\b'          # [A] NIH / DoD investigator awards
        cpv_all_in: ['73']                # [A] CPV 73 research and development services
      - name: studies_planning
        eligible: false
        reason: funds studies or planning, not projects
        terms:
          - '\bstud(y|ies)\b'             # [A]
          - '\bfeasibility\b'             # [A]
          - '\bplanning\b'                # [A]
          - '\bassessments?\b'            # [A]
          - '\baudits?\b'                 # [A]
          - '\bsurveys?\b'                # [A]
          - '\btechnical\s+assistance\b'  # [A]
          - '\badvisory\b'                # [A]
        cpv_all_in: ['71241', '7141', '90712', '793']  # [A] feasibility/advisory, urban and environmental planning, research/surveys
      - name: goods_services
        eligible: false
        reason: buys goods or services for the buyer, which suppliers bid, not projects
        terms:
          - '\bsupply\s+(of|and|&)'       # [T] tune ocds-h6vhtk-07809d "FW Supply & Deliver – LV & MV Cables"
          - '\bsupplies\b'                # [A]
          - '\bprovision\s+of\b'          # [T] tune ocds-h6vhtk-07834a "Provision of Motor Control Centres ..."
          - '\bframework\b'               # [T] both tune notices are multi-supplier framework agreements
          - '\bmaintenance\b'             # [A]
          - '\bservicing\b'               # [A]
          - '\brepairs?\b'                # [A]
          - '\bspare\s+parts\b'           # [A]
          - '\bsoftware\b'                # [A]
          - '\bconsult(ancy|ant|ants|ing)\b'  # [A]
          - "\\bowner'?s\\s+engineer\\b"  # [A]
          - '\bsupervision\b'             # [A]
