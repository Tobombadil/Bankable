# The generic bankability checklist (docs/19 §2.3; schema data/checklist/pack.schema.json).
#
# Structure and generic item names only: six folders of standard project-finance documents, each
# item tagged with one of four pillars (completeness, the fifth, counts every item). The names are
# the industry's own terms (docs/19 assumption B6). docs/18 §1.3 names 18 of the 32 and gives the
# count per folder for the rest; those 14 are standard project-finance document names chosen here,
# not copied from any other product.
#
# No guidance text lives here. Detailed content (guidance per item, per-sector variants, examples)
# is a private content pack in this same schema, loaded at deploy by
# `python -m services.projects.load_checklist --pack-url "$CHECKLIST_PACK_URL"` (decision row
# 2026-10-22). Until one is loaded, these names are what users see.
#
# Pillar by folder (docs/19 §2.3): Contracts -> counterparties; Finance, Security, Feasibility ->
# fundamentals; Permits -> regulatory and site; Legal & Corporate -> sponsor. A private pack may
# override the pillar per item. Keys are stable: projects store them, and a private pack must use them.
schema: inframation.checklist-pack/1
pack_version: generic-v1
description: Generic bankability checklist. Six folders, 32 standard project-finance documents, no guidance.
items:
  # ------------------------------------------------------------------------- Contracts (5)
  - {key: ppa, folder: contracts, pillar: counterparties, name: Power Purchase Agreement, sort_order: 10}
  - {key: offtake_agreement, folder: contracts, pillar: counterparties, name: Purchase/Offtake Agreement, sort_order: 20}
  - {key: supply_agreement, folder: contracts, pillar: counterparties, name: Supply/Feedstock Agreement, sort_order: 30}
