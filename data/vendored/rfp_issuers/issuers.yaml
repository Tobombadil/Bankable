# Curated US utility RFP issuer registry (US-303, source family us.utility_rfps).
#
# One entry per issuer: the registry the RFP connector reads. Built 2026-10-21 by the legal-compliance
# lane from the market-research candidate list (63 issuers) and a terms-of-use read of every issuer's
# governing page. docs/28-utility-rfp-registry.md explains the method, the verdict rules and the counsel
# questions; docs/13-legal-data-rights.md §3 and §6 are the policy this applies. NOT LEGAL ADVICE.
#
# Field guide
#   id                : us.rfp.<slug>; the source_id records ingested from this issuer carry
#   url               : the solicitation listing (or, where none exists, the page the RFP was found on)
#   access            : public (listing readable without login) | unverified (site refused this client)
#                       | none (no standing listing; per-cycle documents or releases only)
#   format, cadence   : page format and observed solicitation cadence (market-research lane, 2026-10-21)
#   poll              : what a connector may do; "none" means no automated request to this host
#   verdict           : cleared       = facts may be read automatically at a polite cadence and published
#                                       as derived fields with attribution and a link back
#                       link_out_only = may be read automatically to detect solicitations; publish title,
#                                       dates and link only; never copy documents
#                       manual_only   = no automated reading; a human may record title, dates and link
#                       excluded      = login, or terms that bar the listing itself (manual monitoring,
#                                       linking, derivative use); use another route (docket, permission)
#   automated_reading : allowed | not_allowed
#   publish           : derived_fields_with_attribution | title_date_link | none
#   reuse             : open | attribution | noncommercial | unknown | excluded
#                       (excluded = the terms withhold reuse of the site's content; noncommercial is the
#                       docs/13 §0 class and is publishable only while PLATFORM_POSTURE=noncommercial)
#   manifest          : the data/sources.yaml reuse/publication pair this row supports today. Nothing
#                       here is wired into data/sources.yaml; the coordinator does that.
#   basis             : the rule in docs/28 §3.2 that decided the verdict
#   terms_quote       : verbatim operative clauses from terms_url, read on read_on. Checked against the
#                       capture by the build script; an empty list means nothing could be quoted
#   robots            : robots.txt URL and what it said on read_on
#   public_records_law: named from general knowledge for public bodies; not retrieved; counsel to confirm
#   connector         : what pipeline/connectors/us_rfp reads for this row (added 2026-10-21 with the
#                       tranche-1 connector; only cleared rows with automated_reading: allowed carry one):
#                       extractor (aep_energy_rfps | news_release_index | notice_table_pdf), listing_url ({year}
#                       is the current year), issuer (the organisation name records carry), issuer_type,
#                       jurisdiction (ISO 3166-2, or US for a multi-state issuer), kind, link_only_hosts
#                       (never fetched), classify_ignore (phrases the classifier strips first) and per-run caps.
#                       A row without this block is never fetched.
#
# Re-read every terms_url at least quarterly and before any change of verdict: most of these pages say
# the issuer may change the terms at any time without notice.

version: '2026-10-21'
