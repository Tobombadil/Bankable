# Data-centre operators: which company a large-load record's own name names (docs/22 §27; docs/28 B-9).
#
# Read by `services/resolve/operators.py`, which the resolve pass runs on every store
# (`services/resolve/merge.py::resolve_organizations`, called by the scheduler's `resolve_tick` after every
# load and daily). For each live `kind = load` proposal with no sponsor, the pass reads the record's name and
# the name each active source link carries (Virginia DEQ `PLA_NAME`, EPA ICIS-Air `FACILITY_NAME`), and links
# the record to the operator below whose name it carries. Every link is a `sponsor_linked` event on the
# proposal (non-public, reversible: `services.resolve.operators.unlink`).
#
# THE EVIDENCE RULE. Precision over recall: a wrong sponsor is a false claim on a public record.
#   1. The record's name carries the operator's own name (`names`: its legal, trading or former names, as
#      whole words). The pass checks this on every match at run time: a pattern whose matched text holds
#      none of the row's names links nothing. `services/resolve/test_operators.py` checks it on every row's
#      `examples`, which are names copied from the register.
#   2. A project vehicle is linked only when its own name carries the operator's name: `QTS Richmond V LLC`
#      and `Vantage Data Centers VA41 LLC` are linked; `SI NVA05D LLC` (STACK names its Virginia vehicles
#      so), `VADATA Inc` (an Amazon vehicle), `Digital Filigree LLC` and `Quality Investment Properties
#      Suwanee, LLC` are not, because the record does not say whose they are. A shell name nobody can read
#      (`SICULUS, INC.`, `MORNING HORNET, LLC`) is left unlinked rather than guessed.
#   3. A company only. Public bodies, universities, schools, hospitals and other non-profits are not listed
#      (The World Bank, the Smithsonian, U.S. Customs and Border Protection, USGS, NASA, Dartmouth College,
#      Sentara, Inova, Kaiser Permanente), nor is any natural person: `organization` must classify as an
#      organisation under `services/personal_names.py` (tested), and the pass never links a row flagged as
#      a natural person.
#   4. A name two operators share links neither (`OPTUM C/O UNITED HEALTH GROUP`): a conflict is counted,
#      not resolved by guessing.
#   5. The link is to the operator named, at the level the name gives. A subsidiary named by the record
#      (`Amazon Data Services, Inc.`, `Northrop Grumman Systems Corporation`) is linked to the group the
#      row names (`Amazon.com, Inc.`, `Northrop Grumman Corporation`) only when the record also names the
#      group: every Amazon-named facility carries "Amazon". The record keeps its own name, so the legal
#      entity that filed is still on the page.
#
# How the organisation is found: `pipeline.normalize.org_key(organization)` over every live organisation's
# name and aliases (`services/ingest/organizations.py::org_key_multimap`), the one key the loaders and the
# merge pass use; so `Microsoft Corporation` joins an existing `MICROSOFT CORP`. If none holds the key, the
# organisation is created with type `other` and the country below.
#
# Schema:
#   operators:
#     - key           stable id of the row (snake case); recorded on every link event
#       organization  the organisation's canonical name (created if no live organisation has its org_key)
#       country       ISO 3166-1 alpha-2, used only when the organisation is created
#       names         the operator's own names: the evidence tokens of rule 1
#       patterns      optional regular expressions (case-insensitive, searched in the record's name). Absent:
#                     one pattern per name, whole words, any punctuation or none between its words
#       exclude       optional regular expression: a record name it matches is not linked by this row
#       examples      record names from the register this row must link (the guard test)
#       note          optional
#
# Built 2026-10-24 from the 582 large-load records of the public register (pulled 2026-10-23 23:16 UTC,
# docs/28 §1), by reading every name. Precision on a hand-checked seeded sample is in docs/22 §27.

version: 1
operators:
  # ------------------------------------------------------------------------------- cloud and hyperscale
  - key: amazon
    organization: Amazon.com, Inc.
    country: US
    names: [Amazon]
    examples:
      - Amazon Data Services Inc - DCA-060
      - AMAZON DATA SVCS INC PNE100
      - Amazon DCA-50
      - AMAZON COM SERVICES LLC DTB9
      - AMAZON.COM LLC - DK01
    note: >-
      Amazon files its data-centre permits under Amazon Data Services, Inc. (70 of the 75 records), and a few
      under Amazon.com Services LLC, Amazon.com LLC or the bare name. Every one names Amazon, so all are
      linked to the group. VADATA Inc. records are not: they do not name Amazon (rule 2).
  - key: microsoft
    organization: Microsoft Corporation
    country: US
    names: [Microsoft]
    examples: [Microsoft Corp - AVC17 Datacenter, MICROSOFT, MICROSOFT HOFFMAN ESTATES (CHI05) DATA CENTER]
  - key: google
    organization: Google LLC
    country: US
    names: [Google]
    examples: ['GOOGLE, INC.']
  - key: apple
    organization: Apple Inc.
    country: US
    names: [Apple]
    patterns: ['^APPLE[\W_]+INC\b']
    examples: [APPLE INC, APPLE INC.]
  - key: oracle
    organization: Oracle Corporation
    country: US
    names: [Oracle]
