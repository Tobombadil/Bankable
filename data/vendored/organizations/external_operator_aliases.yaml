# Cross-dataset operator aliases: a spelling in an *external* dataset -> the organisation this
# platform already holds (docs/22 §15 provenance convention). Loaded by
# `services/ingest/enrich.py::apply_context_features`.
#
# NOT the same file as `aliases.yaml`, and the two must not be merged:
#   * `aliases.yaml` (ownership lane) records two spellings of ONE legal entity -- a rename
#     ("Westar Energy Inc" -> "Evergy Kansas Central, Inc") or an ampersand the key cannot fold --
#     and is applied to `organization_alias`, changing who an organisation *is*. Its schema is
#     alias / canonical / source_url / retrieved_at / note.
#   * this file records that an external registry writes an operator's name differently from the
#     registry our asset came from (PHMSA files "RUBY LLC"; the EIA Atlas layer prints "Ruby
#     Pipeline LLC"). It creates no organisation and no alias row: it only tells the feature merge
#     which asset a PHMSA operator's numbers belong to. Its schema carries the external dataset's
#     id and key (`source_id`, `external_id`) and the evidence for the pair, which a rename file
#     has no use for.
# A rule here is therefore scoped to one source; a rule there is global to the entity.
#
# Why the file exists: `pipeline.normalize.org_key` (the key the resolver uses everywhere) matches
# "TALLGRASS INTERSTATE GAS TRANSMISSION, LLC" to "Tallgrass Interstate Gas Transmission" by
# itself, because it strips legal forms only. It cannot match a registry that files under a
# different name than a map layer prints -- PHMSA's "RUBY LLC" against "Ruby Pipeline LLC", or
# "COLUMBIA GULF TRANSMISSION, LLC" against "Columbia Gulf Pipeline". Those are claims about the
# world, so each is written down with its evidence instead of being inferred by a fuzzy score at
# run time.
#
# Schema, one row per (alias, organization) pair -- one external operator may name several
# platform organisations (the Atlas splits Rockies Express into three operator strings):
#   alias         : the spelling exactly as the external dataset writes it
#   organization  : the spelling the platform holds (organization.name_canonical or an alias);
#                   resolved through `org_key`, so punctuation and legal forms do not matter
#   source_id     : the `data/sources.yaml` id the alias spelling comes from
#   external_id   : that source's own key for the operator (PHMSA OPERATOR_ID)
#   evidence      : what makes the pair checkable -- the states both datasets report for it, and
#                   the mileage the external source states
#   retrieved_at  : when the external spelling was read
#
# Evidence rule applied when this file was built (2026-09-19, features lane): a pair is listed only
# when the two names share every distinctive token after abbreviation expansion (Jaccard >= 0.6 over
# non-generic tokens) AND the states the two datasets report overlap AND no second PHMSA operator
# scored as well. Pairs that failed any of the three are absent by design, not by oversight -- the
# features simply do not reach those assets. Nothing here is inferred from a name alone.

aliases:
  - alias: 'ROCKIES EXPRESS PIPELINE LLC'
    organization: 'Rockies Express Pipeline'
    source_id: us.phmsa.pipeline_operator_reports
    external_id: '32163'
    evidence:
      report_year: 2025
      onshore_transmission_miles: 1766.1
      shared_states: ['US-CO', 'US-IL', 'US-IN', 'US-KS', 'US-MO', 'US-NE', 'US-OH', 'US-WY']
    retrieved_at: '2026-09-19'
    note: >-
      Tallgrass group. Resolves on the shared organisation key already (norm_org strips the LLC);
      recorded here so the verified PHMSA spelling and operator id are in one place.
