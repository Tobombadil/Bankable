# Curated organisation alias rules (docs/22 §15.3, §16.5, §17.5; source id `curated.organization_aliases`
# in data/sources.yaml section K). Companion to `parents.yaml`, same contract: one rule per row, every
# rule cites the document it was read from, nothing is inferred from a name alone. Loaded by
# `python -m services.ingest.organizations aliases`, which writes one `organization_alias` row per rule
# (kind `filing_spelling`, confidence 1.0, the rule's own `source_url` and `retrieved_at`).
#
# Not to be confused with `external_operator_aliases.yaml` in this directory: that is the features lane's
# cross-dataset operator-name file (PHMSA/EIA-923/RFS -> the Atlas layers), with a different schema and its
# own loader in `services/ingest/enrich.py`. This file is about the identity of one legal entity; that one
# is about joining two datasets' spellings of an operator. They are not merged.
#
# Why a curated file at all. Resolution keys on `pipeline.normalize.org_key`, which since 2026-09-19 strips
# legal forms and punctuation only (docs/22 §16) -- every industry and geography word is kept, because that
# is what tells `MidAmerican Energy Co` from `MidAmerican Solar LLC`. The key therefore cannot merge:
#   - a company against its former name ("Westar Energy Inc" / "Evergy Kansas Central, Inc" -- no string
#     similarity at all), and
#   - a short spelling that differs by a content word ("Vistra Energy" / "Vistra Corp";
#     "Enable Midstream" / "Enable Midstream Partners"; "Noble Environmental" / "Noble Environmental
#     Power, LLC" -- the docs/22 §16.5 rules).
# Both kinds are spellings of one legal entity, and both are decidable from a public filing. A key loose
# enough to reach them re-merges 46.3 % distinct entities (docs/22 §16.2), so they belong here instead.
#
# A rule that attaches nothing today is kept, not deleted, and the loader reports it rather than failing.
# Measured 2026-09-20 on the dev store: "Kansas City Power & Light Co" -> "Evergy Metro" is inert because no
# organisation named Evergy Metro is loaded yet (`rules_without_organization`), and the corrected key's
# `&`/`and` fold already reaches "Wisconsin Power and Light Co" without help
# (`rules_already_one_organization`). Both rows still carry their citation, and both start doing work the
# moment a registry vintage brings the other spelling in.
#
# Schema, one row per rule:
#   alias         : the spelling to attach (matched case-insensitively, whole string, after
#                   trimming -- not a regular expression; `parents.yaml` uses patterns because a
#                   parent covers a family of subsidiaries, an alias names one entity)
#   canonical     : the organisation the alias belongs to, as `organization.name_canonical`
#   source_url    : the filing or company page the identity is read from
#   retrieved_at  : when that document was read (ISO 8601, UTC)
#   note          : what the document says, and where both spellings occur in our data
#
# Out of scope for this file: two entities that merely share a corporate family ("Entergy Corp"
# and "Entergy Power, LLC"; "AEP Renewables" and "AEP Resources Service Corp.") -- those are
# parent links (`parents.yaml` or GLEIF Level 2), not aliases. And two entities that look alike but are not
# the same company: "Public Service Co of NH" and "Public Service Co of NM" differ by one letter, own
# different plants, and must never be merged (token_sort_ratio 95 -- a similarity threshold alone
# would merge them, which is why this file is curated and cited rather than computed).

aliases:
  - alias: Wisconsin Power and Light Co
    canonical: Wisconsin Power & Light Co
    source_url: https://data.sec.gov/submissions/CIK0000107832.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0000107832, conformed name "WISCONSIN POWER & LIGHT CO", no former names --
      one registrant, and EIA-860 Schedule 4 (2025 release) spells it both ways: "Wisconsin Power
      & Light Co" on 6 plants and "Wisconsin Power and Light Co" on 1. `norm_org` gives
      WISCONSIN LIGHT and WISCONSIN AND LIGHT, so today they are two organisations.
  - alias: Kansas City Power & Light Co
    canonical: Evergy Metro
    source_url: https://data.sec.gov/submissions/CIK0000054476.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0000054476: conformed name "EVERGY METRO, INC.", formerName "KANSAS CITY POWER
      & LIGHT CO" through 2019-08-07 -- the same registrant renamed, not two companies. EIA-860
      Schedule 4 (2025) uses "Evergy Metro" (3 plants); the pre-2019 spelling is what older
      registry vintages and EPA LMOP carry ("City of St. Joseph, MO; Kansas City Power & Light"),
      so this rule attaches nothing today and prevents a split the moment such a row is loaded.
  - alias: Westar Energy Inc
    canonical: Evergy Kansas Central, Inc
    source_url: https://data.sec.gov/submissions/CIK0000054507.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0000054507: conformed name "EVERGY KANSAS CENTRAL, INC.", formerNames "WESTAR
      ENERGY INC /KS" (2002-07-01 to 2019-08-19) and "WESTERN RESOURCES INC /KS" (to 2002-06-10).
      EIA-860 Schedule 4 (2025) uses "Evergy Kansas Central, Inc" (5 plants); as above, the former
      spelling appears in older vintages.
  - alias: Western Resources Inc
    canonical: Evergy Kansas Central, Inc
    source_url: https://data.sec.gov/submissions/CIK0000054507.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: Same filing, the earlier of the two former names (through 2002-06-10).
  - alias: Vistra Energy
    canonical: Vistra Corp
    source_url: https://data.sec.gov/submissions/CIK0001692819.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0001692819: conformed name "Vistra Corp.", formerName "Vistra Energy Corp."
      through 2020-06-29 -- one registrant renamed. EIA-860 Schedule 4 (2025) spells it both ways
      ("Vistra Corp" and "Vistra Energy"); the corrected legal-form-only key keeps them apart
      because "Energy" is a content word (docs/22 §16.5), so the identity has to be stated here.
  - alias: Enable Midstream
    canonical: Enable Midstream Partners
    source_url: https://data.sec.gov/submissions/CIK0001591763.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0001591763, conformed name "Enable Midstream Partners, LP", no former names.
      The bare form is a short spelling in EIA-860 Schedule 4; "Partners" is a content word under
      the corrected key, so the two spellings are two organisations without this rule.
  - alias: Noble Environmental
    canonical: Noble Environmental Power, LLC
    source_url: https://data.sec.gov/submissions/CIK0001381415.json
    retrieved_at: '2026-09-19T21:10:00Z'
    note: >-
      SEC EDGAR CIK 0001381415, conformed name "NOBLE ENVIRONMENTAL POWER LLC", no former names.
      EIA-860 Schedule 4 carries both the short and the full spelling; "Power" is a content word,
      so the corrected key splits them.

  # Truncated registry spellings (2026-09-26, docs/22 §19). A registry that cuts a name at a fixed width
  # produces a string the key cannot equate with the full one ("TRANSMISSIO" is not a legal form). Where a
  # public document names the one legal entity the prefix belongs to, and places the asset carrying the
  # truncated string with that entity, the truncation is a spelling of that entity and belongs here. Where
  # a prefix pair is two entities ("... Corporation I" / "... II", "... Lessor II" / "... III", "X; Y" joint
  # filers) or a site suffix ("... - WACO", "... BESS"), it does not, and no rule is written. On a store
  # where the truncated string has already become its own organisation -- every store built by
  # `web/dev_up.py`, because the edge loaders run before this one -- the loader reports the rule as a
  # conflict, with the edges and proposals a merge would move, and writes nothing: moving them is a
  # `services/resolve/merge.py` merge event with a reversible `before` payload, never an alias.
  - alias: TALLGRASS INTERSTATE GAS TRANSMISSIO
    canonical: Tallgrass Interstate Gas Transmission
    source_url: https://www.sec.gov/Archives/edgar/data/1633651/000163365119000009/tge2018123110k.htm
    retrieved_at: '2026-09-26T18:05:00Z'
    note: >-
      Tallgrass Energy, LP Form 10-K for 2018, Item 1: "Tallgrass Interstate Gas Transmission, LLC
      ('TIGT'), which owns the Tallgrass Interstate Gas Transmission system ... The TIGT System includes
      the Huntsman natural gas storage facility located in Cheyenne County, Nebraska." The truncated
      string is the EIA-191 company field on exactly that field (Atlas underground storage layer, 202012
      vintage, field code 340291 "Huntsman", Cheyenne County NE); the full spelling is the Atlas pipeline
      layer's operator string. GLEIF LEI 5493001PPWSDLETMIS87 is "TALLGRASS INTERSTATE GAS TRANSMISSION,
      LLC" (previous legal name "Kinder Morgan Interstate Gas Transmission LLC"), the only entity of the
      name. The cut is upstream of the Atlas: 43 of the storage layer's 412 operator strings are exactly
      36 characters and none is longer, while the shapefile's own field width is 254, so EIA-191's company
      field is what truncates.
  - alias: Markwest Liberty Midstream & Res
    canonical: MarkWest Liberty Midstream & Resources
    source_url: https://www.sec.gov/Archives/edgar/data/1166036/000104746915001157/a2223168z10-k.htm
    retrieved_at: '2026-09-26T18:05:00Z'
    note: >-
      MarkWest Energy Partners, L.P. Form 10-K for 2014, Item 1: "We currently operate five processing
      complexes in our Marcellus segment, including: the Houston Complex ...; the Majorsville Complex ...;
      the Mobley Complex located in Wetzel County, West Virginia (the 'Mobley Complex'); the Sherwood
      Complex ...; and the Keystone Complex", the Marcellus entity being "MarkWest Liberty Midstream &
      Resources, L.L.C. ('MarkWest Liberty Midstream')" in the same filing and, in MPLX LP's 10-K for 2018
      (.../data/1552000/000155200019000006/mplx-20181231x10k.htm), one of the "entities that operate in
      the Marcellus region". The truncated string is the owner field of the Atlas processing plant layer
      (2017_v2) on the Mobley Plant, Wetzel County WV, alone; the same field spells the same owner in full
      on Houston, Majorsville, Sherwood, Keystone and Cadiz. GLEIF holds one entity with this prefix,
      549300E43NX2PKICX492 "MarkWest Liberty Midstream & Resources, L.L.C." (registration LAPSED; the
      legal name is what is read, not the registration), and EDGAR's only other "MarkWest Liberty ..."
      registrant, MarkWest Liberty Gas Gathering, L.L.C., is excluded by the prefix. The 32-character cut
      is this row's alone: the field's longest value in the layer is 54 characters.
  - alias: Green Knight Economic Development Corpor
    canonical: Green Knight Economic Development Corporation
    source_url: https://gkedc.org/energy-center/
    retrieved_at: '2026-09-26T18:05:00Z'
    note: >-
      The corporation's own pages: "Green Knight Economic Development Corporation (GKEDC)" ... "The
      facility opened in March 2001" ... "Waste Management is currently contracted to operate and maintain
      the facility under the guidance of the GKEDC Board of Directors" (energy-center), and "a non-profit
      501(c)(3) corporation ... formed in March 1999" which "generates revenues to implement its mission by
      operating the Green Knight Energy Center in Plainfield Township, PA" at Grand Central Sanitary
      Landfill (https://gkedc.org/about/). The truncated string is EIA-860 Schedule 4's owner (100%) of
      plant 55765 "Green Knight Energy Center", Northampton County PA, whose EIA-860M operator is "Waste
      Management Inc" -- the arrangement the page describes; the full spelling is EPA LMOP's operator and
      owner of "Project #1 - Grand Central SLF", Northampton County PA. The cut is at 40 characters. EIA's
      860M entity names pile up at exactly 40 (199 rows, against 115 at 39 and 13 at 41); the Schedule 4
      owner names this string sits in do not (31 at 40, 40 at 41), so the width is EIA's somewhere
      upstream but which field cut it is not established. The identity is. No LEI exists for the
      corporation.
