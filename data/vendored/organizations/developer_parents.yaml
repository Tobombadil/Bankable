# Curated parent links for the developer and utility groups most active in the US and GB queues
# (docs/22 §24; source id `curated.organization_parents` in data/sources.yaml section K, the same source
# `parents.yaml` writes under). Loaded by `services/ingest/organizations.py::load_group_parents`
# (`python -m services.ingest.organizations groups`), which every context load runs
# (`services/ingest/context_layers.py::load_organization_graph`). The file is committed with the code and
# every image copies `data/vendored`, so a server seeded with no local data root loads it too.
#
# Why it exists. A developer files under many legal names: NextEra under 13 organisation records, none
# linked to a parent, so `/organizations/nextera-energy-inc` showed no proposals at all (measured
# 2026-10-11). Each row here links one of those records to the group's parent; the company page then reads
# the group (`scope=all`, its default) and names the subsidiary that filed each proposal.
#
# THE EVIDENCE RULE. Precision over recall: a wrong parent is a false claim on a public record.
#   1. Name. The child's registered name carries one of the parent's own names (`parent_names`: legal,
#      trading or former names of the parent itself), as whole words. `Engie` is not in
#      `DENGIE MARSHES WIND FARM LIMITED`; `Constellation` is in `HIGH CONSTELLATION WINDFARM LIMITED`,
#      which is why rule 2 is also required.
#   2. The parent's own public evidence confirms the link. One of:
#        sec_ex21      the parent's latest 10-K Exhibit 21 on EDGAR (or Exhibit 8, its 20-F counterpart).
#                      `quote` is the row that names the child. A child the exhibit names passes even when
#                      its name does not carry the parent's (Xcel's Public Service Company of Colorado).
#        gleif         a GLEIF Level 2 record whose parent is the parent (CC0). `lei` is the child's LEI.
#        company_site  the parent's own published document: an annual report's subsidiary list, or a page
#                      that names the child's project. `quote` is the passage.
#   3. Where the parent publishes a COMPLETE subsidiary list (AES and NRG Exhibit 21, SSE's annual report
#      A3.1.1, RWE's HGB list of shareholdings), the child must be on it. A name that carries the parent's
#      but is missing from a complete list is declined: it was sold, renamed or dissolved.
#   4. Where the parent lists only principal subsidiaries (NextEra's Exhibit 21 names five and states that
#      NextEra Energy Resources "includes 2,323 subsidiaries that operate in the United States"), a group
#      operating, holding or development company whose name carries the parent's may rest on that
#      statement. A PROJECT company never may: a developer sells projects with their companies, so
#      `LIGHTSOURCE SPV 204 LIMITED` or a `Flat Hill Solar LLC` is linked only when a document names it or
#      its project.
#   `services/ingest/test_group_parents.py` enforces 1 and 2 on every row (the precision guard), and the loader
#   refuses to load a file in which any row fails them.
#
# Every edge is one hop to the group parent whose document was read, as in `parents.yaml`; intermediate
# holding companies are not created. No `as_of` (an Exhibit 21 dates the list, not the start of the
# ownership) and no share: `organization.parent_share_pct` stays NULL even where a list states 51 %.
#
# Schema:
#   groups:
#     - parent          the parent's name; reuses the organisation `org_key` already resolves it to
#       parent_country  ISO 3166-1 alpha-2, used only if the loader has to create the parent
#       parent_names    the parent's own names: the guard's tokens
#       note            what the parent's evidence says, and what was declined and why
#       children:
#         - name          the child organisation, matched by `org_key` over names and aliases
#           evidence      sec_ex21 | gleif | company_site
#           source_url    the document
#           retrieved_at  when it was read (UTC)
#           quote         the passage that names the child (optional for a group statement)
#           lei           the child's LEI (gleif only)
#           note          optional
#
# Retrieval. EDGAR with a declared User-Agent (SEC fair access), GLEIF's public API, and the companies'
# own sites, robots.txt honoured. No private aggregator was read. Sites behind a bot challenge (orsted.com,
# bp.com, the EDF registration document) were not read and those groups are not here (docs/22 §24.4).

