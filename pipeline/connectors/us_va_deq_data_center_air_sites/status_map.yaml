# us.va.deq.data_center_air_sites: DEQ "Air Sites" AIR_OP_STATUS -> proposal lifecycle (docs/21 §7.1).
# `field: Status` is the literal pipeline.normalize.harmonise_status recognises; the connector passes the raw
# AIR_OP_STATUS under ctx["status_raw"], the convention every other connector's status map follows.
# Values measured 2026-09-28 across the whole layer (4,043 rows): Operating, Temporarily Shutdown, Seasonal
# (STATUS_GROUP Active) and Planned, Under Construction (STATUS_GROUP Planned). Anything else is unmapped ->
# unknown + a DQ vocabulary warning, never coerced.
version: 1
updated: 2026-09-28
canonical_states: [unknown, announced, filed, studied, permitted, contracted, under_construction, built, withdrawn, cancelled]
sources:
  va_deq_air_sites:
    field: Status
    map:
      Planned: filed
      Under Construction: under_construction
      Operating: built
      Seasonal: built
      Temporarily Shutdown: built
    caveats:
      - Planned maps to filed, not permitted. DEQ creates the air-site record (and its registration
        number) when an application or registration arrives; the layer does not say whether the
        minor-NSR permit has been issued, so the conservative claim is "an air-permit filing exists".
      - Temporarily Shutdown and Seasonal are states of a built facility; the raw value is kept in
        status_raw and shown, as the ISO maps do for "On Hold".
      - The layer carries only active and planned sites, so a site that closes disappears from it;
        the diff records that as a `removed` event (docs/20 §3.3), which is not evidence of
        cancellation for a built data centre.
