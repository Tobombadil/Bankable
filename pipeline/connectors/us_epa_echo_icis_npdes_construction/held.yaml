# us.epa.echo.icis_npdes_construction: permits whose sites the connector holds back (connector.HELD_PATH,
# docs/08 §4.1 "Built"). Reviewed by hand against the store's EPA ICIS-Air and Virginia DEQ frames of 2026-10-09
# on the ECHO file of 2026-10-18.
#   duplicate: the site is a campus another source already holds (within 300 m, or farther with the held record's
#     own building code or name), and pipeline/resolve.py does not merge the two, so they would be published as
#     two records, often in contradicting states. Point nearness alone never merges (docs/22 §28), and what still
#     separates the 34 duplicates below is their names: 32 score under 70 against the held record (rule N;
#     "APPLE DATA CENTER" beside the developer's "PLATYPUS DEVELOPMENT" at one point), and LYH10 and LYH03 lie
#     709 m and 1,122 m from theirs, beyond the 500 m within which differently named records are compared.
#   bridge: the resolver joins the site to held records of distinct campuses (a wrong merge).
# Release an entry when the resolver merges it with its held record and nothing else (the check of docs/22 §28.5).
# A site is held when any of its permits is listed;
# `held_record` is the record it duplicates (or, for a bridge, the one of its own campus), `m` the distance between
# their points, `uncertain` a judgement the reviewer could not settle from names and points.
# `released` lists the entries released on 2026-10-24 by rule L (lane resolver-veto): each was checked with the
# hold list emptied, against ICIS-Air and Virginia DEQ (2026-10-09), Loudoun (live layer, 2026-10-24) and the FAA
# frame (2026-10-24), with and without FAA: the site shares one cluster with its held record, and every other
# member is labelled the same site (data/eval/load_pair_labels.csv) or shares the held record's registry id.
