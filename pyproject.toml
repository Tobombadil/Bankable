# Tooling configuration for docs/04 §3 (E-3, E-5, E-6). Dependency pinning with hashes is a
# separate Sprint 1 task; requirements.txt remains the install list until then.
[project]
name = "bankable"
version = "0.2.0"
description = "Energy and infrastructure proposal/opportunity intelligence pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "DTZ", "T20", "RUF"]
# RUF001-003: verbatim source text, licence quotes and doc references carry en dashes.
# N818: docs/04 E-17 names the typed exceptions per layer (ConnectorError, ParseError,
# GateViolation, ...); the standard's spelling wins over the suffix convention.
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]  # asserts are the point; test fixtures use literal test credentials
"pipeline/connectors/**/test_connector.py" = ["S101"]
"pipeline/context/test_*.py" = ["S101"]      # asserts are the point (docs/04 E-6)
"infra/**/test_*.py" = ["S101"]              # same reason; was a CI-only --extend flag, so `ruff check .` was never green bare
"conftest.py" = ["E402"]                    # sys.path must be set before the pipeline imports
"pipeline/normalize.py" = ["T20"]           # prototype CLI reporting, superseded by the runner
"pipeline/resolve.py" = ["T20"]
"pipeline/diff.py" = ["T20"]
"pipeline/link_dockets.py" = ["T20"]        # CLI reporting script, same convention as resolve.py
"scripts/check_commit_messages.py" = ["T20"]  # commit-msg hook / CI audit: prints its verdict to the caller
"scripts/probe_sources.py" = ["T20"]         # Phase 0 probe CLI (docs/00-PLAN.md repo layout)
"scripts/measure_slippage.py" = ["T20"]      # measurement CLI: its whole output is the printed table
"api/check_story_coverage.py" = ["T20"]      # CI reporting script; prints the story -> operation map
"web/build_data.py" = ["T20"]                # CLI summary line (main()), not application logging
"web/data_ref/build_basemap_fallback.py" = ["T20"]  # CLI summary line (main()), not application logging
"web/test_*.py" = ["S101", "S105", "S106"]    # asserts are the point; literal test credentials
"web/test_e2e.py" = ["S101", "T20"]          # asserts are the point; prints screenshot paths
"services/**/test_*.py" = ["S101"]           # asserts are the point (docs/04 E-6)
"services/api/conftest.py" = ["S101"]
"services/db/migrations/env.py" = ["E402"]   # sys.path must be set before the services import
"services/api/app.py" = ["B008"]             # FastAPI's `Depends(...)` default-argument idiom
"services/api/records.py" = ["B008"]         # FastAPI's `Depends(...)` default-argument idiom
"services/social/__main__.py" = ["T20"]      # CLI reporting (draft/review/dry-run/report output), same convention as pipeline/diff.py

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "web", "services"]
strict = true
# Test modules use pytest fixtures whose types are supplied by the plugin, not annotations;
# they are covered by the suite itself (docs/04 E-6), not by the strict type gate.
exclude = [
    "test_connector\\.py$",
    "web/test_.*\\.py$",
    "services/.*/test_.*\\.py$",
    "pipeline/context/test_.*\\.py$",
    "services/api/conftest\\.py$",
    "services/db/migrations/versions/.*\\.py$",  # Alembic op.* calls have no useful stubs
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "openpyxl.*", "requests.*", "geoalchemy2.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Prototype modules from the Phase 2 evaluation; typed in the Sprint 2 store/resolve work.
module = ["pipeline.normalize", "pipeline.resolve", "pipeline.diff"]
ignore_errors = true

[tool.pytest.ini_options]
# One definition of "the suite" (audit QA-6): a bare `pytest` runs the core suite, the same paths as
# `make test-core` and CI's `test-core` + `perf` jobs. `web/` is its own suite (`make test-web`, CI
# `test-web`) and is always named explicitly, never collected with core (ci.yml header note).
testpaths = ["tests", "pipeline", "services", "infra"]
# -rs names every skip and its reason in the log (audit QA-5); --strict-markers turns a typo'd
# marker into an error instead of a silently unselected test.
addopts = "-q -rs --strict-markers"
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
markers = [
    "latency: wall-clock budget test; runs serially without coverage (`make test-perf`, CI `perf` job), deselected from the parallel coverage run. Applied by node id in conftest.py::LATENCY_TESTS.",
    "network: the test may open a non-loopback connection; the conftest.py socket guard lets it through. Never in CI's blocking jobs.",
    "production_argon2: run with the production Argon2 parameters instead of conftest.py's cheap test hasher.",
]

[tool.coverage.run]
# Production code only (audit QA-7): test modules and fixtures are excluded, so the figure is what the
# 80 % floor (docs/04 E-7) is about. `relative_files` lets the core and web jobs' data combine on
# another runner (ci.yml `coverage` job).
branch = true
relative_files = true
source = ["pipeline", "services", "infra", "web"]
omit = ["*/test_*.py", "*/conftest.py", "tests/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
