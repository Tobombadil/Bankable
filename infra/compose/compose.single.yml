# One host (the private beta, docs/64): apply after compose.prod.yml, as infra/scripts/deploy.sh does
# when it is given APP_HOST alone:
#
#   cd /opt/infraque/compose && IMAGE_TAG=<tag> INFRAQUE_ENV_FILE=/opt/infraque/secrets/.env \
#     docker compose -f docker-compose.yml -f compose.prod.yml -f compose.single.yml \
#       --env-file /opt/infraque/secrets/.env up -d
#
# What changes against the three-VM topology (docs/60 §2):
# - Postgres runs here, the base file's `local`-profile PostGIS container on its named volume, instead
#   of a managed provider. DATABASE_URL names it: postgresql+psycopg://infraque:<POSTGRES_PASSWORD>@postgres:5432/infraque.
#   Its port stays on the host's loopback only (the base file's 127.0.0.1:5432), where the nightly
#   backup (infra/scripts/backup.sh, run by systemd on the host) reaches it; the firewall allows
#   only 22/80/443 in any case (infra/terraform main.tf `hcloud_firewall.web`).
# - One api and one worker replica: the measured peaks (api 606-638 MB, docs/60 §2) and the
#   limits below fit a 4 vCPU / 8 GB VM with headroom: 1 + 1 + 0.75 + 0.25 + 1 + 0.25 GB = 4.25 GB.
# - No browser-worker: no implemented source fetches through a browser (data/sources.yaml
#   `egress: browser` appears only on gated or unimplemented entries). `--profile browser` starts it.
#   The worker takes its `fetch_browser` queue instead (below).
# - The connector data root stays the `connector_data` volume: fetch and load run on this host, so
#   SNAPSHOT_STORE may be `local` (deploy.sh allows it only here). The api mounts it read-only (below).
#
# `!override` / `!reset` are merge directives, as in compose.prod.yml; infra/test_compose.py renders
# the three files together.

services:
  postgres:
    profiles: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for the single-host database (docs/64)}
    shm_size: "256mb"
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    depends_on: !override
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    # The worker's data root, read-only, at the same INFRAQUE_DATA_DIR (set in the image): the files the
    # monthly context_build pulls are read by the api too, the site finder's parcel outlines
    # (services/context_sample/parcels.py), the FEMA flood pieces of a band and the prospect sampler of
    # GET /v1/context/sample. Without it the api's directory was the image's empty one, so none of them
    # reached it (docs/25 "Prospecting layers" item 7). The api never writes there; the three-VM topology
    # shares no volume between its VMs and has no such mount.
    volumes:
      - connector_data:/var/lib/infraque/data:ro

  scheduler:
    depends_on: !override
      postgres:
        condition: service_healthy

  worker:
    depends_on: !override
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    # 3 GB on the single host (base 1 GB): the site finder's Texas run peaks at 1.2 GB inside a job
    # (docs/25 §7), and `site_finder_refresh` refuses to start below 2 GiB (infra/scheduler/jobs.py
    # SITE_FINDER_MIN_MEMORY_BYTES) with WORKER_CONCURRENCY 2. The limits then sum to 6.25 GB of 8.
    mem_limit: 3g
    # The base file's queues plus `fetch_browser`. The schedule routes `access: js_app` sources there
    # (infra/scheduler/cadence.py queue_for_source), and with no browser-worker nothing consumed them:
    # on 2026-10-20 the 03:07 daily tick's ISO-NE and BLM ePlanning jobs waited for hours, and
    # /v1/health queue_age_seconds climbed with them. None of those sources has a connector yet, so
    # each run fails at once and is recorded like any other unimplemented source.
    command: ["python", "-m", "infra.entrypoint", "worker", "--queues", "fetch,diff,normalise,resolve,alert,post_draft,publish_post,sor_sync,webhook,audit,fetch_browser"]

  browser-worker:
    profiles: ["browser"]
