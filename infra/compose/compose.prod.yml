# Production overrides (docs/04 O-1 `production`; ADR 0005). Apply together with the base file, as
# infra/scripts/deploy.sh does on each VM:
#
#   cd /opt/infraque/compose && IMAGE_TAG=<tag> INFRAQUE_ENV_FILE=/opt/infraque/secrets/.env \
#     docker compose -f docker-compose.yml -f compose.prod.yml --env-file /opt/infraque/secrets/.env up -d
#
# The `local` profile's postgres service is never activated here — DATABASE_URL points at the
# managed Postgres provider instead (ADR 0003; docs/20 §4.4). Caddy terminates TLS and is the only
# service with a published port; every VM firewall (infra/terraform) blocks everything else from
# the public internet.
#
# `!reset` / `!override` appear only in this override file (they are merge directives; the base file
# must stand on its own — infra/test_compose.py checks both). The env file is `!override`n rather
# than merged so production has exactly one secrets source and fails to start when it is missing.
#
# Staging uses this file too (deploy.sh applies it for both), so nothing here names an environment:
# `ENVIRONMENT` comes from the env file, where deploy.sh writes the environment it was invoked for
# (devops audit 2026-09-30 F3; before, every service here said `production`). The `:?` forms below
# make `docker compose` refuse to render, and so refuse to start anything, when a required
# configuration key is missing or empty; infra/sops/secrets.example.plain.yaml lists them all and
# deploy.sh checks the same list before it touches a host.

x-required-env: &required-env
  ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be staging or production (deploy.sh writes it into the env file)}
  BANKABLE_DOMAIN: ${DOMAIN:?DOMAIN must be the registered apex domain (infra/sops/secrets.example.plain.yaml)}
  PLATFORM_POSTURE: ${PLATFORM_POSTURE:?PLATFORM_POSTURE must be commercial or noncommercial (docs/60 5.1)}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be the registered apex domain}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be staging or production}
    networks:
      default:
        # Fixed, outside the dynamic range below, because api and web believe X-Forwarded-For from
        # this one address only (FORWARDED_ALLOW_IPS; infra/entrypoint.py; devops audit F1).
        ipv4_address: 172.30.53.2
    depends_on:
      - api
      - web
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    ports: !reset [] # no direct publish; only Caddy is public (docs/20 §11)
    depends_on: !override {} # DATABASE_URL points at managed Postgres, not the `local`-profile container
    env_file: !override
      - path: ${INFRAQUE_ENV_FILE:-/opt/infraque/secrets/.env}
        required: true
    environment:
      <<: *required-env
      FORWARDED_ALLOW_IPS: 172.30.53.2 # Caddy only; see its `networks:` above
      # The session cookie is minted here for a login web relays; web reaches api over plain HTTP
      # inside the network, so the scheme alone would leave `Secure` off (services/api/auth_routes.py).
      SESSION_COOKIE_SECURE: "true"
      # One uvicorn process per container; the service scales by replicas. Measured 2026-09-30 on
      # the full dev store (devops audit F4 and its re-run): 2 workers peaked at 1,182 MB against
      # this 1 GB limit (563 + 590 MB, each holding its own geo and asset indexes); 1 worker
      # peaked at 606 MB after one round of the same traffic and 638 MB after two (docs/60 §2).
      WEB_CONCURRENCY: "1"
    deploy:
      replicas: 2 # docs/20 §4.1
    mem_limit: 1g
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    ports: !reset []
    env_file: !override
      - path: ${INFRAQUE_ENV_FILE:-/opt/infraque/secrets/.env}
        required: true
    environment:
      <<: *required-env
      FORWARDED_ALLOW_IPS: 172.30.53.2 # Caddy only; the visitor's address is forwarded to api from here
      MAP_TILE_URL: ${MAP_TILE_URL:?MAP_TILE_URL must be set; the OSM fallback is dev-only (docs/40 2.7)}
    mem_limit: 768m
    # depends_on: [api] is kept from the base file — that dependency has no profile and is fine as-is.
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  scheduler:
    depends_on: !override {}
    env_file: !override
      - path: ${INFRAQUE_ENV_FILE:-/opt/infraque/secrets/.env}
        required: true
    environment:
      <<: *required-env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    depends_on: !override {}
    env_file: !override
      - path: ${INFRAQUE_ENV_FILE:-/opt/infraque/secrets/.env}
        required: true
    environment:
      <<: *required-env
    mem_limit: 1g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  browser-worker:
    depends_on: !override {}
    env_file: !override
      - path: ${INFRAQUE_ENV_FILE:-/opt/infraque/secrets/.env}
        required: true
    environment:
      <<: *required-env
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        # Pinned so Caddy's address is known in advance. Containers get addresses from ip_range
        # only, so none can take .2 before Caddy starts. Outside Cloudflare's 172.64.0.0/13.
        - subnet: 172.30.53.0/24
          ip_range: 172.30.53.128/25

volumes:
  caddy_data:
  caddy_config:
