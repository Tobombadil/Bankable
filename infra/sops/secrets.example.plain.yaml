# EVERY KEY a staging or production secrets file carries: the template for
# `sops infra/sops/secrets.<staging|production>.enc.yaml` (docs/40 §3 step 3; docs/60 §5).
# Every value below is a placeholder. Never put a real value in this file.
#
# deploy.sh decrypts the environment's file to KEY=VALUE lines, and that one file is both
# Compose's interpolation source and every container's env_file (docs/60 §5). So non-secret
# configuration lives here too: there is no other channel to the hosts. Each key is marked:
#
#   required  deploy.sh refuses to start when it is empty or missing (its REQUIRED_KEYS list;
#             infra/test_scripts.py keeps the two identical), and compose.prod.yml refuses to
#             render without the ones it interpolates. Added 2026-09-30 after the devops audit
#             (F3) found a file built from the old documented list took Caddy down and switched
#             the platform posture to `commercial` without an error.
#   optional  the feature it feeds is off or dry-run without it.
#   secret    a credential: rotate per docs/60 §10.5.
#   config    not a credential, but still per environment.
#
# ENVIRONMENT is not listed: deploy.sh writes it from its own argument (staging | production) and
# refuses a file whose ENVIRONMENT line disagrees.

# --- identity and configuration --------------------------------------------------------------------
DOMAIN: example.com # required, config. Registered apex; Caddy serves {DOMAIN} or staging.{DOMAIN} (infra/compose/Caddyfile)
PLATFORM_POSTURE: noncommercial # required, config. commercial | noncommercial (docs/26; docs/60 §5.1); anything else is refused
MAP_TILE_URL: https://tiles.example.com/basemap.pmtiles # required, config. docs/40 §2.7; the OSM fallback is dev-only
PRODUCT_NAME: Infraque # required, config. Automation disclosure and email footers (services/social/editorial.py)
PRODUCT_URL: https://example.com # required, config. Must match DOMAIN
PRODUCT_CONTACT_EMAIL: hello@example.com # required, config
SENDER_LEGAL_NAME: Replace Me LLC # required, config. CAN-SPAM sender line; production refuses to send alerts without it (services/alerts/mail.py)
SENDER_POSTAL_ADDRESS: 1 Replace Me St, City, ST 00000 # required, config

SITE_ACCESS: open # optional, config. open | basic: basic puts one shared login in front of every host except /webhooks/* and health (Caddyfile gate_basic, docs/64)
SITE_ACCESS_USER: "" # optional, config. Required by deploy.sh when SITE_ACCESS=basic
SITE_ACCESS_HASH: "" # optional, secret. Required when SITE_ACCESS=basic: caddy hash-password --plaintext '<password>' | base64 -w0
CSP_MODE: report # optional, config. report | enforce: Content-Security-Policy-Report-Only or enforced (Caddyfile, docs/64 §5)

# --- application secrets ---------------------------------------------------------------------------
SESSION_SECRET: replace-me-with-48-random-url-safe-characters-min-32 # required, secret. >= 32 chars (services/api/auth.py)
API_INTERNAL_TOKEN: replace-me-random-shared-by-api-and-web # required, secret. web's service identity; also carries X-Visitor-IP (services/api/client_ip.py)
AUDIT_HASH_PEPPER: replace-me-random # required, secret. Production raises at the first erasure without it (services/api/audit.py)

# --- database and object storage ---------------------------------------------------------------------
DATABASE_URL: postgresql+psycopg://user:replace-me@host.example.com:5432/infraque # required, secret. Managed Postgres (ADR 0003)
SNAPSHOT_STORE: s3 # required, config. Must be s3 outside dev: fetch and load run on different hosts (docs/60 §5); local also works with SINGLE_HOST=1 (docs/64)
R2_ACCOUNT_ID: replace-me # required, config
R2_BUCKET: replace-me-staging # required, config. tofu output: ${r2_bucket_name}-${environment}
R2_ACCESS_KEY_ID: replace-me # required, secret
R2_SECRET_ACCESS_KEY: replace-me # required, secret
SNAPSHOT_STORE_PREFIX: data/ # optional, config. Default data/
R2_ENDPOINT: "" # optional, config. Override of https://<account>.r2.cloudflarestorage.com
POSTGRES_PASSWORD: "" # optional, secret. SINGLE_HOST=1 only (compose.single.yml, docs/64): the in-stack database's password, URL-safe; deploy.sh then requires DATABASE_URL=postgresql+psycopg://infraque:<it>@postgres:5432/infraque

# --- observability -------------------------------------------------------------------------------------
SENTRY_DSN: "" # optional, secret. Unset: no error tracking (infra/observability.py)
GRAFANA_CLOUD_API_KEY: "" # optional, secret
LOG_LEVEL: info # optional, config

# --- email, CRM, billing, captcha ----------------------------------------------------------------------
RESEND_API_KEY: "" # optional, secret. Unset: email dry-runs
ATTIO_API_KEY: "" # optional, secret. docs/34 §6
ATTIO_WEBHOOK_SECRET: "" # optional, secret
ATTIO_OBJECT_IDS: "" # optional, config
STRIPE_SECRET_KEY: "" # optional, secret. Checkout is off under PLATFORM_POSTURE=noncommercial (docs/26 §3)
STRIPE_WEBHOOK_SECRET: "" # optional, secret
STRIPE_PRICE_PRO: "" # optional, config
STRIPE_PRICE_TEAM: "" # optional, config
STRIPE_PRICE_API: "" # optional, config
STRIPE_PRICE_ENTERPRISE: "" # optional, config
TURNSTILE_SECRET_KEY: "" # optional, secret. Unset: intake captcha tokens accepted unverified (docs/60 §5)
TURNSTILE_SITE_KEY: "" # optional, config

# --- social and sources --------------------------------------------------------------------------------
BSKY_HANDLE: "" # optional, config. docs/32 §2
BSKY_APP_PASSWORD: "" # optional, secret
FCC_BDC_USERNAME: "" # optional, config. docs/25 §4
FCC_BDC_API_TOKEN: "" # optional, secret
MODEL_PROVIDER_API_KEY: "" # optional, secret. Nothing reads it until services/modelgw exists (docs/60 §11 item 5)

# --- backups -------------------------------------------------------------------------------------------
BACKUP_RETENTION_DAYS: "35" # optional, config. infra/scripts/backup.sh
