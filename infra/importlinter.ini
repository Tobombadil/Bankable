# import-linter contracts for docs/04 E-2: "pipeline/* forbidden from importing services/api";
# "anything but services/modelgw importing a model-provider SDK" (docs/20 §4.5); "anything but
# services/sor/adapters importing a CRM or billing SDK" (ADR 0006).
#
# Kept under infra/ (`lint-imports --config infra/importlinter.ini`) rather than a root
# `.importlinter` file or a `pyproject.toml` section: this task's write scope is infra/,
# .github/workflows/, docs/60-*.md, docs/adr/0005 and the top-level Makefile only. Whoever owns
# pyproject.toml should fold this in there once it exists, at which point `lint-imports` picks it
# up with no flag needed and this file can be deleted.
#
# No SDK-import contracts (services/modelgw, services/sor/adapters) are enabled yet: neither
# services/modelgw nor a model-provider/CRM SDK dependency exists in requirements.txt this sprint
# (docs/60-deployment.md §11 item 5), so a contract naming them would either pass vacuously or
# fail immediately for an unrelated reason (the module not existing). Add them the sprint those
# packages land, per E-2's own list.

[importlinter]
root_packages =
    pipeline
    services
    web

[importlinter:contract:pipeline-does-not-import-the-api-service]
name = pipeline must not import services.api (docs/20 §2 layering)
type = forbidden
source_modules =
    pipeline
forbidden_modules =
    services.api

# Sprint 3 (ADR 0006, docs/20 §9): the vendor adapters are reachable only through the ports in
# services/sor (their `wiring.py` providers) — no route, worker, page or pipeline step may import
# the Attio or Stripe adapter module directly. The routers in services.crm / services.billing are
# port consumers like any other and are not restricted.
[importlinter:contract:vendor-adapters-only-behind-the-ports]
name = only services.sor may import the CRM and billing adapters (ADR 0006)
allow_indirect_imports = True
type = forbidden
source_modules =
    pipeline
    web
    services.api
    services.alerts
    services.ingest
    services.resolve
    services.social
forbidden_modules =
    services.crm.attio
    services.billing.stripe

# 2026-09-26 (docs/42-backend-review-2026-09-26.md §3, lane L6): the layering the review measured, locked in.
# `web` reads the store through the API and never through the ingest, resolve or ORM layers; the three
# named exceptions are the composition roots that build the local database (`web.dev_up`,
# `web.data_loading`) and the admin records page's vocabulary import (`web.admin.records`). They are
# today's only importers, so this contract extends the rules without relaxing anything.
[importlinter:contract:web-reads-through-the-api]
name = web must not import services.ingest, services.resolve or services.db directly (docs/42 §3)
allow_indirect_imports = True
type = forbidden
source_modules =
    web
forbidden_modules =
    services.ingest
    services.resolve
    services.db
ignore_imports =
    web.dev_up -> services.ingest.*
    web.dev_up -> services.db.*
    web.data_loading -> services.ingest.*
    web.data_loading -> services.db.*
    web.admin.records -> services.db.*
    # Test modules under web/ wire a SQLite session and rows directly, or patch a loader; that is fixture
    # plumbing, not the site reading the store. A wildcard cannot stand for `test_*`, so they are listed.
    web.test_admin_engagement -> services.db.*
    web.test_admin_ops -> services.db.*
    web.test_admin_people -> services.db.*
    web.test_admin_posts -> services.db.*
    web.test_admin_records -> services.db.*
    web.test_admin_shell -> services.db.*
    web.test_admin_sources -> services.db.*
    web.test_admin_tasks -> services.db.*
    web.test_auth -> services.db.*
    web.test_dev_up -> services.db.*
    web.test_e2e -> services.db.*
    web.test_e2e_companies -> services.db.*
    web.test_e2e_companies -> services.ingest.*
    web.test_default_view -> services.db.*
    web.test_coverage_statement -> services.db.*
    web.test_csp_browser -> services.db.*
    web.test_legal -> services.db.*
    web.test_pricing -> services.db.*
    web.test_admin_records -> services.resolve.*
    web.test_interconnection_points -> services.db.*
    web.test_interconnection_points -> services.ingest.*
    web.test_source_labels -> services.ingest.*

# The ingest and resolve layers had zero edges into services.api when measured; this keeps it so.
[importlinter:contract:ingest-and-resolve-do-not-import-the-api]
name = services.ingest and services.resolve must not import services.api (docs/42 §3)
type = forbidden
source_modules =
    services.ingest
    services.resolve
forbidden_modules =
    services.api

# 2026-10-22 (docs/19 §5.2 item 1; ADR 0009 decision 2; lane p1-core): private projects never enter a
# public path. Three contracts, one rule, each checking direct imports (like the contracts above):
# the composition roots (`services.api.app`, which mounts the private router, and `web.api_client`,
# which mounts the app in process) reach everything, and that is wiring, not a public path reading
# private rows, so indirect chains through them must stay allowed.
#
# 1. `private-projects-isolated`: the public read paths, the alert, social, matching and CRM
#    services, the pipeline and the whole site (web reads through the API only) import neither
#    `services.projects` nor the three modules docs/19 §5.2 lets read it (`services.api.my_projects`,
#    which will hold `resolve_link` and the prefill helpers, `services.api.account_erasure` and
#    `services.retention`).
# 2. `private-projects-named-importers`: nothing but those three (and the package itself) imports
#    `services.projects`, so a helper module cannot become a fourth door.
# 3. `private-projects-importers-named`: nothing but the router mount, the account routes that erase
#    a user, retention itself and the private routes' test imports `services.api.account_erasure` or
#    `services.retention` (and `services.api.my_projects`, once it exists), so a helper cannot
#    re-export them to a public path.
#
# What stays possible: a public path importing a composition root (`services.api.app`). Nothing does,
# and `services/projects/test_isolation_contract.py` runs these contracts against a scratch package
# tree to show each one catches the imports it names.
[importlinter:contract:private-projects-isolated]
name = public read paths, alerts, social, matching, CRM, pipeline and web must not import services.projects or the modules that read it (docs/19 §5.2)
allow_indirect_imports = True
type = forbidden
source_modules =
    pipeline
    web
    services.api.visibility
    services.api.listing
    services.api.geo
    services.api.feeds
    services.api.records
    services.api.matches
    services.api.serialize
    services.api.ui_events
    services.alerts
    services.social
    services.match
    services.crm
forbidden_modules =
    services.projects
    services.api.my_projects
    services.api.account_erasure
    services.retention

# The importers docs/19 §5.2 allows, and the private routes' own tests. `as_packages = False` with
# explicit wildcards, because `services.api.my_projects` and its test arrive with lane P2 and a package
# expression must name a module that already exists; a plain module name need not.
[importlinter:contract:private-projects-named-importers]
name = only services.api.my_projects, services.api.account_erasure and services.retention may import services.projects (docs/19 §5.2)
type = protected
as_packages = False
protected_modules =
    services.projects
    services.projects.**
allowed_importers =
    services.projects
    services.projects.**
    services.api.my_projects
    services.api.test_my_projects
    services.api.account_erasure
    services.retention
    services.retention.**

# The modules allowed to read private projects are themselves imported only by the router mount
# (`services.api.app`), the two account routes that erase a user (`services.api.auth_routes`,
# `services.api.admin_people`), the retention package and the private routes' own test. The
# scheduler (`infra.scheduler.jobs`) and `tests/` sit outside the root packages and are not checked.
# A protected module must exist, so `services.api.my_projects` joined `protected_modules` with lane P2,
# which added it; `test_isolation_contract.py::test_my_projects_is_protected_once_it_exists` pins that.
[importlinter:contract:private-projects-importers-named]
name = only the app, the erasure routes and retention may import the modules that read private projects (docs/19 §5.2)
type = protected
as_packages = False
protected_modules =
    services.api.my_projects
    services.api.account_erasure
    services.retention
    services.retention.**
allowed_importers =
    services.api.app
    services.api.test_my_projects
    services.api.auth_routes
    services.api.admin_people
    services.retention
    services.retention.**
